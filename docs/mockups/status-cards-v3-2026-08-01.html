<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การ์ดสถานะ รอบ 3 — Anajak ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sans:"Prompt",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --bg:#f5f5f7;--card:#fff;--line:#e5e5ea;--text:#1d1d1f;--muted:#6e6e73;--subtle:#86868b;
    --blue:#3973b2;--blue-50:#e4edf6;--blue-700:#305f93;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.06);
    --hair:0 0 0 .5px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--text);
       -webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding:26px 20px 90px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
  .lead{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.6;max-width:76ch}
  .panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .toggle{display:inline-flex;background:#ececf0;border-radius:999px;padding:3px;gap:3px;margin-bottom:14px;flex-wrap:wrap}
  .toggle button{font-family:inherit;font-size:13px;font-weight:500;border:0;background:transparent;
    color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
  .toggle button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .note{font-size:12px;color:var(--muted);line-height:1.75;margin:14px 0 0}
  .note b{color:var(--text)}.good{color:#1a7f37}.bad{color:#c32219}
  .h{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:#86868b;border-radius:999px;padding:2px 9px;margin-bottom:10px}
  .stage{background:var(--bg);border-radius:14px;padding:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);width:950px;max-width:100%}
  .bar{display:flex;gap:8px;align-items:center;margin:12px 0}
  .field{height:36px;border-radius:999px;background:#fff;box-shadow:var(--hair);display:flex;align-items:center;
         gap:8px;padding:0 14px;font-size:13px;color:var(--subtle);flex:1;max-width:330px}
  .btnf{height:36px;border-radius:999px;background:#fff;box-shadow:var(--hair);display:inline-flex;align-items:center;
        gap:7px;padding:0 14px;font-size:13px;font-weight:500}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  td{padding:10px 12px;border-bottom:1px solid #f2f2f4;font-size:13px}
  tr:last-child td{border-bottom:0}
  .lk{color:var(--blue);font-weight:500}

  /* A · เต็มแถวพอดี 7×2 */
  .gA{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cA{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:9px 10px;cursor:pointer;text-align:left}
  .cA:hover{box-shadow:0 6px 20px rgba(0,0,0,.07),0 0 0 .5px rgba(0,0,0,.055)}
  .cA.on{background:var(--blue-50);box-shadow:0 0 0 1.5px var(--blue)}
  .cA .l{font-size:11px;color:var(--muted);line-height:1.3;display:flex;align-items:center;gap:5px}
  .cA .d{width:6px;height:6px;border-radius:99px;flex:none}
  .cA .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:3px}

  /* B · แยกกลุ่มตามระยะงาน */
  .gB{display:flex;gap:8px;flex-wrap:wrap}
  .grp{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;flex:1;min-width:190px}
  .grp .gh{font-size:11px;font-weight:600;color:var(--subtle);text-transform:uppercase;letter-spacing:.04em;
           display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .grp .gh b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
  .grp .items{display:flex;flex-direction:column;gap:3px}
  .it{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 6px;
      border-radius:7px;cursor:pointer;color:var(--muted)}
  .it:hover{background:#f5f5f7}
  .it.on{background:var(--blue-50);color:var(--blue-700);font-weight:500}
  .it .v{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
  .it .v.z{color:#c7c7cc}
  .it .nm{display:flex;align-items:center;gap:5px;min-width:0}
  .it .d{width:5px;height:5px;border-radius:99px;flex:none}

  /* C · แถบเดียวเรียงเป็นเส้นทาง */
  .gC{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
  .flow{display:flex;align-items:stretch;gap:2px}
  .fi{flex:1;padding:7px 8px;border-radius:9px;cursor:pointer;text-align:center;min-width:0}
  .fi:hover{background:#f5f5f7}
  .fi.on{background:var(--blue-50)}
  .fi .n{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
  .fi .n.z{color:#d2d2d7;font-weight:400}
  .fi .l{font-size:10px;color:var(--muted);line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fi .bar{height:3px;border-radius:99px;margin-top:6px;background:#f0f0f3;overflow:hidden}
  .fi .bar i{display:block;height:100%;border-radius:99px}
  .grpline{display:flex;gap:2px;margin-bottom:6px}
  .gl{flex:1;font-size:10px;font-weight:600;color:var(--subtle);text-transform:uppercase;letter-spacing:.04em;
      text-align:center;padding-bottom:4px;border-bottom:2px solid #ececf0}
</style>
</head>
<body>
<div class="wrap">
  <h1>การ์ดสถานะ — จัดใหม่รอบ 3</h1>
  <p class="lead">ปัญหาของแบบปัจจุบัน: <b>11 ใบจาก 14 เป็นเลข 0</b> แต่กินที่เท่าใบที่มีงานจริง · แถวสุดท้ายเหลือ 4 ใบไม่เต็มแถว · การ์ดกว้าง ~300px แต่มีแค่ชื่อกับเลข ช่องว่างตรงกลางเวิ้งว้าง · ข้างล่างคือ 3 ทางแก้ กดสลับดู (เวทีกว้าง 950px เท่าจริง)</p>

  <div class="panel">
    <div class="toggle">
      <button id="tA" class="on">A · เต็มแถวพอดี</button>
      <button id="tB">B · แยกกลุ่มตามระยะงาน</button>
      <button id="tC">C · เส้นทางงานแถวเดียว</button>
    </div>
    <div class="stage" id="stage"></div>
    <p class="note" id="note"></p>
  </div>
</div>

<script>
const ST = [
  ['ร่าง',0,'#86868b','รับงาน'],['สอบถาม',17,'#86868b','รับงาน'],['ยืนยันออเดอร์',17,'#3973b2','รับงาน'],
  ['กำลังออกแบบ',2,'#3973b2','ออกแบบ'],['อนุมัติแบบแล้ว',0,'#3973b2','ออกแบบ'],
  ['รอคิวผลิต',0,'#cf9209','ผลิต'],['กำลังผลิต',20,'#cf9209','ผลิต'],['ตรวจสอบคุณภาพ',0,'#cf9209','ผลิต'],
  ['กำลังแพ็ค',0,'#cf9209','ส่งของ'],['พร้อมจัดส่ง',0,'#cf9209','ส่งของ'],['จัดส่งแล้ว',0,'#3973b2','ส่งของ'],
  ['เสร็จสิ้น',0,'#1a8754','ปิดงาน'],['พักงาน',0,'#cf9209','ปิดงาน'],['ยกเลิก',21,'#c32219','ปิดงาน'],
];
const MAX = Math.max(...ST.map(s=>s[1]));
const BAR = `<div class="bar"><div class="field">🔍 ค้นหาเลขออเดอร์, ชื่อ, ลูกค้า…</div><span class="btnf">▽ ตัวกรอง</span></div>`;
const TABLE = `<table>
  <tr><th>เลขออเดอร์</th><th>ลูกค้า</th><th>สถานะ</th><th style="text-align:right">ยอดรวม</th></tr>
  <tr><td class="lk">ORD-2607-0055</td><td>บริษัท สยามเท็กซ์</td><td>รับออเดอร์</td><td style="text-align:right">฿1,284</td></tr>
  <tr><td class="lk">ORD-2607-0051</td><td>ร้านกีฬาเจริญพร</td><td>กำลังผลิต</td><td style="text-align:right">฿1,284</td></tr>
  <tr><td class="lk">ORD-2607-0047</td><td>โรงเรียนบ้านสวน</td><td>ยกเลิก</td><td style="text-align:right">฿1,284</td></tr></table>`;

const A = () => '<div class="h">สูง ~120px · 7 ใบ × 2 แถว เต็มพอดี</div><div class="gA">' +
  ST.map(([l,n,c])=>`<div class="cA ${l==='กำลังผลิต'?'on':''}">
    <div class="l"><span class="d" style="background:${c}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span></div>
    <div class="n" style="${n===0?'color:#c7c7cc;font-weight:400':''}">${n}</div></div>`).join('') +
  '</div>' + BAR + TABLE;

const B = () => {
  const groups = [...new Set(ST.map(s=>s[3]))];
  return '<div class="h">สูง ~155px · จัดกลุ่มตามระยะงาน</div><div class="gB">' +
  groups.map(g=>{
    const items = ST.filter(s=>s[3]===g);
    const sum = items.reduce((a,b)=>a+b[1],0);
    return `<div class="grp"><div class="gh"><span>${g}</span><b>${sum}</b></div><div class="items">` +
      items.map(([l,n,c])=>`<div class="it ${l==='กำลังผลิต'?'on':''}">
        <span class="nm"><span class="d" style="background:${c}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span></span>
        <span class="v ${n===0?'z':''}">${n}</span></div>`).join('') + '</div></div>';
  }).join('') + '</div>' + BAR + TABLE;
};

const C = () => {
  const groups = [...new Set(ST.map(s=>s[3]))];
  return '<div class="h">สูง ~95px · อ่านเป็นเส้นทางงานซ้ายไปขวา</div><div class="gC">' +
  '<div class="grpline">' + groups.map(g=>{
      const w = ST.filter(s=>s[3]===g).length;
      return `<div class="gl" style="flex:${w}">${g}</div>`;
    }).join('') + '</div>' +
  '<div class="flow">' + ST.map(([l,n,c])=>`<div class="fi ${l==='กำลังผลิต'?'on':''}">
      <div class="n ${n===0?'z':''}">${n}</div><div class="l">${l}</div>
      <div class="bar"><i style="width:${MAX?Math.round(n/MAX*100):0}%;background:${c}"></i></div></div>`).join('') +
  '</div></div>' + BAR + TABLE;
};

const NOTES={
  A:'<b class="good">A · เต็มแถวพอดี:</b> 7 ใบ × 2 แถวลงตัวพอดี 14 สถานะ ไม่มีแถวที่เหลือครึ่งๆ · การ์ดแคบลงเหลือ ~128px ช่องว่างตรงกลางหายไป · สูง ~120px (จาก ~210px) · <b>ข้อแลก:</b> ชื่อสถานะยาวๆ อย่าง "ตรวจสอบคุณภาพ" ต้องตัดคำ',
  B:'<b>B · แยกกลุ่มตามระยะงาน:</b> รวมเป็น 5 กลุ่ม (รับงาน · ออกแบบ · ผลิต · ส่งของ · ปิดงาน) มีเลขรวมของกลุ่มตัวใหญ่ให้ดูภาพรวมเร็ว แล้วแตกรายสถานะข้างใน · เลข 0 ยังอยู่แต่เล็กและจาง ไม่กินที่เท่าใบเต็ม · เหมาะถ้าเบสคิดเป็น "ระยะของงาน" มากกว่าคิดเป็นสถานะเดี่ยวๆ',
  C:'<b>C · เส้นทางงานแถวเดียว:</b> เตี้ยที่สุด ~95px · อ่านซ้ายไปขวาเป็นเส้นทางงานจริงตั้งแต่รับงานจนปิดงาน มีแถบสัดส่วนใต้เลขให้เห็นว่างานกองอยู่ช่วงไหน · <b>ข้อแลก:</b> ช่องแคบ ชื่อสถานะยาวจะถูกตัด และกดยากกว่าบนมือถือ'
};
function render(m){
  document.getElementById('stage').innerHTML = m==='A'?A():m==='B'?B():C();
  document.getElementById('note').innerHTML = NOTES[m];
  ['A','B','C'].forEach(x=>document.getElementById('t'+x).classList.toggle('on',x===m));
}
document.getElementById('tA').onclick=()=>render('A');
document.getElementById('tB').onclick=()=>render('B');
document.getElementById('tC').onclick=()=>render('C');
render('A');
</script>
</body>
</html>
