<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวกรอง 3 แบบ — Anajak ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sans:"Prompt",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --bg:#f5f5f7;--card:#fff;--line:#e5e5ea;--text:#1d1d1f;--muted:#6e6e73;--subtle:#86868b;
    --blue:#3973b2;--blue-50:#e4edf6;--blue-700:#305f93;
    --card-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.06);
    --float:0 20px 60px rgba(0,0,0,.15);--hair:0 0 0 .5px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--text);
       -webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding:28px 20px 90px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
  .lead{font-size:14px;color:var(--muted);margin:0 0 22px;line-height:1.6;max-width:70ch}
  .panel{background:var(--card);border-radius:16px;box-shadow:var(--card-shadow);padding:20px;margin-bottom:18px}
  .panel h2{font-size:16px;font-weight:600;margin:0 0 4px}
  .panel .sub{font-size:12px;color:var(--subtle);margin:0 0 14px;line-height:1.55}
  .toggle{display:inline-flex;background:#ececf0;border-radius:999px;padding:3px;gap:3px;margin-bottom:16px;flex-wrap:wrap}
  .toggle button{font-family:inherit;font-size:13px;font-weight:500;border:0;background:transparent;
    color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
  .toggle button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin:14px 0 0}
  .note b{color:var(--text)}.good{color:#1a7f37}.bad{color:#c32219}

  /* เวที */
  .stage{position:relative;background:var(--bg);border-radius:14px;padding:16px;overflow:hidden;
         box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);height:520px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative;z-index:5}
  .field{height:36px;border-radius:999px;background:#fff;box-shadow:var(--hair);display:flex;align-items:center;
         gap:8px;padding:0 14px;font-size:13px;color:var(--subtle);cursor:pointer}
  .field.grow{flex:1;min-width:180px;max-width:340px}
  .chip{height:32px;display:inline-flex;align-items:center;padding:0 13px;border-radius:999px;background:#fff;
        box-shadow:var(--hair);font-size:12px;font-weight:500;cursor:pointer}
  .chip.on{background:var(--blue);color:#fff;box-shadow:none}
  .chips{display:flex;gap:6px;margin-left:auto}
  .btnf{height:36px;border-radius:999px;background:#fff;box-shadow:var(--hair);display:inline-flex;align-items:center;
        gap:6px;padding:0 14px;font-size:13px;font-weight:500;cursor:pointer}
  .btnf.act{background:var(--blue-50);color:var(--blue-700);box-shadow:none}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;
        box-shadow:var(--card-shadow);margin-top:12px}
  th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid #f2f2f4;font-size:13px}
  tr:last-child td{border-bottom:0}
  .lk{color:var(--blue);font-weight:500}

  /* กล่องกรอง (เนื้อหาเดียวกันทั้ง 3 แบบ) */
  .fbody{display:flex;flex-direction:column;gap:12px}
  .frow{display:flex;gap:8px;align-items:flex-start}
  .frow .lb{font-size:12px;color:var(--muted);width:86px;flex:none;padding-top:6px}
  .frow .vals{display:flex;gap:6px;flex-wrap:wrap}
  .mini{height:28px;display:inline-flex;align-items:center;padding:0 11px;border-radius:999px;background:#fff;
        box-shadow:var(--hair);font-size:12px;cursor:pointer}
  .mini.on{background:var(--blue);color:#fff;box-shadow:none}

  /* แบบ ก — ดันลง */
  .inline{background:#fff;border-radius:16px;box-shadow:var(--card-shadow);padding:14px;margin-top:10px}

  /* แบบ ข — ลอยใต้ปุ่ม */
  .pop{position:absolute;top:60px;left:16px;width:520px;background:#fff;border-radius:16px;
       box-shadow:var(--float);padding:14px;z-index:20}
  .pop:after{content:"";position:absolute;top:-6px;left:210px;width:12px;height:12px;background:#fff;transform:rotate(45deg)}

  /* แบบ ค — ลิ้นชักขวา */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:15}
  .drawer{position:absolute;top:0;right:0;bottom:0;width:340px;background:#fff;z-index:20;
          box-shadow:var(--float);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
  .drawer .dh{display:flex;justify-content:space-between;align-items:center}
  .drawer .dh b{font-size:16px}
  .drawer .frow{flex-direction:column;gap:6px}
  .drawer .frow .lb{width:auto;padding:0}
  .dfoot{margin-top:auto;display:flex;gap:8px}
  .dbtn{flex:1;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
        font-size:13px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
  .dbtn.ghost{background:#f0f0f3;color:var(--text)}
  .x{width:28px;height:28px;border-radius:999px;background:#f0f0f3;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ตัวกรอง — เลือกทรงให้ทั้งเว็บ</h1>
  <p class="lead">ปัญหาวันนี้: กดปุ่มตัวกรองแล้วกล่องแทรกลงมา <b>ดันตารางข้อมูลหนีลงไป</b> ตำแหน่งที่ตามองอยู่หายทันที และ pattern นี้กระจายอยู่หลายหน้า · เลือกแบบที่ชอบ แล้วฉันจะทำเป็นของกลางให้ทุกหน้าใช้ตัวเดียวกัน</p>

  <div class="panel">
    <div class="toggle">
      <button id="tA">ก · ดันลง (ของวันนี้)</button>
      <button id="tB">ข · ลอยใต้ปุ่ม</button>
      <button id="tC" class="on">ค · ลิ้นชักขวา</button>
    </div>

    <div class="stage" id="stage"></div>
    <p class="note" id="note"></p>
  </div>
</div>

<script>
const FILTER_BODY = `
  <div class="fbody">
    <div class="frow"><span class="lb">ช่องทาง</span><span class="vals">
      <span class="mini on">ทุกช่องทาง</span><span class="mini">Shopee</span><span class="mini">Lazada</span><span class="mini">TikTok</span><span class="mini">LINE</span><span class="mini">หน้าร้าน</span></span></div>
    <div class="frow"><span class="lb">ประเภท</span><span class="vals">
      <span class="mini on">ทุกประเภท</span><span class="mini">สำเร็จรูป</span><span class="mini">Custom</span></span></div>
    <div class="frow"><span class="lb">สถานะลูกค้า</span><span class="vals">
      <span class="mini on">ทุกสถานะ</span><span class="mini">รับออเดอร์</span><span class="mini">กำลังผลิต</span><span class="mini">พร้อมส่ง</span><span class="mini">เสร็จสิ้น</span></span></div>
    <div class="frow"><span class="lb">สถานะภายใน</span><span class="vals">
      <span class="mini on">ทุกสถานะ</span><span class="mini">ร่าง</span><span class="mini">ยืนยันออเดอร์</span><span class="mini">รอคิวผลิต</span><span class="mini">ตรวจคุณภาพ</span></span></div>
    <div class="frow"><span class="lb">วันที่สร้าง</span><span class="vals">
      <span class="mini">31/07/2026</span><span style="align-self:center;color:var(--muted);font-size:12px">ถึง</span><span class="mini">31/07/2026</span></span></div>
  </div>`;

const BAR = `
  <div class="bar">
    <div class="field grow">🔍 ค้นหาเลขออเดอร์, ชื่อ, ลูกค้า…</div>
    <div class="field">วันที่ (ล่าสุด) ⌄</div>
    <div class="btnf act" id="fbtn">▽ ตัวกรอง <span style="background:var(--blue);color:#fff;border-radius:999px;padding:0 6px;font-size:11px">2</span></div>
    <div class="chips"><span class="chip on">ทุกงาน</span><span class="chip">เลยกำหนด</span><span class="chip">ใกล้กำหนด</span></div>
  </div>`;

const TABLE = `
  <table>
    <tr><th>เลขออเดอร์</th><th>ลูกค้า</th><th>ช่องทาง</th><th>สถานะ</th><th style="text-align:right">ยอดรวม</th></tr>
    <tr><td class="lk">ORD-2607-0058</td><td>บริษัท สยามเท็กซ์</td><td>LINE</td><td>กำลังผลิต</td><td style="text-align:right">฿1,284</td></tr>
    <tr><td class="lk">ORD-2607-0057</td><td>ร้านกีฬาเจริญพร</td><td>LINE</td><td>รับออเดอร์</td><td style="text-align:right">฿1,070</td></tr>
    <tr><td class="lk">ORD-2607-0056</td><td>โรงเรียนบ้านสวน</td><td>Shopee</td><td>ยกเลิก</td><td style="text-align:right">฿1,284</td></tr>
    <tr><td class="lk">ORD-2607-0055</td><td>ทีมฟุตบอลลุงหมี</td><td>Shopee</td><td>รับออเดอร์</td><td style="text-align:right">฿1,284</td></tr>
  </table>`;

const NOTES = {
  A:'<b class="bad">ก · ดันลง (ของวันนี้):</b> กล่องแทรกกลางหน้า ตารางถูกดันหนีลงไป ~400px — แถวที่กำลังดูอยู่หายจากจอทันที ต้องเลื่อนตามหา · ปิดกล่องแล้วตารางเด้งกลับขึ้นมาอีก ตำแหน่งกระโดดสองรอบ',
  B:'<b>ข · ลอยใต้ปุ่ม:</b> ตารางอยู่นิ่งสนิท ไม่ขยับสักพิกเซล · เห็นผลการกรองเปลี่ยนทันทีขณะเลือก · เหมาะเวลาตัวกรองไม่เยอะ แต่ของเรามี 5 หมวด กล่องจะสูงจนเกือบเต็มจอบนโน้ตบุ๊ก และบนมือถือแทบใช้ไม่ได้',
  C:'<b class="good">ค · ลิ้นชักขวา (ฉันแนะนำ):</b> ตารางอยู่นิ่ง · มีที่ให้ตัวกรองครบทุกหมวดโดยไม่อึดอัด เลื่อนในลิ้นชักได้ถ้ายาว · บนมือถือกลายเป็นถาดเลื่อนขึ้นจากล่าง (ระบบมีของชิ้นนี้อยู่แล้ว) · มีปุ่ม "ล้างทั้งหมด" กับ "ดูผลลัพธ์" ชัดเจน · กด Esc หรือกดพื้นที่มืดเพื่อปิด'
};

function render(mode){
  const st=document.getElementById('stage');
  if(mode==='A') st.innerHTML = BAR + `<div class="inline">${FILTER_BODY}</div>` + TABLE;
  if(mode==='B') st.innerHTML = BAR + TABLE + `<div class="pop">${FILTER_BODY}</div>`;
  if(mode==='C') st.innerHTML = BAR + TABLE + `<div class="scrim"></div><div class="drawer">
      <div class="dh"><b>ตัวกรอง</b><span class="x">✕</span></div>${FILTER_BODY}
      <div class="dfoot"><span class="dbtn ghost">ล้างทั้งหมด</span><span class="dbtn">ดูผลลัพธ์ 24 รายการ</span></div>
    </div>`;
  document.getElementById('note').innerHTML = NOTES[mode];
  ['A','B','C'].forEach(m=>document.getElementById('t'+m).classList.toggle('on',m===mode));
}
document.getElementById('tA').onclick=()=>render('A');
document.getElementById('tB').onclick=()=>render('B');
document.getElementById('tC').onclick=()=>render('C');
render('C');
</script>
</body>
</html>
