<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การ์ดสถานะแบบตาราง — Anajak ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sans:"Prompt",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --bg:#f5f5f7;--card:#fff;--line:#e5e5ea;--text:#1d1d1f;--muted:#6e6e73;--subtle:#86868b;
    --blue:#3973b2;--blue-50:#e4edf6;--blue-700:#305f93;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.06);
    --hair:0 0 0 .5px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--text);
       -webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding:26px 20px 90px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
  .lead{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.6;max-width:74ch}
  .panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .panel h2{font-size:16px;font-weight:600;margin:0 0 4px}
  .toggle{display:inline-flex;background:#ececf0;border-radius:999px;padding:3px;gap:3px;margin-bottom:14px;flex-wrap:wrap}
  .toggle button{font-family:inherit;font-size:13px;font-weight:500;border:0;background:transparent;
    color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
  .toggle button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin:14px 0 0}
  .note b{color:var(--text)}.good{color:#1a7f37}.bad{color:#c32219}
  .h{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:#86868b;border-radius:999px;padding:2px 9px;margin-bottom:10px}

  .stage{background:var(--bg);border-radius:14px;padding:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
         width:950px;max-width:100%}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .field{height:36px;border-radius:999px;background:#fff;box-shadow:var(--hair);display:flex;align-items:center;
         gap:8px;padding:0 14px;font-size:13px;color:var(--subtle)}
  .search{flex:1;min-width:200px;max-width:330px}
  .btnf{height:36px;border-radius:999px;background:#fff;box-shadow:var(--hair);display:inline-flex;align-items:center;
        gap:7px;padding:0 14px;font-size:13px;font-weight:500}

  /* A · แบบระบบเก่า */
  .gridA{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .cA{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;transition:.15s}
  .cA:hover{box-shadow:0 6px 20px rgba(0,0,0,.07),0 0 0 .5px rgba(0,0,0,.055);transform:translateY(-1px)}
  .cA .l{font-size:13px;font-weight:600;line-height:1.35;min-height:36px}
  .cA .n{font-size:34px;font-weight:400;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}

  /* B · การ์ดกระชับ */
  .gridB{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-bottom:12px}
  .cB{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;cursor:pointer;transition:.15s;
      display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cB:hover{box-shadow:0 6px 20px rgba(0,0,0,.07),0 0 0 .5px rgba(0,0,0,.055)}
  .cB.on{box-shadow:0 0 0 1.5px var(--blue), var(--shadow);background:var(--blue-50)}
  .cB .l{font-size:12px;color:var(--muted);line-height:1.3}
  .cB .n{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .cB .d{width:6px;height:6px;border-radius:99px;display:inline-block;margin-right:5px;vertical-align:middle}

  /* C · ชิป (ของตอนนี้) */
  .sbar{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:12px}
  .srow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .st{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;
      background:#f7f7f8;cursor:pointer;font-size:12px;white-space:nowrap}
  .st.on{background:var(--blue-50);box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue-700);font-weight:500}
  .st .d{width:6px;height:6px;border-radius:99px}
  .st .n{font-weight:600;font-variant-numeric:tabular-nums}
  .more{font-size:12px;color:var(--muted);padding:0 8px;height:34px;display:inline-flex;align-items:center;cursor:pointer}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  td{padding:10px 12px;border-bottom:1px solid #f2f2f4;font-size:13px}
  tr:last-child td{border-bottom:0}
  .lk{color:var(--blue);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <h1>การ์ดสถานะแบบตาราง</h1>
  <p class="lead">เวทีกว้าง 950px เท่าพื้นที่จริงของเบส · ตัวเลขมุมขวาบนของแต่ละแบบคือ <b>ความสูงที่กินก่อนถึงตาราง</b> — จอทำงานของเบสสูงประมาณ 700px หลังหักแถบเบราว์เซอร์</p>

  <div class="panel">
    <div class="toggle">
      <button id="tA" class="on">A · แบบระบบเก่า</button>
      <button id="tB">B · การ์ดกระชับ</button>
      <button id="tC">C · ชิป (ของตอนนี้)</button>
    </div>
    <div class="stage" id="stage"></div>
    <p class="note" id="note"></p>
  </div>
</div>

<script>
const ST = [
  ['ร่าง',0,'#86868b'],['สอบถาม',17,'#86868b'],['ยืนยันออเดอร์',17,'#3973b2'],['กำลังออกแบบ',2,'#3973b2'],
  ['อนุมัติแบบแล้ว',0,'#3973b2'],['รอคิวผลิต',0,'#cf9209'],['กำลังผลิต',20,'#cf9209'],['ตรวจสอบคุณภาพ',0,'#cf9209'],
  ['กำลังแพ็ค',0,'#cf9209'],['พร้อมจัดส่ง',0,'#cf9209'],['จัดส่งแล้ว',0,'#3973b2'],['เสร็จสิ้น',0,'#1a8754'],
  ['พักงาน',0,'#cf9209'],['ยกเลิก',21,'#c32219'],
];

const BAR = `
  <div class="bar">
    <div class="field search">🔍 ค้นหาเลขออเดอร์, ชื่อ, ลูกค้า…</div>
    <span class="btnf">▽ ตัวกรอง</span>
  </div>`;

const TABLE = `
  <table>
    <tr><th>เลขออเดอร์</th><th>ลูกค้า</th><th>ระยะเวลาออเดอร์</th><th>สถานะ</th><th style="text-align:right">ยอดรวม</th></tr>
    <tr><td class="lk">ORD-2607-0058</td><td>บริษัท สยามเท็กซ์</td><td>เหลือ 5 วัน</td><td>กำลังผลิต</td><td style="text-align:right">฿1,284</td></tr>
    <tr><td class="lk">ORD-2607-0057</td><td>ร้านกีฬาเจริญพร</td><td>เลย 2 วัน</td><td>รับออเดอร์</td><td style="text-align:right">฿1,070</td></tr>
    <tr><td class="lk">ORD-2607-0055</td><td>ทีมฟุตบอลลุงหมี</td><td>วันนี้</td><td>รับออเดอร์</td><td style="text-align:right">฿1,284</td></tr>
  </table>`;

const A = () => '<div class="h">สูงราว 520px ก่อนถึงตาราง</div>' + BAR + '<div class="gridA">' +
  ST.map(([l,n,c])=>`<div class="cA"><div class="l">${l}</div><div class="n" style="color:${n===0?'#c7c7cc':c}">${n}</div></div>`).join('') +
  '</div>' + TABLE;

const B = () => '<div class="h">สูงราว 210px ก่อนถึงตาราง</div>' + BAR + '<div class="gridB">' +
  ST.map(([l,n,c])=>`<div class="cB ${l==='กำลังผลิต'?'on':''}">
      <span class="l"><span class="d" style="background:${c}"></span>${l}</span>
      <span class="n" style="${n===0?'color:#c7c7cc':''}">${n}</span></div>`).join('') +
  '</div>' + TABLE;

const C = () => {
  const on = ST.filter(s=>s[1]>0);
  return '<div class="h">สูงราว 110px ก่อนถึงตาราง</div>' + BAR + '<div class="sbar"><div class="srow">' +
  on.map(([l,n,c])=>`<span class="st ${l==='กำลังผลิต'?'on':''}"><span class="d" style="background:${c}"></span>${l}<span class="n">${n}</span></span>`).join('') +
  `<span class="more">+${ST.length-on.length} สถานะที่ไม่มีงาน ⌄</span></div></div>` + TABLE;
};

const NOTES={
  A:'<b>A · แบบระบบเก่า:</b> เห็นครบ 14 สถานะพร้อมกัน ตัวเลขใหญ่อ่านง่ายจากระยะไกล · <b class="bad">ข้อแลก:</b> กินความสูงราว 520px จากจอ ~700px — ตารางเหลือที่ 1-2 แถว ต้องเลื่อนทุกครั้งที่เข้าหน้านี้ (อาการเดียวกับที่เบสเพิ่งให้แก้ไป) · การ์ด 8 ใบเป็นเลข 0 กินที่เท่าใบที่มีงานจริง',
  B:'<b class="good">B · การ์ดกระชับ (ฉันแนะนำ):</b> ยังเป็นการ์ดเรียงตารางเห็นครบ 14 สถานะพร้อมกันเหมือนระบบเก่า แต่ชื่อกับเลขอยู่บรรทัดเดียว สูงเหลือ ~210px · ตารางยังเห็น 5-6 แถว · มีจุดสีบอกกลุ่มงาน · ใบที่เลือกอยู่มีขอบน้ำเงินชัด',
  C:'<b>C · ชิป (ของตอนนี้):</b> เตี้ยที่สุด ~110px ตารางเห็นเยอะสุด · แต่ไม่ได้เรียงเป็นตารางแบบระบบเก่า และต้องกดเปิดถึงจะเห็นสถานะที่ไม่มีงาน'
};

function render(m){
  document.getElementById('stage').innerHTML = m==='A'?A():m==='B'?B():C();
  document.getElementById('note').innerHTML = NOTES[m];
  ['A','B','C'].forEach(x=>document.getElementById('t'+x).classList.toggle('on',x===m));
}
document.getElementById('tA').onclick=()=>render('A');
document.getElementById('tB').onclick=()=>render('B');
document.getElementById('tC').onclick=()=>render('C');
render('A');
</script>
</body>
</html>
