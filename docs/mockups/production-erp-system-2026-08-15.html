          <section class="surface section"><div class="section-head"><div><h2>คิวพร้อมทำ</h2><p>แสดงเฉพาะงานที่เสื้อ แบบ และขั้นก่อนหน้าพร้อม</p></div><span class="badge neutral">${queue.length} งาน</span></div><div class="queue-list">${queue.length ? queue.map(order => `<div class="queue-row"><div><button class="order-link" data-open-order="${order.id}">${order.id}</button><div class="order-sub">${escapeHtml(order.customer)} · ${escapeHtml(order.title)}</div></div><div class="tnum">${order.qty} ตัว</div><div class="due ${dueClass(order)}">${escapeHtml(order.due)}</div>${canOperate() ? `<button class="button primary" data-simulate="รับงาน ${order.id}">รับงาน</button>` : `<span class="badge neutral">ดูอย่างเดียว</span>`}</div>`).join("") : `<div class="empty"><div class="empty-icon">${icon("check")}</div><h3>คิวสถานีนี้ว่าง</h3><p>งานใหม่จะเข้ามาเมื่อขั้นก่อนหน้าเสร็จและวัตถุดิบพร้อม</p></div>`}</div>${blocked.length ? `<div class="divider"></div><div class="blocker">${icon("alert")}<p><strong>ยังไม่เข้าคิวพร้อมทำ ${blocked.length} งาน</strong><br>${blocked.map(order => `${order.id}: ${escapeHtml(order.blocker)}`).join(" · ")}</p></div>` : ""}</section>
          <section class="surface section"><div class="section-head"><div><h2>กำลังทำ</h2><p>งานที่สถานีรับแล้ว</p></div><span class="badge blue">${active.length} งาน</span></div>${active.length ? active.map(order => `<div class="active-job"><div><button class="order-link" data-open-order="${order.id}">${order.id}</button><div class="order-sub">${escapeHtml(order.customer)} · ${escapeHtml(order.title)}</div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${order.progress}" aria-label="คืบหน้า ${order.progress}%"><span style="width:${order.progress}%"></span></div></div><div><strong class="tnum">${Math.round(order.qty * order.progress / 100)} / ${order.qty}</strong><div class="muted">ทำแล้ว</div></div><button class="button ${canOperate() ? "primary" : ""}" data-open-order="${order.id}">${canOperate() ? "ทำต่อ" : "เปิดดู"}</button></div>`).join("") : `<div class="empty"><div class="empty-icon">${icon("clock")}</div><h3>ยังไม่มีงานกำลังทำ</h3><p>รับงานจากคิวเมื่อพร้อมเริ่มที่สถานีนี้</p></div>`}</section>
        </div>
      </div>`;
    }

    function renderSizeGrid(order) {
      return `<div class="size-grid">${Object.entries(order.size).map(([size, qty]) => `<div class="size-cell"><span>${size}</span><strong>${qty}</strong></div>`).join("")}</div>`;
    }

    function renderJob() {
      const order = selectedOrder();
      const isMixed = order.lanes.includes("ร้านนอก") && order.lanes.some(lane => lane === "DTF" || lane === "รีดร้อน");
      const reference = designReference(order);
      const materials = materialsForOrder(order);
      const prepReady = order.station !== "release" && !(order.status === "blocked" && order.blocker.includes("ไฟล์"));
      const productionDone = ["qc", "packing"].includes(order.station);
      const productionCurrent = prepReady && !productionDone;
      const rework = appState.reworks[order.id];
      const mainAction = canOperate() ? `<button class="button primary" data-simulate="${order.next} · ${order.id}">${escapeHtml(order.next)}</button>` : `<span class="badge neutral">ดูอย่างเดียว</span>`;
      return `<div class="page view-enter">
        ${pageHead(order.id, `${escapeHtml(order.customer)} · ${escapeHtml(order.title)}`, `<button class="button" data-view="control">${icon("arrow-left")} กลับศูนย์ควบคุม</button>`, `<div class="breadcrumb"><button data-view="control">การผลิต</button>${icon("chevron")}<span>ใบผลิต</span></div><div class="page-meta"><span class="due ${dueClass(order)}">กำหนดส่ง ${escapeHtml(order.due)}</span><span>${order.qty} ตัว</span>${order.priority ? `<span class="badge red">ต้องติดตาม</span>` : ""}${statusBadge(order)}</div>`)}
        ${roleNote()}
        <div class="job-grid">
          <div style="display:grid;gap:16px">
            <section class="surface now-card"><div class="now-header"><div><h2>ตอนนี้ต้องทำ</h2><p class="muted">ระบบแสดงเฉพาะงานที่ลงมือได้และเหตุผลของงานที่ยังรอ</p></div>${isMixed ? `<span class="badge neutral">งานผสม 2 สาย</span>` : ""}</div>
              <div class="task-block"><div class="task-symbol">${icon(order.nextView === "outsource" ? "store" : order.nextView === "qc" ? "shield" : order.nextView === "packing" ? "package" : "play")}</div><div class="task-copy"><h3>${escapeHtml(order.next)}</h3><p>${order.blocker ? escapeHtml(order.blocker) : `จำนวนเป้าหมาย ${order.qty} ตัว · เสร็จแล้วส่งต่อ ${order.nextView === "qc" ? "QC" : order.station === "packing" ? "พร้อมส่ง" : "สถานีถัดไป"}`}</p></div>${mainAction}</div>
              ${order.blocker ? `<div class="blocker">${icon("alert")}<p><strong>ยังต้องแก้ก่อน:</strong> ${escapeHtml(order.blocker)}</p></div>` : ""}
              ${isMixed ? `<div class="task-block"><div class="task-symbol">${icon("store")}</div><div class="task-copy"><h3>ติดตามงานร้านนอก</h3><p>สายงานเดินพร้อมกับ DTF ได้ แต่ต้องกลับและผ่าน QC ก่อนแพ็ก</p></div><button class="button" data-view="outsource">ดูร้านนอก</button></div>` : ""}
              ${rework ? `<div class="task-block"><div class="task-symbol">${icon("refresh")}</div><div class="task-copy"><h3>งานแก้ ${rework.qty} ตัว</h3><p>${escapeHtml(rework.reason)} · สถานะ ${rework.stage === "waiting" ? "รอเริ่มแก้" : rework.stage === "working" ? "กำลังแก้" : "รอตรวจซ้ำ"}</p></div><button class="button" data-open-rework="${order.id}">เปิดงานแก้</button></div>` : ""}
            </section>
            <section class="surface section"><div class="section-head"><div><h2>ขั้นตอนทั้งหมด</h2><p>ผลิตทุกสายให้ครบ → QC → แพ็กส่งครั้งเดียว</p></div></div><div class="step-list">
              <div class="step-row ${prepReady ? "done" : "current"}"><span class="step-mark">${prepReady ? icon("check") : "1"}</span><div><strong>เตรียมเสื้อและแบบ</strong><div class="muted">${prepReady ? "ของครบ · แบบอนุมัติแล้ว" : escapeHtml(order.blocker || "รอของและแบบให้พร้อม")}</div></div><span class="badge ${prepReady ? "green" : "amber"}">${prepReady ? "เสร็จ" : "ยังไม่พร้อม"}</span></div>
              <div class="step-row ${productionDone ? "done" : productionCurrent ? "current" : "waiting"}"><span class="step-mark">${productionDone ? icon("check") : "2"}</span><div><strong>ผลิตตามสายงาน</strong><div class="muted">${escapeHtml(order.lanes.filter(lane => !["QC","แพ็กส่ง","งานแก้"].includes(lane)).join(" · "))}</div></div><span class="badge ${productionDone ? "green" : productionCurrent ? "blue" : "neutral"}">${productionDone ? "เสร็จ" : productionCurrent ? "กำลังทำ" : "รอขั้นเตรียม"}</span></div>
              <div class="step-row ${order.station === "qc" ? "current" : order.station === "packing" ? "done" : "waiting"}"><span class="step-mark">3</span><div><strong>ตรวจคุณภาพ QC</strong><div class="muted">นับจำนวนดี/เสียและเปิดงานแก้เมื่อจำเป็น</div></div><span>${order.station === "qc" ? "ตอนนี้" : order.station === "packing" ? "ผ่านแล้ว" : "รอผลิตครบ"}</span></div>
              <div class="step-row ${order.station === "packing" ? "current" : "waiting"}"><span class="step-mark">4</span><div><strong>แพ็กเพื่อจัดส่ง</strong><div class="muted">เกิดครั้งเดียวหลัง QC ผ่านครบ</div></div><span>${order.station === "packing" ? "ตอนนี้" : "รอ QC"}</span></div>
            </div></section>
          </div>
          <div style="display:grid;gap:16px">
            <section class="surface section"><div class="section-head"><div><h2>แบบและจำนวน</h2><p>ข้อมูลอ้างอิงที่ช่างต้องใช้ ไม่แสดงราคา</p></div></div><div class="ref-grid"><div class="design-thumb">${icon("shirt")}<span class="sr-only">ภาพแบบตัวอย่าง</span></div><div><h3>${escapeHtml(reference.title)}</h3><p class="muted">${escapeHtml(reference.detail)}</p><button class="button quiet" data-simulate="เปิดภาพแบบเต็ม">เปิดภาพแบบเต็ม</button></div></div>${renderSizeGrid(order)}</section>
            <section class="surface section"><div class="section-head"><div><h2>เสื้อและวัตถุดิบ</h2><p>แสดงเฉพาะรายการที่ใช้กับสายงานนี้</p></div></div><dl class="info-list">${materials.map(item => `<div class="info-row"><dt>${escapeHtml(item.name)}</dt><dd><span class="badge ${item.readiness.includes("พร้อม") || item.readiness.includes("แล้ว") ? "green" : "amber"}">${escapeHtml(item.readiness)}</span></dd></div>`).join("")}</dl><button class="button full" data-open-materials="${order.id}" style="margin-top:12px">เบิก–คืนและดูประวัติ</button></section>
          </div>
        </div>
      </div>`;
    }

    function renderMaterials() {
      const order = selectedOrder();
      const materials = materialsForOrder(order);
      const balances = appState.materialBalances[order.id] || {};
      const history = appState.materialHistory[order.id] || [];
      const disabled = isReadOnly() ? "disabled aria-disabled=\"true\"" : "";
      return `<div class="page view-enter">
        ${pageHead("เบิก–คืนวัตถุดิบ", `${order.id} · ${escapeHtml(order.customer)} · ${escapeHtml(order.title)}`, `<button class="button" data-open-order="${order.id}">${icon("arrow-left")} กลับใบผลิต</button>`, `<div class="page-meta"><span>${order.qty} ตัว</span><span>${escapeHtml(order.work)}</span><span class="badge neutral">บันทึกในต้นแบบนี้เท่านั้น</span></div>`)}
        ${roleNote()}
        <div class="two-pane">
          <section class="surface section">
            <div class="section-head"><div><h2>รายการที่ใช้กับงานนี้</h2><p>เบิกและคืนเป็นยอดสะสม · ระบบกันยอดคืนมากกว่ายอดเบิก</p></div><span class="badge neutral">${materials.length} รายการ</span></div>
            <form id="materialForm">
              <div class="material-list">${materials.map(item => {
                const balance = balances[item.key] || {issued:0, returned:0};
                return `<div class="material-row" data-material-key="${item.key}"><div class="material-name"><strong>${escapeHtml(item.name)}</strong><span>ต้องใช้ ${item.required} ${escapeHtml(item.unit)} · ${escapeHtml(item.readiness)}</span></div><div class="field"><label for="issue-${item.key}">เบิกสะสม</label><input id="issue-${item.key}" data-material-issue="${item.key}" type="number" min="0" max="${item.required}" value="${balance.issued}" ${disabled}></div><div class="field"><label for="return-${item.key}">คืนสะสม</label><input id="return-${item.key}" data-material-return="${item.key}" type="number" min="0" max="${item.required}" value="${balance.returned}" ${disabled}></div><div class="summary-cell"><span>ใช้สุทธิ</span><strong class="tnum" data-material-net="${item.key}">${balance.issued - balance.returned} ${escapeHtml(item.unit)}</strong></div></div>`;
              }).join("")}</div>
              <div class="field" style="margin-top:14px"><label for="materialNote">หมายเหตุการเบิก–คืน</label><textarea id="materialNote" placeholder="เช่น คืนของเหลือหลังจบรอบ" ${disabled}></textarea></div>
              <div class="form-error" id="materialError" role="alert" aria-live="polite"></div>
              ${canOperate() ? `<button class="button primary" type="submit">บันทึกการเบิก–คืน</button>` : `<span class="badge neutral">ดูประวัติได้อย่างเดียว</span>`}
            </form>
          </section>
          <section class="surface section">
            <div class="section-head"><div><h2>ประวัติล่าสุด</h2><p>แยกผู้บันทึกและเวลา เพื่อย้อนตรวจได้</p></div></div>
            <div class="history-list">${history.length ? history.map(entry => `<div class="history-item"><time>${escapeHtml(entry.time)}</time><div><strong>${escapeHtml(entry.action)}</strong><span>${escapeHtml(entry.detail)}</span></div></div>`).join("") : `<div class="empty"><div class="empty-icon">${icon("boxes")}</div><h3>ยังไม่มีรายการเบิก–คืน</h3><p>บันทึกครั้งแรกจากแบบฟอร์มด้านซ้าย</p></div>`}</div>
          </section>
        </div>
      </div>`;
    }

    function renderPrint() {
      const queue = orders.filter(order => order.station === "dtf" && order.status === "ready" && !activeRunOrderIds.has(order.id));
      appState.printSelected = new Set([...appState.printSelected].filter(id => queue.some(order => order.id === id)));
      const run = appState.printRun;
      const runOrders = run.orderIds.map(id => orders.find(order => order.id === id)).filter(Boolean);
      const stageIndex = {printing:0, cutting:1, heat:2, idle:3}[run.stage];
      const runLabel = run.stage === "printing" ? "กำลังพิมพ์" : run.stage === "cutting" ? "รอตัดและติดป้าย" : run.stage === "heat" ? "ฟิล์มพร้อมรีด" : "ไม่มีรอบกำลังทำ";
      const runTone = run.stage === "printing" ? "blue" : run.stage === "cutting" ? "amber" : "green";
      const runAction = run.stage === "printing"
        ? `<button class="button primary full" data-print-run-action="finish" style="margin-top:14px">ยืนยันพิมพ์จบทั้งม้วน</button>`
        : run.stage === "cutting"
          ? `<button class="button primary full" data-print-run-action="cut" style="margin-top:14px">ยืนยันตัดแยกและติดป้ายครบ</button>`
          : run.stage === "heat"
            ? `<button class="button primary full" data-print-run-action="qc" style="margin-top:14px">ยืนยันรีดครบ · ส่งเข้า QC</button>`
            : "";
      return `<div class="page view-enter">
        ${pageHead("ศูนย์ DTF", "จัดรอบพิมพ์หลายออเดอร์ → ตัดแยกและติดป้าย → ส่งฟิล์มพร้อมรีด", `<button class="button" data-view="station">${icon("arrow-left")} กลับคิวสถานี</button>`)}
        ${roleNote()}
        <div class="two-pane">
          <div style="display:grid;gap:16px">
            <section class="surface section"><div class="section-head"><div><h2>${runLabel}</h2><p>${run.stage === "idle" ? "หัวหน้าผลิตเลือกรายการจากคิวเพื่อเปิดรอบใหม่" : "งานในรอบนี้ถูกถอดจากคิวเลือกซ้ำแล้ว"}</p></div>${run.stage === "idle" ? "" : `<span class="badge ${runTone}"><span class="status-dot"></span>${run.id}</span>`}</div>${run.stage === "idle" ? `<div class="empty"><div class="empty-icon">${icon("printer")}</div><h3>เครื่องพร้อมรับรอบใหม่</h3><p>เลือกรายการจากคิวด้านขวาแล้วเปิดรอบพิมพ์</p></div>` : `<div class="run-card"><div class="run-head"><div><strong>ม้วน DTF · ${runOrders.length} งาน</strong><div class="muted">เริ่ม ${run.started} · ${escapeHtml(run.operator)} เป็นผู้พิมพ์</div></div><strong class="tnum">${runOrders.reduce((sum, order) => sum + order.qty, 0)} ชิ้น</strong></div><div class="step-list" style="margin-top:12px"><div class="step-row ${stageIndex > 0 ? "done" : "current"}"><span class="step-mark">${stageIndex > 0 ? icon("check") : "1"}</span><div><strong>พิมพ์ทั้งม้วน</strong><div class="muted">ตรวจสีและความต่อเนื่องของลาย</div></div><span>${stageIndex > 0 ? "เสร็จ" : "ตอนนี้"}</span></div><div class="step-row ${stageIndex > 1 ? "done" : stageIndex === 1 ? "current" : "waiting"}"><span class="step-mark">${stageIndex > 1 ? icon("check") : "2"}</span><div><strong>ตัดแยกและติดป้าย</strong><div class="muted">แยกตามเลขออเดอร์ ป้องกันฟิล์มสลับงาน</div></div><span>${stageIndex === 1 ? "ตอนนี้" : stageIndex > 1 ? "เสร็จ" : "รอพิมพ์"}</span></div><div class="step-row ${stageIndex === 2 ? "current" : "waiting"}"><span class="step-mark">3</span><div><strong>รีดร้อน</strong><div class="muted">ยืนยันจำนวนครบก่อนส่ง QC</div></div><span>${stageIndex === 2 ? "ตอนนี้" : "รอตัด"}</span></div></div><div class="run-items">${runOrders.map(order => `<div class="run-item"><span>${order.id} · ${escapeHtml(order.customer)}</span><strong>${order.qty} ชิ้น</strong></div>`).join("")}</div>${canOperate() ? runAction : `<span class="badge neutral" style="margin-top:14px">ดูอย่างเดียว</span>`}</div>`}</section>
            <section class="surface section"><div class="section-head"><div><h2>รอบที่ปิดแล้ว</h2><p>ประวัติสั้นสำหรับยืนยันว่ารอบก่อนหน้าไปขั้นถัดไปแล้ว</p></div><span class="badge green">1 รอบ</span></div><div class="run-card"><div class="run-head"><div><strong>FR-2608-0017</strong><div class="muted">3 งาน · ส่งเข้า QC 10:18</div></div><span class="badge green">ครบทุกขั้น</span></div></div></section>
          </div>
          <section class="surface section"><div class="section-head"><div><h2>คิวพิมพ์</h2><p>เรียงกำหนดส่ง · หัวหน้าผลิตเลือกหลายงานเข้ารอบเดียวกัน</p></div><span class="badge neutral">${queue.length} งาน</span></div>
            ${appState.printSelected.size && isManager() ? `<div class="selection-bar"><strong>${appState.printSelected.size} งาน</strong><span class="muted">เลือกเข้ารอบ</span><button class="button primary" data-print-run-action="open" ${run.stage === "idle" ? "" : "disabled"}>${run.stage === "idle" ? "เปิดรอบพิมพ์" : "รอปิดรอบปัจจุบัน"}</button></div>` : ""}
            ${!isManager() ? `<div class="role-note">${icon("shield")}<span>${canOperate() ? "พนักงานสถานีทำรอบที่เปิดแล้วได้ แต่หัวหน้าผลิตเป็นผู้จัดคิวและเปิดรอบใหม่" : "เปิดดูคิวได้ แต่เลือกหรือแก้จำนวนไม่ได้"}</span></div>` : ""}
            <div>${queue.length ? queue.map(order => `<div class="select-row"><button class="check-button" data-print-select="${order.id}" aria-pressed="${appState.printSelected.has(order.id)}" aria-label="เลือก ${order.id}" ${isManager() ? "" : "disabled aria-disabled=\"true\""}>${icon("check")}</button><div><button class="order-link" data-open-order="${order.id}">${order.id}</button><div class="order-sub">${escapeHtml(order.customer)} · ${escapeHtml(order.title)}</div></div><label class="sr-only" for="qty-${order.id}">จำนวน ${order.id}</label><input class="qty-input" id="qty-${order.id}" type="number" min="1" max="${order.qty}" value="${order.qty}" ${isManager() ? "" : "disabled aria-disabled=\"true\""}><div class="due ${dueClass(order)}">${escapeHtml(order.due)}</div></div>`).join("") : `<div class="empty"><div class="empty-icon">${icon("check")}</div><h3>ไม่มีงานพร้อมจัดรอบ</h3><p>งานในรอบที่กำลังพิมพ์และงานติดขัดถูกแยกออกจากคิวนี้แล้ว</p></div>`}</div>
          </section>
        </div>
      </div>`;
    }

    function renderOutsource() {
      const stageRank = {working:0, ready:1, complete:2};
      const jobs = orders.filter(order => order.lanes.includes("ร้านนอก")).sort((a, b) => stageRank[outsourceRecords[a.id]?.stage] - stageRank[outsourceRecords[b.id]?.stage]);
      const current = orders.find(order => order.id === appState.outsourceSelected) || jobs[0];
      const record = outsourceRecords[current.id];
      const stageLabel = record.stage === "ready" ? "พร้อมสร้างใบส่งร้าน" : record.stage === "working" ? "อยู่ระหว่างทำที่ร้าน" : "รับกลับและ QC แล้ว";
      const stageTone = record.stage === "working" ? "amber" : "green";
      const steps = record.stage === "ready"
        ? `<div class="step-row current"><span class="step-mark">1</span><div><strong>สร้างและยืนยันใบส่งร้าน</strong><div class="muted">ระบุจำนวน ร้าน และวันรับกลับ</div></div><span class="badge blue">ตอนนี้</span></div><div class="step-row waiting"><span class="step-mark">2</span><div><strong>อยู่ระหว่างทำ</strong><div class="muted">เริ่มหลังร้านยืนยันรับ</div></div><span>รอส่ง</span></div><div class="step-row waiting"><span class="step-mark">3</span><div><strong>รับของกลับ</strong><div class="muted">นับตามไซซ์และบันทึกตำหนิ</div></div><span>รอร้าน</span></div><div class="step-row waiting"><span class="step-mark">4</span><div><strong>QC ร้านนอก</strong><div class="muted">ผ่านก่อนเดินต่อสายอื่น</div></div><span>รอของ</span></div>`
        : record.stage === "working"
          ? `<div class="step-row done"><span class="step-mark">${icon("check")}</span><div><strong>ส่งร้าน</strong><div class="muted">ส่ง ${record.sentQty} ตัว</div></div><span>${escapeHtml(record.sentAt)}</span></div><div class="step-row current"><span class="step-mark">2</span><div><strong>อยู่ระหว่างทำ</strong><div class="muted">ร้านยืนยันรับงานแล้ว</div></div><span class="badge amber">ติดตาม</span></div><div class="step-row waiting"><span class="step-mark">3</span><div><strong>รับของกลับ</strong><div class="muted">นับตามไซซ์และบันทึกตำหนิ</div></div><span>รอรับ</span></div><div class="step-row waiting"><span class="step-mark">4</span><div><strong>QC ร้านนอก</strong><div class="muted">ผ่านก่อนเดินต่อสายอื่น</div></div><span>รอของ</span></div>`
          : `<div class="step-row done"><span class="step-mark">${icon("check")}</span><div><strong>ส่งร้าน</strong><div class="muted">ส่งครบ ${record.sentQty} ตัว</div></div><span>${escapeHtml(record.sentAt)}</span></div><div class="step-row done"><span class="step-mark">${icon("check")}</span><div><strong>ร้านผลิตเสร็จ</strong><div class="muted">ปิดการติดตามร้านแล้ว</div></div><span>เสร็จ</span></div><div class="step-row done"><span class="step-mark">${icon("check")}</span><div><strong>รับของกลับ</strong><div class="muted">รับครบ ${record.sentQty} ตัว</div></div><span>${escapeHtml(record.returnedAt)}</span></div><div class="step-row done"><span class="step-mark">${icon("check")}</span><div><strong>QC ร้านนอก</strong><div class="muted">ผ่านครบและส่งต่อแพ็ก</div></div><span class="badge green">ผ่านแล้ว</span></div>`;
      const actions = record.stage === "ready"
        ? `<button class="button primary" data-outsource-action="send" data-order="${current.id}">สร้างและยืนยันใบส่งร้าน</button>`
        : record.stage === "working"
          ? `<button class="button" data-simulate="บันทึกการติดตาม ${current.id}">บันทึกการติดตาม</button><button class="button primary" data-outsource-action="receive" data-order="${current.id}">รับของกลับและส่ง QC</button>`
          : `<span class="badge green">ปิดงานร้านนอกแล้ว</span>`;
      return `<div class="page view-enter">
        ${pageHead("งานร้านนอก", "ส่งร้าน ติดตาม รับกลับ และตรวจรับในทะเบียนเดียว—ไม่ปนข้อมูลค่าจ้างในหน้าผลิต", isManager() ? `<button class="button" data-simulate="แชร์ทะเบียนให้ร้านทาง LINE">${icon("store")} แชร์ใบงานร้าน</button>` : "")}
        ${roleNote()}
        <div class="split-register">
          <section class="surface section"><div class="section-head"><div><h2>ทะเบียนงานร้าน</h2><p>งานกำลังทำขึ้นก่อน งานที่ปิดแล้วอยู่ท้ายรายการ</p></div><span class="badge neutral">${jobs.length} งาน</span></div><div class="register-list">${jobs.map(order => { const itemRecord = outsourceRecords[order.id]; const itemLabel = itemRecord.stage === "ready" ? "พร้อมส่งร้าน" : itemRecord.stage === "working" ? "อยู่ร้านนอก" : "รับกลับแล้ว"; return `<button class="register-row ${current.id === order.id ? "selected" : ""}" data-outsource-order="${order.id}"><span class="register-title">${order.id} · ${escapeHtml(order.customer)}</span><span class="badge ${itemRecord.stage === "working" ? "amber" : "green"}">${itemLabel}</span><span class="register-meta">${escapeHtml(order.work)} · ${order.qty} ตัว</span><span class="register-meta due ${dueClass(order)}">${escapeHtml(order.due)}</span></button>`; }).join("")}</div></section>
          <section class="surface section"><div class="section-head"><div><h2>${current.id}</h2><p>${escapeHtml(current.customer)} · ${escapeHtml(current.title)}</p></div><span class="badge ${stageTone}">${stageLabel}</span></div><div class="page-meta" style="margin-bottom:16px"><span>ร้าน: ${escapeHtml(record.vendor)}</span><span>${record.sentQty ? `ส่งแล้ว ${record.sentQty} ตัว` : "ยังไม่ส่งร้าน"}</span><span>รับกลับตามแผน ${escapeHtml(record.expected)}</span>${hasDtf(current) ? `<span class="badge ${record.dtfReady ? "green" : "amber"}">สาย DTF ${record.dtfReady ? "เสร็จแล้ว" : "ยังไม่ครบ"}</span>` : ""}</div>
            ${record.note ? `<div class="blocker" style="margin-bottom:12px">${icon(record.stage === "complete" ? "check" : "alert")}<p>${escapeHtml(record.note)}</p></div>` : ""}
            <div class="step-list">${steps}</div>
            <div class="divider"></div>${isManager() ? `<div class="section-actions">${actions}</div>` : `<span class="badge neutral">ดูประวัติได้อย่างเดียว</span>`}
          </section>
        </div>
      </div>`;
    }

    function renderQc() {
      const jobs = orders.filter(order => order.station === "qc").sort((a, b) => Number(b.statusLabel.includes("ของเสีย")) - Number(a.statusLabel.includes("ของเสีย")));
      const current = jobs.find(order => order.id === appState.qcSelected) || jobs[0];
      appState.qcSelected = current.id;
      const rework = appState.reworks[current.id];
      const progress = appState.qcProgress[current.id] || {good:0, defect:0};
      const inspected = progress.good + progress.defect;
      const remaining = Math.max(0, current.qty - inspected);
      const isRecheck = rework?.stage === "recheck";
      const qcLocked = Boolean(rework && ["waiting", "working"].includes(rework.stage));
      const inspectionTarget = isRecheck ? Math.max(0, rework.qty - (rework.qcPassed || 0)) : remaining;
      const disabled = isReadOnly() || qcLocked ? "disabled aria-disabled=\"true\"" : "";
      return `<div class="page view-enter">
        ${pageHead("QC และงานแก้", "ตรวจทุกงานหลังผลิตครบ ก่อนเข้าสู่แพ็กส่ง", `<span class="badge blue">ผลิต → QC → แพ็กส่ง</span>`)}
        ${roleNote()}
        <div class="split-register">
          <section class="surface section"><div class="section-head"><div><h2>คิวรอตรวจ</h2><p>งานพบปัญหาขึ้นก่อนงานปกติ</p></div><span class="badge neutral">${jobs.length} งาน</span></div><div class="register-list">${jobs.map(order => `<button class="register-row ${current.id === order.id ? "selected" : ""}" data-qc-order="${order.id}"><span class="register-title">${order.id} · ${escapeHtml(order.customer)}</span>${statusBadge(order)}<span class="register-meta">${order.qty} ตัว · ${escapeHtml(order.work)}</span><span class="register-meta due ${dueClass(order)}">${escapeHtml(order.due)}</span></button>`).join("")}</div></section>
          <section class="surface section"><div class="section-head"><div><h2>${isRecheck ? "ตรวจซ้ำ" : "ตรวจนับ"} ${current.id}</h2><p>${isRecheck ? `งานแก้คงเหลือ ${inspectionTarget} ตัว` : `ล็อตหลักคงเหลือ ${inspectionTarget} จาก ${current.qty} ตัว`} · รอบนี้เริ่ม 0 / 0</p></div><button class="button" data-open-order="${current.id}">เปิดใบผลิต</button></div>
            ${inspected ? `<div class="page-meta" style="margin-bottom:14px"><span class="badge neutral">ตรวจสะสม ${inspected}/${current.qty}</span><span class="badge green">ดี ${progress.good}</span><span class="badge red">พบเสีย ${progress.defect}</span><span>คงเหลือล็อตหลัก ${remaining} ตัว</span></div>` : ""}
            ${rework ? `<div class="blocker" style="margin-bottom:14px">${icon("refresh")}<p><strong>งานแก้ ${rework.qty} ตัว · ${rework.reason}</strong><br>${rework.stage === "waiting" ? "รอเริ่มแก้ก่อนตรวจซ้ำ" : rework.stage === "working" ? "กำลังแก้ ยังบันทึก QC ซ้ำไม่ได้" : rework.stage === "recheck" ? "ส่งกลับมาแล้ว พร้อมตรวจซ้ำ" : "ตรวจซ้ำผ่านแล้ว"} <button class="button quiet" type="button" data-open-rework="${current.id}">เปิดวงจรงานแก้</button></p></div>` : ""}
            <form id="qcForm" data-order-id="${current.id}" data-target="${inspectionTarget}" data-recheck="${rework?.stage === "recheck" ? "true" : "false"}"><div class="form-grid"><div class="field"><label for="qtyGood">จำนวนดี</label><input id="qtyGood" type="number" inputmode="numeric" min="0" max="${inspectionTarget}" value="0" aria-describedby="qcError" ${disabled}></div><div class="field"><label for="qtyDefect">จำนวนเสีย/ต้องแก้</label><input id="qtyDefect" type="number" inputmode="numeric" min="0" max="${inspectionTarget}" value="0" aria-describedby="qcError" ${disabled}></div><div class="field full"><label for="defectReason">เหตุผลเมื่อมีของเสีย</label><select id="defectReason" aria-describedby="qcError" ${disabled}><option value="">เลือกเหตุผล</option><option>ลายพิมพ์เยื้อง</option><option>สีไม่ตรงแบบ</option><option>ตำแหน่งผิด</option><option>เสื้อเสียหาย</option></select><span class="form-note">ถ้าจำนวนเสียมากกว่า 0 ต้องเลือกเหตุผล ระบบจะเปิดงานแก้และกันออกจากคิวแพ็ก</span></div><div class="field full"><label for="qcNote">หมายเหตุ QC</label><textarea id="qcNote" placeholder="ระบุจุดที่ต้องแก้ให้ชัดเจน" ${disabled}></textarea></div></div><div class="total-line"><span>รวมจำนวนที่ตรวจ</span><strong class="tnum" id="qcTotal">0 / ${inspectionTarget}</strong></div><div class="form-error" id="qcError" role="alert" aria-live="polite">${qcLocked ? "ต้องส่งงานแก้กลับมาก่อน จึงเริ่มรอบตรวจซ้ำได้" : "กรอกจำนวนที่ตรวจมากกว่า 0 เพื่อบันทึกผล"}</div>${canOperate() && !qcLocked ? `<button class="button primary" id="qcSubmit" type="submit" disabled>${rework?.stage === "recheck" ? "ยืนยันผลตรวจซ้ำ" : "บันทึกผล QC รอบนี้"}</button>` : `<span class="badge neutral">${qcLocked ? "รอวงจรงานแก้" : "ดูอย่างเดียว"}</span>`}</form>
          </section>
        </div>
      </div>`;
    }

    function renderRework() {
      const entries = Object.entries(appState.reworks);
      const selectedId = appState.reworkSelected && appState.reworks[appState.reworkSelected] ? appState.reworkSelected : entries[0]?.[0];
      if (!selectedId) return `<div class="page view-enter">${pageHead("งานแก้", "งานเสียจาก QC จะเข้าวงจรนี้ก่อนกลับไปตรวจซ้ำ", `<button class="button" data-view="qc">${icon("arrow-left")} กลับ QC</button>`)}<section class="surface"><div class="empty"><div class="empty-icon">${icon("check")}</div><h3>ไม่มีงานแก้ค้าง</h3><p>งานที่ QC ผ่านจะไปแพ็กโดยไม่ผ่านหน้านี้</p></div></section></div>`;
      const order = orders.find(item => item.id === selectedId);
      const rework = appState.reworks[selectedId];
      const stageIndex = {waiting:1, working:1, recheck:2, done:3}[rework.stage];
      const disabled = isReadOnly() || ["recheck", "done"].includes(rework.stage) ? "disabled aria-disabled=\"true\"" : "";
      const action = rework.stage === "waiting"
        ? `<button class="button primary" data-rework-action="start" data-order="${order.id}">เริ่มงานแก้ ${rework.qty} ตัว</button>`
        : rework.stage === "working"
          ? `<button class="button primary" data-rework-action="submit" data-order="${order.id}">ส่งกลับตรวจ QC</button>`
          : rework.stage === "recheck"
            ? `<button class="button primary" data-open-qc-order="${order.id}">เปิดรอบตรวจซ้ำ</button>`
            : `<span class="badge green">ตรวจซ้ำผ่านแล้ว</span>`;
      return `<div class="page view-enter">
        ${pageHead("วงจรงานแก้", `${order.id} · ${escapeHtml(order.customer)} · ${escapeHtml(order.title)}`, `<button class="button" data-view="qc">${icon("arrow-left")} กลับ QC</button>`, `<div class="page-meta"><span class="badge red">ของเสีย ${rework.qty} ตัว</span><span>${escapeHtml(rework.reason)}</span><span>อัปเดต ${escapeHtml(rework.updated)}</span></div>`)}
        ${roleNote()}
        <div class="two-pane">
          <section class="surface section"><div class="section-head"><div><h2>ลำดับงานแก้</h2><p>งานนี้จะไม่เข้าแพ็กจนกว่าจะตรวจซ้ำผ่าน</p></div></div><div class="step-list"><div class="step-row done"><span class="step-mark">${icon("check")}</span><div><strong>QC พบของเสีย</strong><div class="muted">${rework.qty} ตัว · ${escapeHtml(rework.reason)}</div></div><span>บันทึกแล้ว</span></div><div class="step-row ${stageIndex > 1 ? "done" : "current"}"><span class="step-mark">${stageIndex > 1 ? icon("check") : "2"}</span><div><strong>ผลิตแก้</strong><div class="muted">ส่งกลับสถานี ${escapeHtml(rework.workCenter)}</div></div><span>${rework.stage === "waiting" ? "รอเริ่ม" : rework.stage === "working" ? "กำลังแก้" : "ส่งกลับแล้ว"}</span></div><div class="step-row ${stageIndex > 2 ? "done" : stageIndex === 2 ? "current" : "waiting"}"><span class="step-mark">${stageIndex > 2 ? icon("check") : "3"}</span><div><strong>QC ตรวจซ้ำ</strong><div class="muted">ตรวจเฉพาะ ${rework.qty} ตัวที่แก้</div></div><span>${rework.stage === "recheck" ? "ตอนนี้" : rework.stage === "done" ? "ผ่านแล้ว" : "รอผลิตแก้"}</span></div><div class="step-row ${rework.stage === "done" ? "done" : "waiting"}"><span class="step-mark">${rework.stage === "done" ? icon("check") : "4"}</span><div><strong>กลับเข้า flow หลัก</strong><div class="muted">QC ผ่านครบแล้วจึงไปแพ็ก</div></div><span>${rework.stage === "done" ? "พร้อมไปต่อ" : "รอ QC"}</span></div></div></section>
          <section class="surface section"><div class="section-head"><div><h2>ใบงานแก้</h2><p>รายละเอียดที่สถานีต้องใช้ก่อนลงมือ</p></div><span class="badge ${rework.stage === "working" ? "blue" : rework.stage === "done" ? "green" : "amber"}">${rework.stage === "waiting" ? "รอเริ่มแก้" : rework.stage === "working" ? "กำลังแก้" : rework.stage === "recheck" ? "รอตรวจซ้ำ" : "เสร็จ"}</span></div><div class="rework-summary"><div class="summary-cell"><span>จำนวนแก้</span><strong>${rework.qty} ตัว</strong></div><div class="summary-cell"><span>สถานี</span><strong>${escapeHtml(rework.workCenter)}</strong></div><div class="summary-cell"><span>สาเหตุ</span><strong>${escapeHtml(rework.reason)}</strong></div></div><div class="field"><label for="reworkNote">วิธีแก้/หมายเหตุจากสถานี</label><textarea id="reworkNote" placeholder="เช่น พิมพ์ลายหลังใหม่ 4 ชิ้น" ${disabled}>${escapeHtml(rework.note)}</textarea></div><div class="divider"></div>${canOperate() ? action : `<span class="badge neutral">ดูอย่างเดียว</span>`}</section>
        </div>
      </div>`;
    }

    function renderPacking() {
      const jobs = orders.filter(order => order.station === "packing");
      const current = orders.find(order => order.id === appState.packSelected) || jobs[0];
      const checks = appState.packChecks[current.id] || [false, false, false, false];
      const checkLabels = ["ตรวจจำนวนตามไซซ์ครบ", "พับและใส่ถุงตามสเปก", "ติดฉลากกล่องและเลขออเดอร์", "ถ่ายรูปก่อนปิดกล่อง"];
      const disabled = isReadOnly() || appState.packed.has(current.id) ? "disabled aria-disabled=\"true\"" : "";
      return `<div class="page view-enter">
        ${pageHead("แพ็กและพร้อมส่ง", "แพ็กครั้งเดียวหลัง QC ผ่านครบ แล้วส่งต่อฝ่ายจัดส่ง", `<span class="badge green">QC ผ่านแล้วเท่านั้น</span>`)}
        ${roleNote()}
        <div class="split-register">
          <section class="surface section"><div class="section-head"><div><h2>คิวพร้อมแพ็ก</h2><p>เรียงกำหนดส่งและวิธีจัดส่ง</p></div><span class="badge neutral">${jobs.length} งาน</span></div><div class="register-list">${jobs.map(order => `<button class="register-row ${current.id === order.id ? "selected" : ""}" data-pack-order="${order.id}"><span class="register-title">${order.id} · ${escapeHtml(order.customer)}</span>${statusBadge(order)}<span class="register-meta">${order.qty} ตัว · ${order.id === "ORD-2608-0034" ? "Blind ship" : "ส่งปกติ"}</span><span class="register-meta due ${dueClass(order)}">${escapeHtml(order.due)}</span></button>`).join("")}</div></section>
          <section class="surface section"><div class="section-head"><div><h2>แพ็ก ${current.id}</h2><p>${escapeHtml(current.customer)} · ${current.qty} ตัว</p></div><span class="badge green">${appState.packed.has(current.id) ? "แพ็กเสร็จแล้ว" : `QC ผ่าน ${current.qty}/${current.qty}`}</span></div>
            <form id="packForm" data-order-id="${current.id}"><div class="checklist">${checkLabels.map((label, index) => `<button type="button" class="check-item" role="checkbox" aria-checked="${checks[index]}" data-pack-check="${index}" ${disabled}><span class="check-mark" aria-hidden="true">${checks[index] ? icon("check") : ""}</span><span>${label}</span></button>`).join("")}</div><div class="divider"></div><div class="form-grid"><div class="field"><label for="boxCount">จำนวนกล่อง</label><input id="boxCount" type="number" min="1" value="3" ${disabled}></div><div class="field"><label for="packMethod">รูปแบบจัดส่ง</label><select id="packMethod" ${disabled}><option>${current.id === "ORD-2608-0034" ? "Blind ship — ไม่ใช้ชื่อ Anajak" : "จัดส่งปกติ"}</option><option>ลูกค้ารับเอง</option></select></div><div class="field full"><label for="packNote">หมายเหตุกล่อง</label><textarea id="packNote" placeholder="เช่น กล่อง 1: S–M, กล่อง 2: L–XL" ${disabled}></textarea></div></div><div class="form-error" id="packError" role="alert" aria-live="polite">${appState.packed.has(current.id) ? "บันทึกการแพ็กแล้ว งานอยู่ในสถานะพร้อมจัดส่ง" : checks.every(Boolean) ? "" : `ต้องตรวจให้ครบอีก ${checks.filter(value => !value).length} ข้อก่อนยืนยัน`}</div>${canOperate() && !appState.packed.has(current.id) ? `<button class="button primary full" id="packSubmit" type="submit" ${checks.every(Boolean) ? "" : "disabled"}>ยืนยันแพ็กเสร็จ · ส่งต่อพร้อมจัดส่ง</button>` : `<span class="badge neutral">${appState.packed.has(current.id) ? "ปิดงานแพ็กแล้ว" : "ดูอย่างเดียว"}</span>`}</form>
          </section>
        </div>
      </div>`;
    }

    function renderPerformance() {
      if (!isManager()) return `<div class="page view-enter">${pageHead("ผลงานฝ่ายผลิต", "หน้านี้เปิดให้หัวหน้าผลิตเท่านั้น", `<button class="button" data-view="control">${icon("arrow-left")} กลับศูนย์ควบคุม</button>`)}${roleNote()}<section class="surface"><div class="empty"><div class="empty-icon">${icon("shield")}</div><h3>ไม่มีสิทธิ์ดูผลงานรวม</h3><p>พนักงานสถานีและผู้ดูอย่างเดียวกลับไปเปิดใบงานที่ได้รับมอบหมายได้</p></div></section></div>`;
      return `<div class="page view-enter">
        ${pageHead("ผลงานฝ่ายผลิต", "หน้าหัวหน้าแยกจากงานปฏิบัติ เพื่อไม่ให้ตัวเลขรบกวนการลงมือ", `<select class="control" aria-label="เลือกเดือน"><option>สิงหาคม 2569</option><option>กรกฎาคม 2569</option></select>`)}
        ${roleNote()}
        <div class="job-grid"><section class="surface section"><div class="section-head"><div><h2>สองตัวเลขที่ต้องเชื่อได้</h2><p>ทุกค่ากดลงไปดูออเดอร์ต้นทางได้</p></div></div><div class="metric-line"><div><h3>ส่งตรงเวลา</h3><p class="muted">ออเดอร์ที่ส่งแล้ว เทียบกำหนดส่ง</p></div><div class="metric-value">91.7%</div><button class="button" data-simulate="เปิด 2 ออเดอร์ที่ส่งช้า">ดู 2 งาน</button></div><div class="metric-line"><div><h3>ทำถูกตั้งแต่ครั้งแรก</h3><p class="muted">จำนวนดี ÷ จำนวนที่ผ่าน QC ทั้งหมด</p></div><div class="metric-value">96.3%</div><button class="button" data-view="qc">ดู QC</button></div><div class="blocker">${icon("alert")}<p>เดือนนี้ยังมี 6 งานไม่ส่ง ตัวเลขส่งตรงเวลาจึงยังไม่ใช่ผลปิดเดือน</p></div></section>
          <section class="surface section"><div class="section-head"><div><h2>ของเสียตามสาเหตุ</h2><p>เรียงจำนวนมากไปน้อย เชื่อมกลับใบผลิตได้</p></div></div><div class="defect-row"><span>ลายพิมพ์เยื้อง</span><div class="defect-bar"><span style="width:100%"></span></div><strong class="tnum">8</strong></div><div class="defect-row"><span>สีไม่ตรงแบบ</span><div class="defect-bar"><span style="width:62%"></span></div><strong class="tnum">5</strong></div><div class="defect-row"><span>ตำแหน่งผิด</span><div class="defect-bar"><span style="width:38%"></span></div><strong class="tnum">3</strong></div><div class="defect-row"><span>เสื้อเสียหาย</span><div class="defect-bar"><span style="width:25%"></span></div><strong class="tnum">2</strong></div><button class="button full" data-simulate="เปิดรายละเอียดของเสียทั้งหมด" style="margin-top:16px">ดูรายการและรูป QC</button></section></div>
      </div>`;
    }

    const renderers = {control:renderControl, station:renderStation, job:renderJob, materials:renderMaterials, print:renderPrint, outsource:renderOutsource, qc:renderQc, rework:renderRework, packing:renderPacking, performance:renderPerformance};

    function render() {
      const renderer = renderers[appState.view] || renderControl;
      document.body.dataset.role = appState.role;
      screenRoot.innerHTML = renderer();
      const moduleView = ({rework:"qc"})[appState.view] || appState.view;
      document.querySelectorAll("[data-module-view]").forEach(button => button.setAttribute("aria-current", button.dataset.moduleView === moduleView ? "page" : "false"));
      document.querySelectorAll("[data-production-root]").forEach(button => button.setAttribute("aria-current", "page"));
      bindScreenEvents();
      liveRegion.textContent = `เปิดหน้า ${document.querySelector("h1")?.textContent || "ฝ่ายผลิต"}`;
    }

    function navigate(view, options = {}) {
      if (options.orderId) appState.selectedOrderId = options.orderId;
      appState.view = view;
      history.replaceState(null, "", `#${view}`);
      render();
      workspace?.scrollTo({top:0, behavior:"auto"});
      requestAnimationFrame(() => screenRoot.focus({preventScroll:true}));
    }

    function selectOrder(id, open = false) {
      const order = orders.find(item => item.id === id);
      if (!order) return;
      appState.selectedOrderId = id;
      if (open) navigate("job", {orderId:id}); else render();
    }

    function showToast(title, detail = "จำลองเฉพาะในต้นแบบ · ไม่บันทึกจริง") {
      const wrap = document.getElementById("toastWrap");
      const node = document.createElement("div");
      node.className = "toast";
      node.innerHTML = `${icon("check")}<div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(detail)}</span></div>`;
      wrap.appendChild(node);
      setTimeout(() => node.remove(), 3600);
    }

    function bindScreenEvents() {
      screenRoot.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => navigate(button.dataset.view)));
      screenRoot.querySelectorAll("[data-open-view]").forEach(button => button.addEventListener("click", () => navigate(button.dataset.openView, {orderId:button.dataset.order})));
      screenRoot.querySelectorAll("[data-open-order]").forEach(button => button.addEventListener("click", event => { event.stopPropagation(); selectOrder(button.dataset.openOrder, true); }));
      screenRoot.querySelectorAll("[data-open-materials]").forEach(button => button.addEventListener("click", () => navigate("materials", {orderId:button.dataset.openMaterials})));
      screenRoot.querySelectorAll("[data-open-rework]").forEach(button => button.addEventListener("click", () => { appState.reworkSelected = button.dataset.openRework; appState.selectedOrderId = button.dataset.openRework; navigate("rework"); }));
      screenRoot.querySelectorAll("[data-open-qc-order]").forEach(button => button.addEventListener("click", () => { appState.qcSelected = button.dataset.openQcOrder; navigate("qc"); }));
      screenRoot.querySelectorAll("[data-order-id]").forEach(row => {
        row.addEventListener("click", event => { if (!event.target.closest("button")) selectOrder(row.dataset.orderId, innerWidth <= 1180); });
        row.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectOrder(row.dataset.orderId, innerWidth <= 1180); } });
      });
      screenRoot.querySelectorAll("[data-station]").forEach(button => button.addEventListener("click", () => { appState.station = button.dataset.station; appState.filter = "all"; render(); }));
      screenRoot.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => { appState.filter = button.dataset.filter; render(); }));
      screenRoot.querySelectorAll("[data-simulate]").forEach(button => button.addEventListener("click", () => showToast(button.dataset.simulate)));
      screenRoot.querySelectorAll("[data-print-select]").forEach(button => button.addEventListener("click", () => { const id = button.dataset.printSelect; if (!isManager() || activeRunOrderIds.has(id)) return; appState.printSelected.has(id) ? appState.printSelected.delete(id) : appState.printSelected.add(id); render(); }));
      screenRoot.querySelectorAll("[data-print-run-action]").forEach(button => button.addEventListener("click", () => {
        const action = button.dataset.printRunAction;
        if (action === "open") {
          if (!isManager() || appState.printRun.stage !== "idle" || !appState.printSelected.size) return;
          const ids = [...appState.printSelected];
          ids.forEach(id => {
            activeRunOrderIds.add(id);
            const order = orders.find(item => item.id === id);
            order.status = "working";
            order.statusLabel = "กำลังพิมพ์";
            order.owner = "ต้น";
          });
          appState.printRun = {id:"FR-2608-0019", stage:"printing", orderIds:ids, started:"เมื่อสักครู่", operator:"ต้น"};
          appState.printSelected.clear();
          showToast("เปิดรอบพิมพ์ใหม่แล้ว", `${ids.length} งานถูกถอดจากคิวเลือกซ้ำ`);
          render();
          return;
        }
        if (!canOperate() || appState.printRun.stage === "idle") return;
        if (action === "finish") {
          appState.printRun.stage = "cutting";
          showToast("พิมพ์จบทั้งม้วนแล้ว", "ขั้นถัดไปคือตัดแยกและติดป้ายตามออเดอร์");
          render();
        } else if (action === "cut") {
          appState.printRun.stage = "heat";
          showToast("ตัดแยกและติดป้ายครบแล้ว", "ฟิล์มพร้อมส่งเข้าสถานีรีดร้อน");
          render();
        } else if (action === "qc") {
          const ids = [...appState.printRun.orderIds];
          ids.forEach(id => {
            activeRunOrderIds.delete(id);
            const order = orders.find(item => item.id === id);
            order.station = "qc";
            order.status = "ready";
            order.statusLabel = "รอตรวจ QC";
            order.progress = 82;
            order.next = "เริ่มตรวจนับ";
            order.nextView = "qc";
            appState.qcProgress[id] = {good:0, defect:0};
          });
          appState.printRun = {id:"", stage:"idle", orderIds:[], started:"", operator:""};
          appState.qcSelected = ids[0];
          showToast("รีดครบและส่งเข้า QC แล้ว", `${ids.length} งานออกจากศูนย์ DTF`);
          navigate("qc");
        }
      }));
      screenRoot.querySelectorAll("[data-outsource-order]").forEach(button => button.addEventListener("click", () => { appState.outsourceSelected = button.dataset.outsourceOrder; render(); }));
      screenRoot.querySelectorAll("[data-outsource-action]").forEach(button => button.addEventListener("click", () => {
        if (!isManager()) return;
        const order = orders.find(item => item.id === button.dataset.order);
        const record = outsourceRecords[order.id];
        if (button.dataset.outsourceAction === "send") {
          record.stage = "working";
          record.sentQty = order.qty;
          record.sentAt = "เมื่อสักครู่";
          record.note = "ร้านยืนยันรับใบงานแล้ว";
          order.status = "working";
          order.statusLabel = "อยู่ร้านนอก";
          order.owner = "เมย์";
          showToast("ยืนยันส่งร้านแล้ว", `${order.qty} ตัว · ${record.vendor}`);
          render();
          return;
        }
        if (hasDtf(order) && !record.dtfReady) {
          showToast("ยังส่ง QC ไม่ได้", "ต้องรอสาย DTF ครบก่อนรวมงานเข้าตรวจ");
          return;
        }
        record.stage = "complete";
        record.returnedAt = "เมื่อสักครู่";
        record.note = `รับกลับครบ ${record.sentQty} ตัว${hasDtf(order) ? " · รวมกับสาย DTF แล้ว" : ""}`;
        order.station = "qc";
        order.status = "ready";
        order.statusLabel = "รอตรวจ QC";
        order.progress = 82;
        order.blocker = "";
        order.next = "เริ่มตรวจนับ";
        order.nextView = "qc";
        appState.qcProgress[order.id] = {good:0, defect:0};
        appState.qcSelected = order.id;
        showToast("รับของกลับครบและส่ง QC แล้ว", hasDtf(order) ? "สายร้านนอกและ DTF รวมครบก่อนตรวจ" : "งานออกจากทะเบียนร้านเข้าสู่คิว QC");
        navigate("qc");
      }));
      screenRoot.querySelectorAll("[data-qc-order]").forEach(button => button.addEventListener("click", () => { appState.qcSelected = button.dataset.qcOrder; render(); }));
      screenRoot.querySelectorAll("[data-pack-order]").forEach(button => button.addEventListener("click", () => { appState.packSelected = button.dataset.packOrder; render(); }));
      const stationSelect = document.getElementById("stationSelect");
      if (stationSelect) stationSelect.addEventListener("change", () => { appState.station = stationSelect.value; render(); });

      const materialForm = document.getElementById("materialForm");
      const materialError = document.getElementById("materialError");
      const updateMaterialTotals = () => {
        let error = "";
        materialForm?.querySelectorAll("[data-material-key]").forEach(row => {
          const key = row.dataset.materialKey;
          const issue = Number(row.querySelector(`[data-material-issue="${key}"]`)?.value || 0);
          const returned = Number(row.querySelector(`[data-material-return="${key}"]`)?.value || 0);
          const max = Number(row.querySelector(`[data-material-issue="${key}"]`)?.max || 0);
          const net = row.querySelector(`[data-material-net="${key}"]`);
          if (net) net.textContent = `${issue - returned} ${materialsForOrder(selectedOrder()).find(item => item.key === key)?.unit || ""}`;
          if (!Number.isInteger(issue) || !Number.isInteger(returned) || issue < 0 || returned < 0) error = "กรอกจำนวนเบิกและคืนเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป";
          else if (issue > max) error = `ยอดเบิกต้องไม่เกินจำนวนที่ต้องใช้ ${max}`;
          else if (returned > issue) error = "ยอดคืนต้องไม่มากกว่ายอดเบิก";
        });
        if (materialError) materialError.textContent = error;
        return error;
      };
      materialForm?.querySelectorAll("input").forEach(input => input.addEventListener("input", updateMaterialTotals));
      materialForm?.addEventListener("submit", event => {
        event.preventDefault();
        if (!canOperate() || updateMaterialTotals()) return;
        const order = selectedOrder();
        const balances = {};
        materialForm.querySelectorAll("[data-material-key]").forEach(row => {
          const key = row.dataset.materialKey;
          balances[key] = {issued:Number(row.querySelector(`[data-material-issue="${key}"]`).value), returned:Number(row.querySelector(`[data-material-return="${key}"]`).value)};
        });
        appState.materialBalances[order.id] = balances;
        const detail = materialsForOrder(order).map(item => { const value = balances[item.key]; return `${item.name} เบิก ${value.issued} คืน ${value.returned} ${item.unit}`; }).join(" · ");
        const note = document.getElementById("materialNote")?.value.trim();
        const actor = isManager() ? "หัวหน้าผลิต" : "พนักงานสถานี";
        appState.materialHistory[order.id] = [{time:"เมื่อสักครู่", action:"บันทึกยอดเบิก–คืน", detail:`${detail}${note ? ` · ${note}` : ""} · โดย${actor}`}].concat(appState.materialHistory[order.id] || []);
        showToast("บันทึกการเบิก–คืนแล้ว", "เก็บในสถานะของต้นแบบนี้เท่านั้น");
        render();
      });

      const qcGood = document.getElementById("qtyGood");
      const qcDefect = document.getElementById("qtyDefect");
      const qcReason = document.getElementById("defectReason");
      const qcForm = document.getElementById("qcForm");
      const updateQcTotal = () => {
        if (!qcForm) return "";
        const good = Number(qcGood?.value || 0);
        const defect = Number(qcDefect?.value || 0);
        const total = good + defect;
        const targetQty = Number(qcForm.dataset.target);
        const totalNode = document.getElementById("qcTotal");
        const errorNode = document.getElementById("qcError");
        const submit = document.getElementById("qcSubmit");
        let error = "";
        if (![good, defect].every(Number.isInteger) || good < 0 || defect < 0) error = "กรอกจำนวนดีและเสียเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป";
        else if (total === 0) error = "กรอกจำนวนที่ตรวจมากกว่า 0 เพื่อบันทึกผล";
        else if (total > targetQty) error = `รวมจำนวนดีและเสียต้องไม่เกิน ${targetQty} ตัว`;
        else if (defect > 0 && !qcReason?.value) error = "เลือกเหตุผลของเสียก่อนบันทึกผล";
        else if (qcForm.dataset.recheck === "true" && defect > 0 && total < targetQty) error = `เมื่อตรวจซ้ำแล้วยังพบของเสีย ต้องกรอกผลให้ครบ ${targetQty} ตัวเพื่อเปิดงานแก้รอบถัดไป`;
        if (totalNode) totalNode.textContent = `${total} / ${targetQty}`;
        if (errorNode) errorNode.textContent = error;
        [qcGood, qcDefect, qcReason].forEach(field => field?.setAttribute("aria-invalid", error ? "true" : "false"));
        if (submit) submit.disabled = Boolean(error);
        return error;
      };
      qcGood?.addEventListener("input", updateQcTotal);
      qcDefect?.addEventListener("input", updateQcTotal);
      qcReason?.addEventListener("change", updateQcTotal);
      qcForm?.addEventListener("submit", event => {
        event.preventDefault();
        if (!canOperate() || updateQcTotal()) return;
        const orderId = qcForm.dataset.orderId;
        const good = Number(qcGood.value);
        const defect = Number(qcDefect.value);
        const targetQty = Number(qcForm.dataset.target);
        const note = document.getElementById("qcNote")?.value.trim() || "";
        const order = orders.find(item => item.id === orderId);
        const isRecheck = qcForm.dataset.recheck === "true";
        const progress = appState.qcProgress[orderId] || {good:0, defect:0};
        if (!isRecheck) {
          progress.good += good;
          progress.defect += defect;
          appState.qcProgress[orderId] = progress;
        }
        const inspected = progress.good + progress.defect;
        const remaining = Math.max(0, order.qty - inspected);
        if (defect > 0) {
          appState.reworks[orderId] = {qty:defect, reason:qcReason.value, note:note || "รอสถานีระบุวิธีแก้", stage:"waiting", workCenter:hasDtf(order) ? "DTF" : "ร้านนอก", updated:"เมื่อสักครู่", qcPassed:0};
          order.status = "working";
          order.statusLabel = "QC พบของเสีย";
          order.blocker = `${qcReason.value} ${defect} ตัว ต้องแก้และตรวจซ้ำ`;
          order.next = `เปิดงานแก้ ${defect} ตัว`;
          appState.reworkSelected = orderId;
          appState.selectedOrderId = orderId;
          showToast(isRecheck ? "ตรวจซ้ำยังพบของเสีย" : "เปิดงานแก้แล้ว", `${defect} ตัวถูกกันออกจากคิวแพ็ก${isRecheck ? "" : ` · ตรวจสะสม ${inspected}/${order.qty}`}`);
          navigate("rework");
          return;
        }
        if (isRecheck) {
          const rework = appState.reworks[orderId];
          rework.qcPassed = (rework.qcPassed || 0) + good;
          if (good < targetQty) {
            showToast("บันทึกผลตรวจซ้ำบางส่วนแล้ว", `ผ่านสะสม ${rework.qcPassed}/${rework.qty} · คงเหลือ ${rework.qty - rework.qcPassed}`);
            render();
            return;
          }
          rework.stage = "done";
          rework.updated = "เมื่อสักครู่";
          if (remaining > 0) {
            order.status = "ready";
            order.statusLabel = "รอตรวจ QC";
            order.blocker = "";
            order.next = "ตรวจล็อตหลักต่อ";
            order.nextView = "qc";
            showToast("ตรวจซ้ำผ่านแล้ว", `กลับตรวจล็อตหลักที่เหลือ ${remaining} ตัว`);
            render();
            return;
          }
        } else if (remaining > 0) {
          showToast("บันทึกผล QC บางส่วนแล้ว", `ตรวจสะสม ${inspected}/${order.qty} · คงเหลือ ${remaining} ตัว`);
          render();
          return;
        }
        order.station = "packing";
        order.status = "ready";
        order.statusLabel = "พร้อมแพ็ก";
        order.progress = 92;
        order.blocker = "";
        order.next = "เริ่มแพ็กส่ง";
        order.nextView = "packing";
        appState.packChecks[orderId] = [false, false, false, false];
        appState.packSelected = orderId;
        showToast(isRecheck ? "ตรวจซ้ำผ่านแล้ว" : "QC ผ่านครบแล้ว", "งานเข้าสู่คิวแพ็กครั้งสุดท้าย");
        navigate("packing");
      });

      screenRoot.querySelectorAll("[data-rework-action]").forEach(button => button.addEventListener("click", () => {
        if (!canOperate()) return;
        const rework = appState.reworks[button.dataset.order];
        const note = document.getElementById("reworkNote")?.value.trim();
        if (note) rework.note = note;
        if (button.dataset.reworkAction === "start") {
          rework.stage = "working";
          rework.updated = "เมื่อสักครู่";
          showToast("เริ่มงานแก้แล้ว", `${rework.qty} ตัว · สถานี ${rework.workCenter}`);
          render();
        } else {
          rework.stage = "recheck";
          rework.updated = "เมื่อสักครู่";
          appState.qcSelected = button.dataset.order;
          showToast("ส่งงานแก้กลับ QC แล้ว", `รอตรวจซ้ำ ${rework.qty} ตัว`);
          navigate("qc");
        }
      }));

      const packForm = document.getElementById("packForm");
      const updatePackGate = () => {
        if (!packForm) return false;
        const checks = [...packForm.querySelectorAll("[data-pack-check]")].map(button => button.getAttribute("aria-checked") === "true");
        const boxCount = Number(document.getElementById("boxCount")?.value || 0);
        const ready = checks.every(Boolean) && Number.isInteger(boxCount) && boxCount > 0;
        const error = !checks.every(Boolean) ? `ต้องตรวจให้ครบอีก ${checks.filter(value => !value).length} ข้อก่อนยืนยัน` : boxCount < 1 ? "จำนวนกล่องต้องมากกว่า 0" : "";
        const errorNode = document.getElementById("packError");
        const submit = document.getElementById("packSubmit");
        if (errorNode) errorNode.textContent = error;
        if (submit) submit.disabled = !ready;
        return ready;
      };
      packForm?.querySelectorAll("[data-pack-check]").forEach(button => button.addEventListener("click", () => {
        const index = Number(button.dataset.packCheck);
        const checked = button.getAttribute("aria-checked") !== "true";
        button.setAttribute("aria-checked", String(checked));
        button.querySelector(".check-mark").innerHTML = checked ? icon("check") : "";
        appState.packChecks[packForm.dataset.orderId][index] = checked;
        updatePackGate();
      }));
      document.getElementById("boxCount")?.addEventListener("input", updatePackGate);
      packForm?.addEventListener("submit", event => {
        event.preventDefault();
        if (!canOperate() || !updatePackGate()) return;
        appState.packed.add(packForm.dataset.orderId);
        showToast("แพ็กเสร็จและพร้อมจัดส่ง", "ผ่าน checklist ครบทุกข้อแล้ว");
        render();
      });
    }

    document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => navigate(button.dataset.view)));
    document.querySelectorAll("[data-production-root]").forEach(button => button.addEventListener("click", () => navigate("control")));
    document.querySelectorAll("[data-shell-action]").forEach(button => button.addEventListener("click", () => showToast(button.dataset.shellAction, "ต้นแบบนี้เปิดให้ลองเฉพาะโมดูลการผลิต · ไม่บันทึกจริง")));

    document.getElementById("roleSelect").addEventListener("change", event => {
      appState.role = event.target.value;
      render();
      showToast(event.target.value === "readonly" ? "เปิดโหมดดูอย่างเดียว" : event.target.value === "operator" ? "เปิดโหมดพนักงานสถานี" : "เปิดโหมดหัวหน้าผลิต", "ปุ่มและข้อมูลปรับตามสิทธิ์จำลอง");
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      const root = document.documentElement;
      const dark = root.dataset.theme === "dark";
      root.dataset.theme = dark ? "light" : "dark";
      document.getElementById("themeToggle").innerHTML = icon(dark ? "moon" : "sun");
      document.getElementById("themeToggle").setAttribute("aria-label", dark ? "เปิดธีมมืด" : "เปิดธีมสว่าง");
    });

    document.getElementById("demoScan").addEventListener("click", () => {
      searchInput.value = "ORD-2608-0041";
      showToast("อ่าน QR ได้ ORD-2608-0041", "เปิดใบผลิตอย่างเดียว ยังไม่เปลี่ยนสถานะ");
      setTimeout(() => selectOrder("ORD-2608-0041", true), 320);
    });

    function updateSearchResults() {
      const query = searchInput.value.trim().toLowerCase();
      const results = query ? orders.filter(order => `${order.id} ${order.customer} ${order.title}`.toLowerCase().includes(query)).slice(0,5) : orders.slice(0,4);
      searchResults.innerHTML = results.length ? results.map(order => `<button type="button" class="search-result" role="option" data-search-order="${order.id}"><span class="result-main">${order.id} · ${escapeHtml(order.customer)}</span>${statusBadge(order)}<span class="result-sub">${escapeHtml(order.title)} · ${order.qty} ตัว</span><span class="result-sub due ${dueClass(order)}">${escapeHtml(order.due)}</span></button>`).join("") : `<div class="search-empty">ไม่พบออเดอร์ ลอง ORD-2608-0041</div>`;
      searchResults.classList.add("open");
      searchInput.setAttribute("aria-expanded", "true");
      searchResults.querySelectorAll("[data-search-order]").forEach(button => button.addEventListener("click", () => { searchResults.classList.remove("open"); selectOrder(button.dataset.searchOrder, true); }));
    }

    searchInput.addEventListener("focus", updateSearchResults);
    searchInput.addEventListener("input", updateSearchResults);
    document.getElementById("globalSearch").addEventListener("submit", event => {
      event.preventDefault();
      const exact = orders.find(order => order.id.toLowerCase() === searchInput.value.trim().toLowerCase());
      if (exact) { searchResults.classList.remove("open"); selectOrder(exact.id, true); }
      else { updateSearchResults(); showToast("ยังไม่พบเลขออเดอร์นี้", "ลองพิมพ์ ORD-2608-0041"); }
    });
    document.addEventListener("click", event => { if (!event.target.closest("#globalSearch")) { searchResults.classList.remove("open"); searchInput.setAttribute("aria-expanded", "false"); } });
    document.addEventListener("keydown", event => { if (event.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { event.preventDefault(); searchInput.focus(); } });
    window.addEventListener("hashchange", () => { const view = location.hash.replace("#", ""); if (renderers[view]) { appState.view = view; render(); } });

    render();
  </script>
</body>
</html>
