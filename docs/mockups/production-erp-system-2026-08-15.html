<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ต้นแบบระบบฝ่ายผลิต — Anajak ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --font: "Prompt", "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page: #fafafa;
      --surface: #ffffff;
      --surface-muted: #f3f5f7;
      --surface-hover: #f1f3f5;
      --surface-pressed: #e3e6e9;
      --field: #ffffff;
      --line: #e2e6ea;
      --line-soft: #e8ebef;
      --line-strong: #87919d;
      --ink: #181b20;
      --ink-2: #454b55;
      --ink-3: #5b6572;
      --blue: #3973b2;
      --blue-hover: #305f93;
      --blue-soft: #e4edf6;
      --blue-ink: #305f93;
      --red: #b42318;
      --red-soft: #fff5f5;
      --amber: #854d0e;
      --amber-soft: #fffbeb;
      --green: #166534;
      --green-soft: #f0fdf4;
      --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 0 0 1px rgb(16 24 40 / .04);
      --shadow-raised: 0 10px 30px rgb(16 24 40 / .11), 0 2px 5px rgb(16 24 40 / .06);
      --sidebar: 240px;
      --topbar: 64px;
      --radius: 14px;
      --radius-inner: 10px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #1a1a1c;
      --surface: #252528;
      --surface-muted: #1d1d1f;
      --surface-hover: #303034;
      --surface-pressed: #38383c;
      --field: #101012;
      --line: #343438;
      --line-soft: #303034;
      --line-strong: #777780;
      --ink: #f5f5f7;
      --ink-2: #d1d1d6;
      --ink-3: #a1a1aa;
      --blue: #3973b2;
      --blue-hover: #305f93;
      --blue-soft: #173c61;
      --blue-ink: #d8e8f7;
      --red: #fda29b;
      --red-soft: #451a1a;
      --amber: #fde68a;
      --amber-soft: #3b2f12;
      --green: #86efac;
      --green-soft: #12351f;
      --shadow: 0 1px 2px rgb(0 0 0 / .35), 0 0 0 1px rgb(255 255 255 / .05);
      --shadow-raised: 0 14px 38px rgb(0 0 0 / .45), 0 2px 6px rgb(0 0 0 / .25);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--page); }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font: 400 14px/1.5 var(--font);
      letter-spacing: -.01em;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    a { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 24px; line-height: 1.2; letter-spacing: -.02em; font-weight: 600; margin-bottom: 6px; }
    h2 { font-size: 18px; line-height: 1.35; letter-spacing: -.015em; font-weight: 600; margin-bottom: 4px; }
    h3 { font-size: 15px; line-height: 1.4; font-weight: 600; margin-bottom: 4px; }
    .muted { color: var(--ink-3); }
    .secondary { color: var(--ink-2); }
    .tnum { font-variant-numeric: tabular-nums; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 19px; height: 19px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    :focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 50%, transparent); outline-offset: 2px; }
    @media (prefers-reduced-motion: no-preference) {
      .view-enter { animation: view-in .22s cubic-bezier(.2,.8,.2,1); }
      .toast { animation: toast-in .2s cubic-bezier(.2,.8,.2,1); }
      @keyframes view-in { from { opacity: .55; transform: translateY(4px); } }
      @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }
    }

    .app-shell {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      grid-template-rows: var(--topbar) minmax(0, 1fr);
      grid-template-areas: "topbar topbar" "sidebar main";
      overflow: hidden;
    }
    .sidebar {
      grid-area: sidebar;
      min-height: 0;
      background: var(--surface);
      border-right: 1px solid var(--line-soft);
      padding: 16px 12px;
      overflow-y: auto;
    }
    .brand { width: var(--sidebar); height: 100%; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; border: 0; border-right: 1px solid var(--line-soft); background: transparent; color: var(--ink); padding: 0 20px; text-align: left; }
    .brand-mark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: #3973b2; }
    .brand-mark .icon { width: 18px; height: 18px; }
    .brand-name { font-size: 14px; font-weight: 600; line-height: 1.15; }
    .nav-list { display: grid; gap: 2px; }
    .nav-button {
      border: 0;
      background: transparent;
      color: var(--ink-2);
      min-height: 44px;
      padding: 9px 11px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      transition: background .14s ease, color .14s ease;
    }
    .nav-button:hover { background: var(--surface-hover); color: var(--ink); }
    .nav-button:active { background: var(--surface-pressed); }
    .nav-button[aria-current="page"] { background: var(--blue-soft); color: var(--blue-ink); font-weight: 500; }
    .shell-divider { height: 1px; background: var(--line-soft); margin: 16px 0; }
    .shell-more summary { list-style: none; }
    .shell-more summary::-webkit-details-marker { display: none; }
    .shell-more summary .chevron { margin-left: auto; transition: transform .14s ease; }
    .shell-more[open] summary .chevron { transform: rotate(90deg); }
    .shell-more-body { padding: 10px 12px 2px 42px; color: var(--ink-3); font-size: 11px; line-height: 1.65; }

    .app-topbar {
      grid-area: topbar;
      z-index: 35;
      min-width: 0;
      display: flex;
      align-items: center;
      height: var(--topbar);
      background: var(--surface);
      border-bottom: 1px solid var(--line-soft);
    }
    .topbar-main { min-width: 0; flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
    .global-search { position: relative; flex: 1 1 520px; max-width: 520px; }
    .global-search .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
    .global-search input {
      width: 100%;
      min-height: 44px;
      padding: 9px 48px 9px 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--ink);
      box-shadow: 0 1px 2px rgb(16 24 40 / .03);
    }
    .global-search input::placeholder { color: var(--ink-3); }
    .global-search input:focus { border-color: var(--blue); outline: 3px solid color-mix(in srgb, var(--blue) 18%, transparent); }
    .search-key { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); border: 1px solid var(--line); background: var(--surface-muted); color: var(--ink-3); border-radius: 6px; padding: 1px 6px; font-size: 11px; }
    .search-popover {
      position: absolute;
      inset: calc(100% + 6px) 0 auto 0;
      display: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-raised);
      padding: 6px;
      z-index: 80;
    }
    .search-popover.open { display: block; }
    .search-result { width: 100%; border: 0; background: transparent; color: var(--ink); border-radius: 8px; padding: 9px 10px; min-height: 48px; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; text-align: left; }
    .search-result:hover, .search-result:focus-visible { background: var(--surface-hover); }
    .search-result .result-main { font-weight: 500; }
    .search-result .result-sub { color: var(--ink-3); font-size: 12px; }
    .search-empty { padding: 16px 12px; color: var(--ink-3); text-align: center; }

    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 44px; min-height: 44px; border: 0; border-radius: 999px; background: var(--blue); color: #fff; font-weight: 600; display: grid; place-items: center; }
    .control, .button, .icon-button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      font-weight: 500;
      transition: background .14s ease, border-color .14s ease, color .14s ease;
    }
    .control:hover, .button:hover, .icon-button:hover { background: var(--surface-hover); color: var(--ink); }
    .control:active, .button:active, .icon-button:active { background: var(--surface-pressed); }
    .control { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px); background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
    .icon-button { width: 44px; padding: 0; }
    .button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .button.primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); color: #fff; }
    .button.danger { color: var(--red); }
    .button.quiet { border-color: transparent; background: transparent; box-shadow: none; }
    .button.full { width: 100%; }
    .button:disabled { background: var(--surface-muted); border-color: var(--line); color: var(--ink-3); }
    .scan-button { white-space: nowrap; }
    .role-select { max-width: 174px; }

    .workspace { grid-area: main; min-width: 0; min-height: 0; padding: 20px 24px 42px; overflow-y: auto; outline: none; }
    .module-bar { width: 100%; max-width: 1512px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .module-nav { min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding: 2px; }
    .module-tab { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-3); padding: 8px 11px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 500; }
    .module-tab:hover { background: var(--surface-hover); color: var(--ink); }
    .module-tab[aria-current="page"] { background: var(--blue-soft); color: var(--blue-ink); }
    .module-tab .icon { width: 17px; height: 17px; }
    .prototype-tools { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
    .prototype-note { min-height: 32px; border-radius: 999px; background: var(--surface-muted); color: var(--ink-3); padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; white-space: nowrap; }
    .prototype-note strong { color: var(--ink-2); font-weight: 600; }
    .page { width: 100%; max-width: 1512px; margin: 0 auto; }
    .page-head { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .page-head p { color: var(--ink-3); margin: 0; max-width: 72ch; }
    .page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .breadcrumb { display: flex; gap: 5px; align-items: center; color: var(--ink-3); font-size: 12px; margin-bottom: 8px; }
    .breadcrumb button { color: var(--blue-ink); background: transparent; border: 0; min-width: 44px; min-height: 44px; padding: 3px 0; }
    .page-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; color: var(--ink-3); font-size: 12px; margin-top: 9px; }

    .surface { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
    .section { padding: 18px; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .section-head p { color: var(--ink-3); margin: 2px 0 0; font-size: 12px; }
    .section-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .divider { height: 1px; background: var(--line-soft); margin: 16px 0; }

    .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .badge.neutral { background: var(--surface-muted); color: var(--ink-2); }
    .badge.blue { background: var(--blue-soft); color: var(--blue-ink); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .status-dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; }

    .flow-rail {
      display: grid;
      grid-template-columns: repeat(7, minmax(118px, 1fr));
      gap: 0;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .flow-step {
      position: relative;
      min-width: 118px;
      min-height: 76px;
      border: 0;
      border-right: 1px solid var(--line-soft);
      background: transparent;
      color: var(--ink-2);
      padding: 12px 14px;
      text-align: left;
    }
    .flow-step:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    .flow-step:last-child { border-right: 0; border-radius: 0 var(--radius) var(--radius) 0; }
    .flow-step:hover { background: var(--surface-hover); }
    .flow-step[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue-ink); }
    .flow-step .flow-name { display: block; font-weight: 500; margin-bottom: 5px; }
    .flow-step .flow-count { display: block; font-size: 20px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
    .flow-step .flow-note { display: block; color: var(--ink-3); font-size: 11px; margin-top: 4px; }
    .flow-step[aria-pressed="true"] .flow-note { color: var(--blue-ink); }

    .work-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
    .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-button { min-height: 44px; border: 1px solid transparent; background: transparent; color: var(--ink-3); border-radius: 8px; padding: 8px 10px; font-weight: 500; }
    .filter-button:hover { background: var(--surface-hover); color: var(--ink); }
    .filter-button[aria-pressed="true"] { background: var(--surface-muted); color: var(--ink); border-color: var(--line); }
    .filter-button .filter-count { color: var(--ink-3); margin-left: 5px; font-variant-numeric: tabular-nums; }

    .work-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .work-table th { color: var(--ink-3); font-size: 11px; font-weight: 500; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
    .work-table td { padding: 11px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    .work-table tbody tr { cursor: pointer; transition: background .12s ease; }
    .work-table tbody tr:hover { background: var(--surface-hover); }
    .work-table tbody tr.selected { background: var(--blue-soft); }
    .work-table tbody tr:last-child td { border-bottom: 0; }
    .order-cell { min-width: 190px; }
    .order-link { min-height: 44px; border: 0; background: transparent; color: var(--blue-ink); font-weight: 600; padding: 0; text-align: left; display: inline-flex; align-items: center; }
    .order-sub { color: var(--ink-3); font-size: 11px; margin-top: 2px; max-width: 34ch; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .due.overdue { color: var(--red); font-weight: 500; }
    .due.today { color: var(--amber); font-weight: 500; }
    .row-status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    .row-status .status-dot { color: var(--ink-3); }
    .row-status.ready .status-dot { color: var(--green); }
    .row-status.blocked .status-dot { color: var(--red); }
    .row-status.working .status-dot { color: var(--blue); }
    .row-chevron { color: var(--ink-3); }

    .context-panel { position: sticky; top: 18px; overflow: hidden; }
    .context-top { padding: 18px 18px 15px; border-bottom: 1px solid var(--line-soft); }
    .context-id { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .context-id h2 { color: var(--blue-ink); margin-bottom: 2px; }
    .context-body { padding: 16px 18px 18px; }
    .next-task { padding: 14px; border-radius: 11px; background: var(--surface-muted); margin-bottom: 14px; }
    .next-task-label { color: var(--ink-3); font-size: 11px; margin-bottom: 4px; }
    .next-task strong { display: block; font-size: 16px; font-weight: 600; }
    .next-task p { color: var(--ink-3); font-size: 12px; margin: 4px 0 0; }
    .info-list { display: grid; gap: 0; }
    .info-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
    .info-row:last-child { border-bottom: 0; }
    .info-row dt { color: var(--ink-3); }
    .info-row dd { margin: 0; color: var(--ink-2); font-weight: 500; }

    .station-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(310px, .75fr); gap: 16px; align-items: start; }
    .active-job { display: grid; grid-template-columns: minmax(0, 1fr) 160px auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
    .active-job:last-child { border-bottom: 0; }
    .progress { height: 7px; border-radius: 999px; background: var(--surface-muted); overflow: hidden; margin-top: 8px; }
    .progress > span { display: block; height: 100%; background: var(--blue); border-radius: inherit; }
    .queue-list { display: grid; }
    .queue-row { display: grid; grid-template-columns: minmax(180px, 1fr) 120px 116px auto; gap: 14px; align-items: center; min-height: 66px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    .queue-row:last-child { border-bottom: 0; }

    .job-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(340px, .85fr); gap: 16px; align-items: start; }
    .now-card { padding: 20px; }
    .now-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .task-block { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line-soft); }
    .task-block:first-of-type { border-top: 0; }
    .task-symbol { width: 46px; height: 46px; display: grid; place-items: center; color: var(--blue-ink); }
    .task-symbol .icon { width: 25px; height: 25px; }
    .task-copy p { color: var(--ink-3); margin: 2px 0 0; font-size: 12px; }
    .blocker { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; background: var(--amber-soft); color: var(--amber); margin-top: 12px; }
    .blocker p { margin: 0; color: inherit; font-size: 12px; }
    .ref-grid { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 14px; align-items: start; }
    .design-thumb { min-height: 112px; border-radius: 10px; background: var(--surface-muted); display: grid; place-items: center; color: var(--ink-3); }
    .size-grid { display: grid; grid-template-columns: repeat(6, minmax(42px, 1fr)); gap: 6px; margin-top: 14px; }
    .size-cell { background: var(--surface-muted); border-radius: 8px; padding: 7px 5px; text-align: center; }
    .size-cell span { display: block; color: var(--ink-3); font-size: 10px; }
    .size-cell strong { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .step-list { display: grid; }
    .step-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 54px; border-bottom: 1px solid var(--line-soft); }
    .step-row:last-child { border-bottom: 0; }
    .step-mark { width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: var(--ink-3); }
    .step-row.done .step-mark { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .step-row.current .step-mark { background: var(--blue); border-color: var(--blue); color: #fff; }
    .step-row.waiting { color: var(--ink-3); }

    .two-pane { display: grid; grid-template-columns: minmax(340px, .9fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
    .run-card { padding: 15px 0; border-bottom: 1px solid var(--line-soft); }
    .run-card:last-child { border-bottom: 0; }
    .run-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .run-items { display: grid; gap: 7px; margin-top: 10px; }
    .run-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--ink-2); font-size: 12px; }
    .select-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 92px 92px; gap: 12px; align-items: center; min-height: 64px; border-bottom: 1px solid var(--line-soft); }
    .select-row:last-child { border-bottom: 0; }
    .check-button { width: 44px; height: 44px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: transparent; display: grid; place-items: center; }
    .check-button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
    .qty-input { width: 82px; min-height: 44px; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 8px; padding: 7px 9px; font-variant-numeric: tabular-nums; }
    .selection-bar { position: sticky; top: 12px; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 11px; background: var(--surface); box-shadow: var(--shadow-raised); margin-bottom: 10px; }
    .selection-bar .button { margin-left: auto; }

    .split-register { display: grid; grid-template-columns: minmax(330px, .78fr) minmax(0, 1.22fr); gap: 16px; align-items: start; }
    .register-list { display: grid; }
    .register-row { width: 100%; border: 0; background: transparent; color: var(--ink); text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line-soft); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }

    .register-row .register-title { font-weight: 500; }
    .register-row .register-meta { color: var(--ink-3); font-size: 11px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 5px; }
    .field label { color: var(--ink-2); font-size: 12px; font-weight: 500; }
    .field input, .field select, .field textarea { width: 100%; min-height: 44px; border: 1px solid var(--line-strong); background: var(--field); color: var(--ink); border-radius: 9px; padding: 9px 11px; }
    .field textarea { min-height: 84px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); outline: 3px solid color-mix(in srgb, var(--blue) 18%, transparent); }
    .field input:disabled, .field select:disabled, .field textarea:disabled, .qty-input:disabled { cursor: not-allowed; background: var(--surface-muted); color: var(--ink-3); }
    .field [aria-invalid="true"] { border-color: var(--red); }
    .field.full { grid-column: 1 / -1; }
    .form-note { color: var(--ink-3); font-size: 11px; }
    .form-error { min-height: 22px; margin-top: 8px; color: var(--red); font-size: 12px; }
    .total-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); margin-top: 12px; }
    .total-line strong { font-size: 18px; font-weight: 600; }
    .checklist { display: grid; gap: 6px; }
    .check-item { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 9px; padding: 7px 9px; background: transparent; color: var(--ink); text-align: left; }
    .check-item:hover { background: var(--surface-hover); }
    .check-item:disabled { cursor: not-allowed; color: var(--ink-3); }
    .check-mark { width: 20px; height: 20px; flex: 0 0 auto; display: grid; place-items: center; border: 1.5px solid var(--line-strong); border-radius: 4px; color: transparent; }
    .check-mark .icon { width: 15px; height: 15px; }
    .check-item[aria-checked="true"] .check-mark { background: var(--blue); border-color: var(--blue); color: #fff; }

    .role-note { display: flex; align-items: flex-start; gap: 9px; padding: 11px 12px; border-radius: 10px; background: var(--surface-muted); color: var(--ink-2); font-size: 12px; margin-bottom: 14px; }
    .material-list { display: grid; gap: 8px; }
    .material-row { display: grid; grid-template-columns: minmax(180px, 1fr) 110px 110px 110px; gap: 12px; align-items: end; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .material-row:last-child { border-bottom: 0; }
    .material-name strong { display: block; }
    .material-name span { display: block; color: var(--ink-3); font-size: 11px; margin-top: 2px; }
    .material-row .field label { font-size: 11px; }
    .history-list { display: grid; gap: 8px; }
    .history-item { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    .history-item:last-child { border-bottom: 0; }
    .history-item time { color: var(--ink-3); font-size: 11px; }
    .history-item strong { display: block; font-size: 12px; }
    .history-item span { color: var(--ink-3); font-size: 11px; }
    .rework-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .summary-cell { padding: 12px; border-radius: 10px; background: var(--surface-muted); }
    .summary-cell span { display: block; color: var(--ink-3); font-size: 11px; }
    .summary-cell strong { display: block; margin-top: 3px; font-size: 15px; }
    body[data-role="operator"] [data-manager-only], body[data-role="readonly"] [data-manager-only] { display: none !important; }

    .metric-line { display: grid; grid-template-columns: minmax(0, 1fr) 160px 110px; align-items: center; gap: 16px; min-height: 90px; border-bottom: 1px solid var(--line-soft); }
    .metric-line:last-child { border-bottom: 0; }
    .metric-value { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .delta { font-size: 12px; text-align: right; }
    .defect-row { display: grid; grid-template-columns: minmax(150px, .8fr) minmax(180px, 1.2fr) 74px; gap: 12px; align-items: center; min-height: 48px; }
    .defect-bar { height: 9px; border-radius: 999px; background: var(--surface-muted); overflow: hidden; }
    .defect-bar span { display: block; height: 100%; border-radius: inherit; background: var(--amber); }

    .empty { padding: 42px 20px; text-align: center; color: var(--ink-3); }
    .empty .empty-icon { width: 48px; height: 48px; border-radius: 13px; margin: 0 auto 12px; display: grid; place-items: center; background: var(--surface-muted); }
    .empty h3 { color: var(--ink); }
    .empty p { max-width: 44ch; margin: 0 auto; }

    .toast-wrap { position: fixed; right: 20px; bottom: 20px; z-index: 150; display: grid; gap: 8px; pointer-events: none; }
    .toast { min-width: 300px; max-width: 420px; background: #181b20; color: #fff; border-radius: 12px; box-shadow: var(--shadow-raised); padding: 12px 14px; display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
    .toast strong { display: block; font-weight: 600; margin-bottom: 2px; }
    .toast span { color: #c8d0d9; font-size: 12px; }
    .mobile-nav { display: none; }

    @media (pointer: coarse) {
      .control, .button, .icon-button, .filter-button, .check-button, .qty-input, .module-tab { min-height: 48px; }
      .icon-button, .check-button { width: 48px; }
      .nav-button { min-height: 50px; }
      .work-table td { padding-top: 14px; padding-bottom: 14px; }

    }

    @media (max-width: 1180px) {

      .prototype-note { margin-right: auto; }
      .flow-rail { grid-template-columns: repeat(7, minmax(108px, 1fr)); }
      .flow-step { min-width: 108px; padding-inline: 11px; }
      .work-layout { grid-template-columns: 1fr; }
      .work-layout > .context-panel { display: none; }
      .work-table th:nth-child(2), .work-table td:nth-child(2) { display: none; }
      .station-layout, .job-grid, .two-pane, .split-register { grid-template-columns: 1fr; }
      .context-panel { position: static; }
      .station-layout > :last-child { order: -1; }
      .queue-row { grid-template-columns: minmax(170px, 1fr) 110px 98px auto; }
    }

    @media (max-width: 1023px) {
      :root { --sidebar: 0px; }
      .app-shell { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
      .sidebar { display: none; }
      .brand { width: 64px; justify-content: center; padding: 0; border-right: 0; }
      .brand-name { display: none; }
      .topbar-main { padding-inline: 14px; }
      .workspace { padding: 18px 14px 92px; }
      .work-layout { grid-template-columns: 1fr; }
      .context-panel { display: none; }
      .flow-rail { grid-template-columns: repeat(7, 132px); }
      .mobile-nav { position: fixed; inset: auto 0 0; z-index: 80; display: grid; grid-template-columns: repeat(5, 1fr); padding: 5px 4px max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line-soft); background: var(--surface); }
      .mobile-nav button { border: 0; background: transparent; color: var(--ink-3); min-height: 52px; border-radius: 8px; display: grid; place-items: center; gap: 2px; font-size: 10px; }
      .mobile-nav button[aria-current="page"] { background: var(--blue-soft); color: var(--blue-ink); }
    }

    @media (max-width: 680px) {
      .topbar-main { padding-inline: 10px; }
      .global-search { min-width: 0; }
      .global-search input { padding-right: 34px; }
      .search-key { display: none; }
      .prototype-tools { flex-wrap: wrap; }
      .prototype-note { flex: 1 1 100%; }
      .role-select { flex: 1 1 150px; max-width: none; }
      .scan-button span, .theme-label { display: none; }
      .page-head { display: block; }
      .page-actions { justify-content: flex-start; margin-top: 14px; }
      .section { padding: 15px; }
      .work-table, .work-table thead, .work-table tbody, .work-table tr, .work-table th, .work-table td { display: block; }
      .work-table thead { display: none; }
      .work-table tbody { display: grid; gap: 8px; }
      .work-table tbody tr { padding: 12px; border-radius: 11px; background: var(--surface); box-shadow: var(--shadow); }
      .work-table td { border: 0; padding: 3px 0; }
      .work-table td:last-child { display: none; }
      .order-cell { min-width: 0; }
      .active-job, .queue-row, .select-row, .task-block { grid-template-columns: 1fr; }
      .task-symbol { display: none; }
      .size-grid { grid-template-columns: repeat(3, 1fr); }
      .ref-grid, .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .metric-line { grid-template-columns: 1fr auto; }
      .metric-line .delta { grid-column: 1 / -1; text-align: left; }
      .defect-row { grid-template-columns: minmax(0, 1fr) 36px; }
      .defect-row .defect-bar { grid-column: 1 / -1; grid-row: 2; }
      .material-row { grid-template-columns: 1fr 1fr; }
      .material-name { grid-column: 1 / -1; }
      .rework-summary { grid-template-columns: 1fr; }
      .selection-bar { flex-wrap: wrap; }
      .selection-bar .button { margin-left: 0; width: 100%; }
      .toast-wrap { left: 10px; right: 10px; bottom: 78px; }
      .toast { min-width: 0; max-width: none; width: 100%; }
    }
  </style>

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
    }

    function statusBadge(order) {
      const tone = order.status === "blocked" || order.statusLabel.includes("ของเสีย") ? "red" : order.status === "working" ? "blue" : "green";
      return `<span class="badge ${tone}"><span class="status-dot"></span>${escapeHtml(order.statusLabel)}</span>`;
    }

    function dueClass(order) { return order.dueType === "overdue" ? "overdue" : order.dueType === "today" ? "today" : ""; }

    function roleNote() {
      if (isManager()) return `<div class="role-note">${icon("shield")}<span><strong>หัวหน้าผลิต</strong> · จัดคิว เปิดรอบ และลงมือแทนสถานีได้</span></div>`;
      if (canOperate()) return `<div class="role-note">${icon("play")}<span><strong>พนักงานสถานี</strong> · ลงมือและบันทึกผลได้ แต่จัดคิวหรือดูผลงานรวมไม่ได้</span></div>`;
      return `<div class="role-note">${icon("file")}<span><strong>ดูอย่างเดียว</strong> · เปิดใบงานและประวัติได้ แต่แก้ข้อมูลหรือเปลี่ยนสถานะไม่ได้</span></div>`;
    }

    function reconcileSelectedOrder(list) {
      if (!list.length) return null;
      const current = list.find(order => order.id === appState.selectedOrderId);
      if (current) return current;
      appState.selectedOrderId = list[0].id;
      return list[0];
    }

    function hasDtf(order) {
      return order.lanes.some(lane => lane === "DTF" || lane === "รีดร้อน");
    }

    function materialsForOrder(order) {
      const materials = [{key:"garment", name:"เสื้อ", unit:"ตัว", required:order.qty, readiness:order.station === "release" ? `รับเข้า 18 / ${order.qty}` : `พร้อม ${order.qty}`}];
      if (hasDtf(order)) {
        materials.push({key:"film", name:"ฟิล์ม DTF ตัดตามชิ้น", unit:"ชิ้น", required:order.qty, readiness:["heat","qc","packing"].includes(order.station) ? "ตัดและติดป้ายแล้ว" : "รอจัดรอบพิมพ์"});
        materials.push({key:"adhesive", name:"กาว DTF", unit:"กรัม", required:Math.max(100, Math.ceil(order.qty * 2.5)), readiness:"พร้อมเบิก"});
        materials.push({key:"tape", name:"เทปกันเปื้อน", unit:"ม้วน", required:1, readiness:"พร้อมเบิก"});
      }
      if (order.station === "packing") materials.push({key:"box", name:"กล่องจัดส่ง", unit:"กล่อง", required:3, readiness:"พร้อมเบิก"});
      return materials;
    }

    function designReference(order) {
      if (hasDtf(order)) return {title:"ลายหน้าอกซ้าย + หลังเต็ม", detail:"DTF · หน้า 9 × 9 ซม. · หลัง 28 × 34 ซม. · ใช้ไฟล์อนุมัติ v3"};
      if (order.work.includes("ปัก")) return {title:"ปักอกซ้าย", detail:"งานร้านนอก · ตำแหน่งอกซ้าย · ใช้ไฟล์ปักอนุมัติ v2"};

    }

    function countForStation(key) {
      if (key === "attention") return orders.filter(order => order.priority || order.status === "blocked").length;
      return orders.filter(order => order.station === key).length;

      return `<div class="surface flow-rail" aria-label="เลือกสถานีผลิต">${stationMeta.map(item => `<button class="flow-step" data-station="${item.key}" aria-pressed="${active === item.key}"><span class="flow-name">${item.label}</span><span class="flow-count">${countForStation(item.key)}</span><span class="flow-note">${item.note}</span></button>`).join("")}</div>`;
    }

      let result = appState.station === "attention"

        : orders.filter(order => order.station === appState.station);
      if (appState.filter !== "all") result = result.filter(order => order.status === appState.filter);
      return result;
    }

        <td class="row-chevron">${icon("chevron")}</td>
