<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Direction B — Picture-led Work Sheet</title>
    <style>
      :root {
        --ink: #17212b;
        --muted: #59636b;
        --line: #cfc7b8;
        --paper: #fffdf7;
        --canvas: #eee8db;
        --safety: #c7440a;
        --safety-dark: #943000;
        --amber: #9a5a00;
        --amber-soft: #fff0c7;
        --red: #aa2525;
        --red-soft: #fde8e4;
        --green: #116149;
        --green-soft: #dcf4e9;
        --blue: #1d5678;
        --blue-soft: #e4f1f7;
        --violet: #61409b;
        --violet-soft: #f0eaff;
        --shadow: 0 16px 42px rgb(52 45 34 / 12%);
        --dock-space: 108px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--canvas);
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        background:
          linear-gradient(rgb(23 33 43 / 2%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(23 33 43 / 2%) 1px, transparent 1px),
          var(--canvas);
        background-size: 24px 24px;
        color: var(--ink);
        font-family:
          "Noto Sans Thai", "Leelawadee UI", Tahoma, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        line-height: 1.45;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        touch-action: manipulation;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 4px solid #1267a0;
        outline-offset: 3px;
      }

      .station-app {
        min-height: 100vh;
        min-height: 100svh;
        padding-bottom: var(--dock-space);
      }

      .station-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        min-height: 70px;
        border-bottom: 4px solid var(--safety);
        background: var(--ink);
        color: white;
      }

      .station-id,
      .station-tools {
        display: flex;
        align-items: center;
      }

      .station-id {
        min-width: 0;
        gap: 14px;
        padding: 10px 22px;
      }

      .station-mark {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        place-items: center;
        border: 2px solid rgb(255 255 255 / 72%);
        border-radius: 10px;
        background: var(--safety);
        font-size: 24px;
        font-weight: 900;
      }

      .eyebrow {
        color: #d8dfe3;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .station-name {
        overflow: hidden;
        font-size: clamp(21px, 2.4vw, 28px);
        font-weight: 900;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .station-tools {
        gap: 14px;
        padding: 10px 20px;
        border-left: 1px solid rgb(255 255 255 / 20%);
      }

      .connection,
      .operator {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 800;
        white-space: nowrap;
      }

      .connection svg,
      .operator svg,
      .status-ribbon svg,
      .button svg,
      .lane-state svg,
      .wait-line svg {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
      }

      .station-main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 20px 0 28px;
      }

      .status-ribbon {
        display: flex;
        min-height: 50px;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding: 10px 16px;
        border: 2px solid currentColor;
        border-radius: 12px;
        background: var(--paper);
        color: var(--green);
        font-size: 18px;
        font-weight: 900;
      }

      .status-ribbon.ready,
      .status-ribbon.success {
        background: var(--green-soft);
        color: var(--green);
      }

      .status-ribbon.blocked {
        background: var(--red-soft);
        color: var(--red);
      }

      .status-ribbon.waiting,
      .status-ribbon.stale {
        background: var(--amber-soft);
        color: #754300;
      }

      .status-ribbon.info {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .status-ribbon.unknown {
        background: var(--violet-soft);
        color: var(--violet);
      }

      .work-sheet {
        overflow: hidden;
        border: 2px solid var(--ink);
        border-radius: 22px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .work-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: start;
        padding: 18px 24px;
        border-bottom: 2px solid var(--ink);
      }

      .order-id {
        margin: 0 0 3px;
        color: var(--ink);
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 950;
        letter-spacing: -0.035em;
        line-height: 1.08;
      }

      .order-name {
        margin: 0;
        color: var(--muted);
        font-size: clamp(16px, 2vw, 20px);
        font-weight: 700;
      }

      .paper-tag {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        gap: 8px;
        padding: 7px 13px;
        border: 2px solid var(--ink);
        border-radius: 10px;
        background: #f8d864;
        color: var(--ink);
        font-size: 16px;
        font-weight: 900;
        white-space: nowrap;
        transform: rotate(1deg);
      }

      .work-grid {
        display: grid;
        grid-template-columns: minmax(300px, 0.9fr) minmax(380px, 1.1fr);
        min-height: 430px;
      }

      .picture-zone {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
        padding: 22px;
        border-right: 2px solid var(--ink);
        background:
          linear-gradient(135deg, transparent 75%, rgb(199 68 10 / 7%) 75%),
          #f5f0e4;
        background-size: 18px 18px;
      }

      .diagram-label {
        align-self: flex-start;
        margin: 0 0 8px;
        padding: 5px 10px;
        border-radius: 7px;
        background: var(--ink);
        color: white;
        font-size: 15px;
        font-weight: 900;
      }

      .garment-diagram {
        display: block;
        width: min(100%, 380px);
        max-height: 292px;
        margin: auto;
      }

      .diagram-note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
        text-align: center;
      }

      .task-zone {
        display: flex;
        min-width: 0;
        flex-direction: column;
        padding: 24px 26px 20px;
      }

      .task-label {
        margin: 0 0 2px;
        color: var(--safety-dark);
        font-size: 17px;
        font-weight: 900;
      }

      .task-title {
        margin: 0;
        color: var(--ink);
        font-size: clamp(34px, 5vw, 54px);
        font-weight: 950;
        letter-spacing: -0.04em;
        line-height: 1.07;
      }

      .task-title .qty {
        color: var(--safety-dark);
        white-space: nowrap;
      }

      .task-subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 18px;
        font-weight: 700;
      }

      .spec-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 20px 0 18px;
        border-block: 2px solid var(--line);
      }

      .spec-item {
        min-width: 0;
        padding: 12px 12px 11px;
        text-align: center;
      }

      .spec-item + .spec-item {
        border-left: 2px solid var(--line);
      }

      .spec-name {
        display: block;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
      }

      .spec-value {
        display: block;
        overflow: hidden;
        margin-top: 1px;
        color: var(--ink);
        font-size: clamp(21px, 2.6vw, 30px);
        font-weight: 950;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .instruction {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-top: auto;
        padding: 14px 16px;
        border-left: 7px solid var(--safety);
        background: #f1ede3;
      }

      .instruction-icon {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--ink);
        color: white;
        font-size: 21px;
        font-weight: 950;
      }

      .instruction strong {
        display: block;
        margin-bottom: 2px;
        font-size: 19px;
      }

      .instruction p {
        margin: 0;
        color: #39434b;
        font-size: 16px;
        font-weight: 700;
      }

      .more-details {
        margin-top: 12px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 800;
      }

      .more-details summary {
        min-height: 48px;
        padding: 11px 4px;
        cursor: pointer;
      }

      .more-details p {
        margin: 2px 0 8px;
        color: var(--muted);
        font-weight: 600;
      }

      .action-dock {
        position: fixed;
        z-index: 30;
        right: 0;
        bottom: 0;
        left: 0;
        border-top: 3px solid var(--ink);
        background: rgb(255 253 247 / 97%);
        box-shadow: 0 -10px 28px rgb(23 33 43 / 12%);
        backdrop-filter: blur(10px);
      }

      .dock-inner {
        display: grid;
        width: min(1180px, calc(100% - 40px));
        min-height: 96px;
        margin: 0 auto;
        grid-template-columns: minmax(142px, 0.28fr) minmax(300px, 1fr) minmax(
            160px,
            0.32fr
          );
        gap: 12px;
        align-items: center;
        padding: 12px 0;
      }

      .button {
        display: inline-flex;
        min-height: 54px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        background: white;
        color: var(--ink);
        font-weight: 900;
        line-height: 1.15;
        text-align: center;
        cursor: pointer;
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 5px 0 rgb(23 33 43 / 16%);
      }

      .button:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: none;
      }

      .button.primary {
        min-height: 68px;
        border-color: var(--safety-dark);
        background: var(--safety);
        color: white;
        font-size: clamp(20px, 2.5vw, 28px);
        box-shadow: inset 0 -4px 0 rgb(90 25 0 / 25%);
      }

      .button.primary.safe {
        border-color: #083e2e;
        background: var(--green);
      }

      .button.primary.dark {
        border-color: #000;
        background: var(--ink);
      }

      .button.secondary {
        min-height: 56px;
        padding: 8px 13px;
        font-size: 16px;
      }

      .button.problem {
        border-color: #8b2a19;
        background: #fff7f3;
        color: #782211;
      }

      .button:disabled {
        border-color: #788087;
        background: #dfe2e3;
        color: #4b545b;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }

      .solo-dock .dock-inner {
        grid-template-columns: minmax(140px, 0.32fr) minmax(320px, 1fr);
      }

      .solo-dock .button.primary {
        grid-column: 2;
      }

      .no-dock {
        --dock-space: 28px;
      }

      .stop-grid,
      .handoff-grid,
      .wait-grid {
        display: grid;
        grid-template-columns: minmax(280px, 0.82fr) minmax(380px, 1.18fr);
        min-height: 430px;
      }

      .stop-grid .picture-zone,
      .handoff-grid .picture-zone,
      .wait-grid .picture-zone {
        min-height: 430px;
      }

      .stop-panel,
      .handoff-panel,
      .wait-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 28px;
      }

      .stop-title,
      .handoff-title,
      .wait-title {
        margin: 0;
        font-size: clamp(34px, 5vw, 54px);
        font-weight: 950;
        letter-spacing: -0.035em;
        line-height: 1.08;
      }

      .stop-title {
        color: var(--red);
      }

      .handoff-title {
        color: var(--green);
      }

      .wait-title {
        color: #754300;
      }

      .big-fact {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 15px;
        align-items: center;
        margin: 22px 0 15px;
        padding: 17px 18px;
        border: 2px solid currentColor;
        border-radius: 14px;
        background: var(--red-soft);
        color: var(--red);
      }

      .big-fact .number {
        font-size: clamp(48px, 7vw, 72px);
        font-weight: 950;
        line-height: 0.9;
      }

      .big-fact strong {
        display: block;
        font-size: 20px;
      }

      .big-fact span {
        display: block;
        color: #5d3029;
        font-size: 16px;
        font-weight: 700;
      }

      .wait-line {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 13px;
        padding: 13px 14px;
        border-radius: 10px;
        background: #f0ece2;
        color: var(--ink);
        font-weight: 850;
      }

      .truth-note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 16px;
        font-weight: 650;
      }

      .success-symbol {
        display: grid;
        width: 166px;
        height: 166px;
        margin: auto;
        place-items: center;
        border: 8px solid var(--green);
        border-radius: 50%;
        background: var(--green-soft);
        color: var(--green);
        font-size: 94px;
        font-weight: 950;
        line-height: 1;
      }

      .handoff-arrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 22px 0 10px;
      }

      .handoff-stop {
        flex: 1;
        padding: 13px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        background: white;
        font-weight: 900;
        text-align: center;
      }

      .handoff-stop.next {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--green);
      }

      .handoff-chevron {
        color: var(--green);
        font-size: 30px;
        font-weight: 950;
      }

      .qc-grid {
        display: grid;
        grid-template-columns: minmax(280px, 0.8fr) minmax(420px, 1.2fr);
        min-height: 448px;
      }

      .qc-visual {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px;
        border-right: 2px solid var(--ink);
        background: #f2ede1;
      }

      .pile-visual {
        position: relative;
        width: min(100%, 330px);
        height: 210px;
        margin: 0 auto 16px;
      }

      .shirt-fold {
        position: absolute;
        right: 15%;
        left: 15%;
        height: 105px;
        border: 3px solid var(--ink);
        border-radius: 14px;
        background: #f7f8f6;
        box-shadow: 0 7px 0 rgb(23 33 43 / 12%);
      }

      .shirt-fold:nth-child(1) {
        top: 10px;
        transform: rotate(-3deg);
      }

      .shirt-fold:nth-child(2) {
        top: 48px;
        transform: rotate(2deg);
      }

      .shirt-fold:nth-child(3) {
        top: 88px;
        display: grid;
        place-items: center;
        background: var(--blue-soft);
        font-size: 48px;
        font-weight: 950;
      }

      .qty-equation {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .qty-equation div {
        padding: 10px 6px;
        border: 2px solid var(--ink);
        border-radius: 9px;
        background: white;
        text-align: center;
      }

      .qty-equation strong {
        display: block;
        font-size: 30px;
        line-height: 1;
      }

      .qty-equation span {
        color: var(--muted);
        font-size: 14px;
        font-weight: 750;
      }

      .qc-panel {
        display: flex;
        min-width: 0;
        flex-direction: column;
        padding: 26px 28px;
      }

      .qc-title {
        margin: 0;
        font-size: clamp(32px, 4.5vw, 48px);
        font-weight: 950;
        line-height: 1.08;
      }

      .qc-help {
        margin: 8px 0 18px;
        color: var(--muted);
        font-size: 17px;
        font-weight: 700;
      }

      .choice-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: auto;
      }

      .choice-button {
        display: flex;
        min-height: 126px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 4px;
        padding: 17px;
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: white;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .choice-button:hover {
        background: #f4efe3;
      }

      .choice-icon {
        font-size: 32px;
        font-weight: 950;
        line-height: 1;
      }

      .choice-button strong {
        font-size: 22px;
      }

      .choice-button span:last-child {
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
      }

      .qc-form {
        display: grid;
        gap: 15px;
        margin-top: 12px;
      }

      .field label {
        display: block;
        margin-bottom: 5px;
        font-size: 16px;
        font-weight: 900;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 54px;
        border: 2px solid var(--ink);
        border-radius: 9px;
        background: white;
        color: var(--ink);
        padding: 8px 12px;
        font-size: 19px;
        font-weight: 750;
      }

      .qc-result-line {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .qc-result-line div {
        padding: 11px 13px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: #f3efe6;
      }

      .qc-result-line strong {
        display: block;
        font-size: 27px;
      }

      .qc-result-line span {
        color: var(--muted);
        font-size: 14px;
        font-weight: 750;
      }

      .form-error {
        min-height: 24px;
        margin: 0;
        color: var(--red);
        font-size: 15px;
        font-weight: 850;
      }

      .inline-actions {
        display: grid;
        grid-template-columns: minmax(120px, 0.35fr) minmax(220px, 1fr);
        gap: 12px;
        margin-top: auto;
      }

      .inline-actions .button.primary {
        min-height: 62px;
      }

      .mock-note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .dtf-sheet {
        padding: 22px;
      }

      .dtf-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 16px;
      }

      .dtf-heading h1 {
        margin: 0;
        font-size: clamp(32px, 4.5vw, 46px);
        font-weight: 950;
        line-height: 1.05;
      }

      .dtf-heading p {
        margin: 3px 0 0;
        color: var(--muted);
        font-weight: 700;
      }

      .dtf-heading .paper-tag {
        flex: 0 0 auto;
      }

      .dtf-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
        gap: 16px;
      }

      .run-card {
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: white;
      }

      .run-card.active {
        background: var(--ink);
        color: white;
      }

      .run-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 15px 17px;
        border-bottom: 2px solid currentColor;
      }

      .run-head strong {
        font-size: 25px;
      }

      .run-phase {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 15px;
        font-weight: 900;
      }

      .run-body {
        display: grid;
        grid-template-columns: minmax(130px, 0.6fr) minmax(0, 1fr);
        gap: 18px;
        align-items: center;
        padding: 18px;
      }

      .film-roll {
        position: relative;
        width: 150px;
        height: 128px;
        margin: auto;
      }

      .roll-circle {
        position: absolute;
        bottom: 4px;
        left: 0;
        display: grid;
        width: 94px;
        height: 94px;
        place-items: center;
        border: 8px solid currentColor;
        border-radius: 50%;
        font-size: 19px;
        font-weight: 950;
      }

      .roll-tail {
        position: absolute;
        right: 1px;
        bottom: 2px;
        width: 88px;
        height: 82px;
        border: 5px solid currentColor;
        border-left: 0;
        border-radius: 0 8px 8px 0;
        transform: skewY(-7deg);
      }

      .run-metric {
        margin: 0;
        font-size: 18px;
        font-weight: 750;
      }

      .run-metric strong {
        display: block;
        font-size: clamp(34px, 5vw, 52px);
        font-weight: 950;
        line-height: 1;
      }

      .run-copy {
        margin: 8px 0 0;
        color: inherit;
        font-size: 15px;
        font-weight: 650;
        opacity: 0.84;
      }

  <body>
    <div id="app" aria-live="polite"></div>

    <details class="prototype-panel" id="prototypePanel" hidden>
      <summary id="prototypeSummary">ต้นแบบ · เลือกสถานะ</summary>
      <div class="prototype-content">
        <p>เปลี่ยนข้อมูลตัวอย่างเท่านั้น ไม่เรียก API และไม่บันทึกฐานข้อมูล</p>
        <div class="state-buttons" id="stateButtons"></div>
      </div>
    </details>

    <script>
      (() => {
        "use strict";

        const app = document.querySelector("#app");
        const stateButtons = document.querySelector("#stateButtons");
        const prototypePanel = document.querySelector("#prototypePanel");
        const prototypeSummary = document.querySelector("#prototypeSummary");

        prototypePanel.hidden =
          new URLSearchParams(window.location.search).get("controls") !== "1";

        const states = [
          ["ready", "พร้อมเริ่ม"],
          ["inprogress", "กำลังทำ"],
          ["blocked", "ของขาด"],
          ["wait", "รอของ"],
          ["assigned", "ส่งต่อคนอื่น"],
          ["handoff", "ส่งต่อ QC"],
          ["qc", "ตรวจคุณภาพ"],
          ["dtf", "รอบ DTF"],
          ["multilane", "หลายส่วน"],
          ["stale", "ข้อมูลไม่สด"],
          ["pending", "กำลังบันทึก"],
          ["sync", "บันทึกแล้ว/รอสด"],
          ["unknown", "ผลยังไม่ทราบ"],
        ];

        const allowedStates = new Set(states.map(([key]) => key));
        const requestedState = new URLSearchParams(window.location.search).get(
          "state",
        );
        let currentState = allowedStates.has(requestedState)
          ? requestedState
          : "ready";
        let qcMode = "choose";
        let dtfPrintedDone = false;
        let dtfCutDone = false;

        const icons = {
          wifi: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5a14 14 0 0 1 18 0M6.5 13a9 9 0 0 1 11 0M10 16.5a4 4 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="20" r="1.7" fill="currentColor"/></svg>`,
          user: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 21c.7-4.2 3.2-6.3 7.5-6.3s6.8 2.1 7.5 6.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
          play: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10 8 6 4-6 4Z" fill="currentColor"/></svg>`,
          check: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6.5-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
          stop: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3-5 5v8l5 5h8l5-5V8l-5-5Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/></svg>`,
          wait: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

                <form class="qc-form" id="qcDefectForm" novalidate>
                  <div class="field"><label for="defectCount">เสียกี่ตัว</label><input id="defectCount" name="defectCount" type="number" min="1" max="30" inputmode="numeric" placeholder="เช่น 2" /></div>
                  <div class="field"><label for="defectReason">เกิดอะไรขึ้น</label><select id="defectReason" name="defectReason"><option value="">เลือกเหตุผล</option><option>ภาพเอียง / ผิดตำแหน่ง</option><option>สีหรือฟิล์มไม่ติด</option><option>เสื้อเสียหาย</option><option>อื่น ๆ — ให้หัวหน้าตรวจ</option></select></div>
                  <div class="qc-result-line"><div><strong id="goodComputed">30</strong><span>ของดี (ระบบคำนวณ)</span></div><div><strong id="badComputed">0</strong><span>ของเสีย</span></div></div>
                  <p class="form-error" id="qcError" role="alert"></p>
                </form>
                <div class="inline-actions"><button class="button secondary" type="button" data-action="qcBack">ย้อนกลับ</button><button class="button primary" id="qcReviewButton" type="button" data-action="qcReviewDefect" disabled>${icons.arrow}<span>ทวนผลตรวจ</span></button></div>
                <p class="mock-note">ของดีคำนวณจาก 30 − ของเสีย จึงบันทึกเกินกองเดียวกันไม่ได้</p>
              </div>
            </div>`;
        }

        function qcDefectConfirm() {
          const defectCount = Number(app.dataset.defectCount || 0);
          const defectReason = app.dataset.defectReason || "—";
          const goodCount = 30 - defectCount;
          return `
            <div class="qc-grid">
              <div class="qc-visual">${qcVisual()}</div>
              <div class="qc-panel">
                <p class="task-label">ทวนผลก่อนบันทึก</p>
                <h2 class="qc-title">ดี ${goodCount} · เสีย ${defectCount}</h2>
                <p class="qc-help">เหตุผล: ${defectReason}</p>
                <div class="qc-result-line"><div><strong>${goodCount}</strong><span>ของดี</span></div><div><strong>${defectCount}</strong><span>ของเสีย</span></div></div>
                <div class="instruction"><span class="instruction-icon" aria-hidden="true">30</span><div><strong>รวม ${goodCount + defectCount} ตัว</strong><p>ผลรวมไม่เกินกองที่กำลังตรวจ</p></div></div>
                <div class="inline-actions"><button class="button secondary" type="button" data-action="qcEditDefect">แก้จำนวน</button><button class="button primary safe" type="button" data-action="qcConfirmDefect">${icons.check}<span>ยืนยันผล 30 ตัว</span></button></div>
                <p class="mock-note">ต้นแบบนี้ไม่เขียนฐานข้อมูล</p>
              </div>
            </div>`;
        }

        function qcDone() {
          return `
            <div class="handoff-grid">
              <div class="picture-zone"><div class="success-symbol" aria-hidden="true">✓</div><p class="diagram-note">ตัวอย่างผลหลัง server ยืนยันเท่านั้น</p></div>
              <div class="handoff-panel">
                <h2 class="handoff-title">ตรวจครบกองนี้แล้ว</h2>
                <p class="task-subtitle">ผลตัวอย่างพร้อมส่งต่อขั้นตอนถัดไป</p>
                <div class="wait-line">${icons.check}<span>ผลรวมของดีและของเสียครบ 30 ตัว</span></div>
                <p class="mock-note">นี่เป็น interaction prototype ไม่ได้บันทึกข้อมูลจริง</p>
                <div class="inline-actions"><button class="button secondary" type="button" data-action="qcBack">ดูทางเลือกอีกครั้ง</button><button class="button primary safe" type="button" data-action="queue">${icons.arrow}<span>กลับคิว QC</span></button></div>
              </div>
            </div>`;
        }

        function qc() {
          let content = qcChoose();
          if (qcMode === "good") content = qcGoodConfirm();
          if (qcMode === "defect") content = qcDefectForm();
          if (qcMode === "defectConfirm") content = qcDefectConfirm();
          if (qcMode === "done") content = qcDone();
          return `
            <div class="station-app no-dock">
              ${header("ตรวจคุณภาพ", "◎")}
              <main class="station-main">
                ${statusRibbon(qcMode === "done" ? "success" : "ready", qcMode === "done" ? "check" : "play", qcMode === "done" ? "ตัวอย่างผลหลังยืนยัน" : "พร้อมตรวจ · กองนี้ 30 ตัว")}
                <section class="work-sheet" aria-labelledby="qcTask">
                  ${heading("ORD-2608-0010", "บริษัท เมืองไทย ไลฟ์สไตล์ จำกัด", "เสื้อพนักงานกิจกรรม", "ใบตรวจ QC")}
                  ${content}
                </section>
              </main>
            </div>`;
        }

        function dtf() {
          return `
            <div class="station-app no-dock">
              ${header("พิมพ์ DTF", "▥")}
              <main class="station-main">
                ${statusRibbon("info", "play", "มีงานที่ต้องทำตอนนี้ 2 อย่าง · ไม่รวมเป็นขั้นตอนเดียว")}
                <section class="work-sheet dtf-sheet" aria-labelledby="dtfTitle">
                  <div class="dtf-heading"><div><h1 id="dtfTitle">งานหน้าสถานี DTF</h1><p>งานกำลังพิมพ์อยู่บนสุดเสมอ · ไม่มีการแต่งชื่อเครื่อง</p></div><span class="paper-tag">รอบจริง + งานเข้า</span></div>
                  <div class="dtf-grid">
                    <article class="run-card active">
                      <div class="run-head"><strong>FR-2608-0001</strong><span class="run-phase">${icons.play}${dtfPrintedDone ? "พิมพ์จบแล้ว" : "กำลังพิมพ์"}</span></div>
                      <div class="run-body">
                        <div class="film-roll" aria-hidden="true"><div class="roll-circle">DTF</div><div class="roll-tail"></div></div>
                        <div><p class="run-metric"><strong>1 ม้วน</strong>รวม 3 ออเดอร์</p><p class="run-copy">จบการพิมพ์ทั้งม้วนก่อนส่งไปตัดแยก</p>${dtfPrintedDone ? `<div class="wait-line">${icons.check}<span>ตัวอย่าง: พิมพ์จบแล้ว</span></div>` : `<button class="button primary run-action" type="button" data-action="dtfFinishPrint">${icons.check}<span>พิมพ์จบทั้งม้วน</span></button>`}</div>
                      </div>
                    </article>
                    <article class="run-card cut-card">
                      <div class="run-head"><strong>FR-2608-0002</strong><span class="run-phase">${icons.wait}${dtfCutDone ? "ตัดเสร็จแล้ว" : "พิมพ์แล้ว · รอตัด"}</span></div>
                      <div class="run-body">
                        <div class="cut-symbol" aria-hidden="true">✂</div>
                        <div><p class="run-metric"><strong>2 ออเดอร์</strong>ตัดแยกและติดป้าย</p><p class="run-copy">ป้ายแต่ละชุดต้องตรงเลขออเดอร์</p>${dtfCutDone ? `<div class="wait-line">${icons.check}<span>ตัวอย่าง: ตัดและติดป้ายแล้ว</span></div>` : `<button class="button secondary run-action" type="button" data-action="dtfFinishCut">${icons.check}<span>ตัดและติดป้ายเสร็จ</span></button>`}</div>
                      </div>
                    </article>
                  </div>
                  <div class="incoming-row"><span class="incoming-symbol" aria-hidden="true">＋</span><div><strong>ORD-2608-0004 · งานใหม่พร้อมเข้ารอบ</strong><span>งานนี้รออยู่ ไม่ได้ดันรอบที่กำลังพิมพ์ออกจากจอ</span></div><span class="waiting-chip">รอเข้ารอบ DTF</span></div>
                </section>
              </main>
            </div>`;
        }

        function multiLane() {
          return `
            <div class="station-app">
              ${header("งานหลายส่วน", "≋")}
              <main class="station-main">
                ${statusRibbon("info", "play", "ออเดอร์เดียวมีหลายส่วนพร้อมกัน · ไม่ใช่ขั้นตอนเรียงเส้นเดียว")}
                <section class="work-sheet lane-sheet" aria-labelledby="laneTitle">
                  <div class="lane-intro"><h1 id="laneTitle">ORD-2608-0012 · เสื้ออีเวนต์ 80 ตัว</h1><p>แต่ละส่วนมีเจ้าของและความพร้อมของตัวเอง</p></div>
                  <div class="lane-grid">
                    <article class="lane-card active"><div class="lane-state">${icons.play}<span>กำลังทำ · งานรีดด้านหน้า</span></div><h2>รีดร้อน</h2><p>ด้านหน้า · ขนาด A4</p><div class="lane-number">24 / 80</div><span class="lane-owner">ผู้ทำ: ศรุจ</span></article>
                    <article class="lane-card"><div class="lane-state">${icons.check}<span>พร้อมเริ่ม · งานเย็บป้าย</span></div><h2>เย็บป้าย</h2><p>พร้อมจริง แต่ยังไม่แทรกงานที่กำลังทำ</p><div class="lane-number">0 / 80</div><span class="lane-owner">ยังไม่มีผู้รับงาน</span></article>
                    <article class="lane-card other"><div class="lane-state">${icons.lock}<span>คนอื่นกำลังทำ · งานแพ็กชุดพิเศษ</span></div><h2>แพ็กชุดพิเศษ</h2><p>แสดงให้เห็นบริบท แต่ไม่มีปุ่มทำแทน</p><div class="lane-number">12 / 20</div><span class="lane-owner">ผู้ทำ: สมชาย</span></article>
                  </div>
                </section>
              </main>
              ${dock({ primary: "บันทึกจำนวนที่รีดเสร็จ", primaryAction: "laneProgress", primaryIcon: "check", left: "กลับคิว", leftAction: "queue", right: "ทำต่อไม่ได้", rightAction: "problem" })}
            </div>`;
        }

        function safetyState(type) {
          const configs = {
            stale: {
              online: false,
              ribbon: statusRibbon("stale", "alert", "ข้อมูลไม่สด · อัปเดตล่าสุด 12:14"),
              symbol: "!",
              symbolClass: "",
              title: "เริ่มงานไม่ได้",
              text: "ยังอ่านใบงานเดิมได้ แต่ต้องอัปเดตข้อมูลก่อน เพราะงานอาจถูกเปลี่ยนจากอีกเครื่อง",
              warn: "อย่ากดเริ่มหรือทำงานจริงจากข้อมูลเก่า",
              primary: "ลองอัปเดตอีกครั้ง",
              action: "refreshToReady",
              icon: "refresh",
            },
            pending: {
              online: true,
              ribbon: statusRibbon("info", "wait", "กำลังบันทึกคำสั่งเริ่มรีด"),
              symbol: "…",
              symbolClass: "",
              title: "กำลังบันทึก",
              text: "รอคำตอบจากระบบก่อน ปุ่มงานทุกปุ่มถูกล็อกชั่วคราว",
              warn: "อย่ากดซ้ำ อย่าปิดหน้า และอย่าเริ่มนับงานรอบใหม่",
              primary: "กำลังบันทึก…",
              action: "noop",
              icon: "lock",
              disabled: true,
            },
            sync: {
              online: false,
              ribbon: statusRibbon("success", "check", "บันทึกแล้ว 12:21 · แต่ข้อมูลใหม่ยังโหลดไม่สำเร็จ"),
              symbol: "✓",
              symbolClass: "success",
              title: "คำสั่งถูกบันทึกแล้ว",
              text: "ไม่ต้องกดเริ่มซ้ำ ระบบยืนยันผลแล้ว แต่ยังไม่เปิดงานถัดไปจนกว่าข้อมูลจะสด",
              warn: "ห้ามทำคำสั่งเดิมซ้ำ",
              primary: "อัปเดตหน้าจอ",
              action: "refreshToProgress",
              icon: "refresh",
            },
            unknown: {
              online: false,
              ribbon: statusRibbon("unknown", "alert", "ผลยังไม่ทราบ · กำลังตรวจคำสั่งเดิม"),
              symbol: "?",
              symbolClass: "unknown",
              title: "ยังไม่รู้ว่าบันทึกหรือยัง",
              text: "การเชื่อมต่อขาดก่อนเห็นผล ระบบต้องตรวจคำสั่งเดิมก่อน ไม่สร้างคำสั่งใหม่",
              warn: "อย่ากดเริ่มซ้ำ และอย่าเริ่มงานกองใหม่",
              primary: "ตรวจผลอีกครั้ง",
              action: "resolveUnknown",
              icon: "refresh",
            },
          };
          const config = configs[type];
          return `
            <div class="station-app">
              ${header("รีดร้อน", "♨", config.online)}
              <main class="station-main">
                ${config.ribbon}
                <section class="work-sheet" aria-labelledby="safetyTitle">
                  ${heading("ORD-2608-0007", "บริษัท นอร์ทสตาร์ รีเทล จำกัด", "เสื้อครบรอบสตูดิโอโยคะ", "ใบงานรีดร้อน")}
                  <div class="safety-sheet">
                    <div class="safety-visual"><div class="safety-symbol ${config.symbolClass}" aria-hidden="true">${config.symbol}</div></div>
                    <div class="safety-panel"><h1 id="safetyTitle">${config.title}</h1><p>${config.text}</p><div class="do-not">${icons.stop} ${config.warn}</div><div class="spec-strip"><div class="spec-item"><span class="spec-name">งาน</span><strong class="spec-value">รีดร้อน</strong></div><div class="spec-item"><span class="spec-name">จำนวน</span><strong class="spec-value">54 ตัว</strong></div><div class="spec-item"><span class="spec-name">ตำแหน่ง</span><strong class="spec-value">ด้านหลัง</strong></div></div></div>
                  </div>
                </section>
              </main>
              ${dock({ primary: config.primary, primaryAction: config.action, primaryIcon: config.icon, primaryClass: type === "sync" ? "safe" : "dark", disabled: config.disabled, left: "กลับคิว", leftAction: "queue", solo: true })}
            </div>`;
        }

        function render() {
          document.documentElement.style.setProperty(
            "--dock-space",
            ["qc", "dtf"].includes(currentState) ? "28px" : "108px",
          );

          const renderers = {
            ready: heatReady,
            inprogress: heatInProgress,
            blocked,
            wait: routineWait,
            assigned: assignedOther,
            handoff,
            qc,
            dtf,
            multilane: multiLane,
            stale: () => safetyState("stale"),
            pending: () => safetyState("pending"),
            sync: () => safetyState("sync"),
            unknown: () => safetyState("unknown"),
          };

          app.innerHTML = renderers[currentState]();
          app.dataset.state = currentState;
          renderStateButtons();
          bindFormState();
          window.requestAnimationFrame(() => {
            const mainHeading = app.querySelector("h1, h2");
            if (mainHeading) mainHeading.setAttribute("tabindex", "-1");
          });
        }

        function renderStateButtons() {
          const activeLabel = states.find(([key]) => key === currentState)?.[1];
          prototypeSummary.textContent = `ต้นแบบ · ${activeLabel}`;
          stateButtons.innerHTML = states
            .map(
              ([key, label]) =>
                `<button type="button" data-state="${key}" aria-current="${key === currentState}">${label}</button>`,
            )
            .join("");
        }

        function setState(next, { focus = true } = {}) {
          if (!allowedStates.has(next)) return;
          currentState = next;
          qcMode = "choose";
          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set("state", next);
          window.history.replaceState({ state: next }, "", nextUrl);
          render();
          if (focus) {
            window.requestAnimationFrame(() => {
              const headingElement = app.querySelector("h1, h2");
              headingElement?.focus({ preventScroll: true });
            });
          }
        }

        function bindFormState() {
          if (currentState !== "qc" || qcMode !== "defect") return;
          const countInput = document.querySelector("#defectCount");
          const reasonSelect = document.querySelector("#defectReason");
          const goodComputed = document.querySelector("#goodComputed");
          const badComputed = document.querySelector("#badComputed");
          const error = document.querySelector("#qcError");
          const review = document.querySelector("#qcReviewButton");

          const update = () => {
            const rawCount = countInput.value.trim();
            const count = Number(rawCount);
            const countValid = rawCount !== "" && Number.isInteger(count) && count >= 1 && count <= 30;
            const reasonValid = reasonSelect.value !== "";
            const shownCount = countValid ? count : 0;
            goodComputed.textContent = String(30 - shownCount);
            badComputed.textContent = String(shownCount);
            review.disabled = !(countValid && reasonValid);
            if (rawCount !== "" && !countValid) {
              error.textContent = "ใส่จำนวนของเสียตั้งแต่ 1 ถึง 30 ตัว";
            } else if (countValid && !reasonValid) {
              error.textContent = "เลือกเหตุผลของเสียก่อน";
            } else {
              error.textContent = "";
            }
          };

          countInput.addEventListener("input", update);
          reasonSelect.addEventListener("change", update);
          update();
        }

        function showPrototypeNotice(message) {
          const existing = document.querySelector("#prototypeNotice");
          existing?.remove();
          const notice = document.createElement("div");
          notice.id = "prototypeNotice";
          notice.setAttribute("role", "status");
          notice.style.cssText =
            "position:fixed;z-index:80;left:50%;top:82px;transform:translateX(-50%);max-width:calc(100vw - 24px);padding:12px 16px;border:2px solid #17212b;border-radius:10px;background:#fffdf7;color:#17212b;font-weight:900;box-shadow:0 8px 24px rgb(23 33 43 / 22%);text-align:center";
          notice.textContent = message;
          document.body.appendChild(notice);
          window.setTimeout(() => notice.remove(), 2400);
        }

        document.addEventListener("click", (event) => {
          const stateButton = event.target.closest("#stateButtons [data-state]");
          if (stateButton) {
            setState(stateButton.dataset.state);
            document.querySelector("#prototypePanel").open = false;
            return;
          }

          const actionButton = event.target.closest("[data-action]");
          if (!actionButton || actionButton.disabled) return;
          const action = actionButton.dataset.action;

          if (action === "startHeat") setState("inprogress");
          else if (action === "finishHeat") setState("handoff");
          else if (action === "refreshToReady") setState("ready");
          else if (action === "refreshToProgress") setState("inprogress");
          else if (action === "resolveUnknown") setState("inprogress");
          else if (action === "openQcHandoff") {
            showPrototypeNotice("ต้นแบบ: เปิดคิว QC ของออเดอร์เดิม โดยยังไม่เริ่มงานแทน");
          } else if (action === "qcGood") {
            qcMode = "good";
            render();
          } else if (action === "qcDefect") {
            qcMode = "defect";
            render();
            window.requestAnimationFrame(() => document.querySelector("#defectCount")?.focus());
          } else if (action === "qcBack") {
            qcMode = "choose";
            render();
          } else if (action === "qcEditDefect") {
            qcMode = "defect";
            render();
          } else if (action === "qcReviewDefect") {
            const countInput = document.querySelector("#defectCount");
            const reasonSelect = document.querySelector("#defectReason");
            const count = Number(countInput?.value);
            if (!Number.isInteger(count) || count < 1 || count > 30 || !reasonSelect?.value) return;
            app.dataset.defectCount = String(count);
            app.dataset.defectReason = reasonSelect.value;
            qcMode = "defectConfirm";
            render();
          } else if (action === "qcConfirmGood" || action === "qcConfirmDefect") {
            qcMode = "done";
            render();
          } else if (action === "dtfFinishPrint") {
            dtfPrintedDone = true;
            render();
          } else if (action === "dtfFinishCut") {
            dtfCutDone = true;
            render();
          } else if (["queue", "scan", "problem", "laneProgress"].includes(action)) {
            const labels = {
              queue: "ต้นแบบ: เปิดคิวอื่น โดยไม่เปลี่ยนสถานะงาน",
              scan: "ต้นแบบ: เปิดหน้าสแกน งานจะยังไม่ถูกเริ่มอัตโนมัติ",
              problem: "ต้นแบบ: เปิดฟอร์มแจ้งปัญหา โดยยังไม่ส่งข้อมูล",
              laneProgress: "ต้นแบบ: เปิดฟอร์มนับจำนวนงานรีดด้านหน้า โดยไม่แตะงานส่วนอื่น",
            };
            showPrototypeNotice(labels[action]);
          }
        });

        window.addEventListener("popstate", () => {
          const next = new URLSearchParams(window.location.search).get("state");
          currentState = allowedStates.has(next) ? next : "ready";
          qcMode = "choose";
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
