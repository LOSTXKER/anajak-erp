<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Direction A — One Task Kiosk</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07101e;
        --surface: #101c2e;
        --surface-2: #16243a;
        --line: #2d3e58;
        --text: #f7f9fc;
        --muted: #b8c3d4;
        --blue: #5b94ff;
        --blue-strong: #377af0;
        --green: #54d58b;
        --amber: #ffc361;
        --red: #ff737b;
        --shadow: 0 18px 48px rgb(0 0 0 / 28%);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 85% -20%, rgb(56 111 203 / 18%), transparent 45%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Noto Sans Thai",
          "Leelawadee UI", sans-serif;
        font-size: 18px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 4px solid #fff;
        outline-offset: 3px;
      }

      .topbar {
        position: sticky;
        z-index: 20;
        top: 0;
        display: flex;
        min-height: 76px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 28px;
        border-bottom: 1px solid var(--line);
        background: rgb(7 16 30 / 94%);
        backdrop-filter: blur(12px);
      }

      .station-id,
      .top-actions,
      .status,
      .user,
      .meta-line,
      .button-content,
      .inline-state,
      .owner-line {
        display: flex;
        align-items: center;
      }

      .station-id {
        min-width: 0;
        gap: 14px;
      }

      .station-mark {
        display: grid;
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid #3f5e88;
        border-radius: 15px;
        background: #142844;
        color: #91b9ff;
      }

      .station-mark svg,
      .icon svg,
      .alert-icon svg {
        width: 25px;
        height: 25px;
        stroke: currentColor;
      }

      .station-label {
        margin: 0 0 1px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
      }

      .station-name {
        margin: 0;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .top-actions {
        gap: 10px;
      }

      .user {
        gap: 9px;
        color: var(--muted);
        font-size: 16px;
        white-space: nowrap;
      }

      .online-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 4px rgb(84 213 139 / 12%);
      }

      .top-button,
      .quiet-button,
      .choice-button,
      .stepper-button,
      .prototype-toggle {
        min-height: 50px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        cursor: pointer;
      }

      .top-button {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 0 17px;
        font-weight: 750;
      }

      .top-button .count {
        display: grid;
        min-width: 27px;
        height: 27px;
        padding: 0 7px;
        place-items: center;
        border-radius: 999px;
        background: #2d5d9f;
        color: #fff;
        font-size: 15px;
      }

      .mobile-queue-label {
        display: none;
      }

      .workspace {
        width: min(100%, 1080px);
        min-height: calc(100vh - 76px);
        margin: 0 auto;
        padding: 26px 30px 32px;
      }

      .work-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 18px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .status {
        width: fit-content;
        gap: 9px;
        margin-bottom: 10px;
        color: var(--green);
        font-size: 17px;
        font-weight: 850;
      }

      .status .icon {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 50%;
        background: rgb(84 213 139 / 14%);
      }

      .status.amber {
        color: var(--amber);
      }

      .status.amber .icon {
        background: rgb(255 195 97 / 14%);
      }

      .status.red {
        color: var(--red);
      }

      .status.red .icon {
        background: rgb(255 115 123 / 14%);
      }

      .status.blue {
        color: #8eb9ff;
      }

      .status.blue .icon {
        background: rgb(91 148 255 / 15%);
      }

      .order-number {
        margin: 0;
        font-size: clamp(31px, 4.2vw, 48px);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }

      .order-copy {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 18px;
      }

      .product-name {
        color: var(--text);
        font-weight: 750;
      }

      .detail-button {
        min-height: 50px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-weight: 750;
        white-space: nowrap;
      }

      .task {
        padding: 25px 0 22px;
      }

      .task-kicker {
        margin: 0 0 3px;
        color: var(--muted);
        font-size: 16px;
        font-weight: 800;
      }

      .task-title {
        margin: 0;
        font-size: clamp(34px, 5vw, 54px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .task-title.danger {
        max-width: 840px;
        color: #fff;
      }

      .task-note {
        max-width: 780px;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 18px;
      }

      .facts {
        display: grid;
        grid-template-columns: 1.25fr 1fr 1fr;
        gap: 1px;
        margin-top: 22px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--line);
      }

      .fact {
        min-width: 0;
        padding: 16px 20px;
        background: var(--surface);
      }

      .fact-label {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 750;
      }

      .fact-value {
        display: block;
        overflow-wrap: anywhere;
        font-size: 22px;
        font-weight: 850;
      }

      .fact-value.big {
        font-size: 36px;
        line-height: 1.05;
      }

      .fact-value.red {
        color: var(--red);
      }

      .action-zone {
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .primary-button {
        width: 100%;
        min-height: 70px;
        padding: 12px 20px;
        border: 1px solid #6fa3ff;
        border-radius: 17px;
        background: linear-gradient(180deg, var(--blue), var(--blue-strong));
        box-shadow: 0 12px 28px rgb(34 99 206 / 25%);
        color: #061329;
        cursor: pointer;
        font-size: 22px;
        font-weight: 900;
      }

      .primary-button.green {
        border-color: #6de4a0;
        background: linear-gradient(180deg, #69dfa0, #43bd7b);
        color: #062116;
        box-shadow: 0 12px 28px rgb(44 173 110 / 20%);
      }

      .primary-button.amber {
        border-color: #ffcf7d;
        background: linear-gradient(180deg, #ffd17e, #f1a837);
        color: #241405;
        box-shadow: 0 12px 28px rgb(204 129 20 / 20%);
      }

      .primary-button:disabled,
      .choice-button:disabled {
        border-color: #354359;
        background: #253247;
        box-shadow: none;
        color: #7f8ba0;
        cursor: not-allowed;
      }

      .button-content {
        justify-content: center;
        gap: 12px;
      }

      .button-content svg {
        width: 27px;
        height: 27px;
        stroke: currentColor;
      }

      .secondary-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 12px;
      }

      .quiet-button {
        min-width: 190px;
        padding: 0 18px;
        color: var(--muted);
        font-weight: 800;
      }

      .quiet-button:hover,
      .top-button:hover,
      .choice-button:hover {
        border-color: #56749c;
        background: var(--surface-2);
      }

      .alert-block {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 15px;
        margin-top: 20px;
        padding: 18px 20px;
        border: 1px solid #7c4b50;
        border-radius: 17px;
        background: #2d1c27;
      }

      .alert-block.amber {
        border-color: #765d32;
        background: #2b251b;
      }

      .alert-icon {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 13px;
        background: rgb(255 115 123 / 14%);
        color: var(--red);
      }

      .alert-block.amber .alert-icon {
        background: rgb(255 195 97 / 13%);
        color: var(--amber);
      }

      .alert-title {
        margin: 0;
        font-size: 21px;
        font-weight: 900;
      }

      .alert-copy {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 17px;
      }

      .owner-line {
        gap: 10px;
        margin-top: 16px;
        color: var(--muted);
        font-weight: 750;
      }

      .owner-avatar {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 50%;
        background: #253b5b;
        color: #dce8fb;
      }

      .choice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 22px;
      }

      .choice-button {
        min-height: 88px;
        padding: 14px 18px;
        border-width: 2px;
        text-align: left;
      }

      .choice-button strong,
      .choice-button span {
        display: block;
      }

      .choice-button strong {
        font-size: 22px;
      }

      .choice-button span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 16px;
      }

      .confirm-panel {
        margin-top: 22px;
        padding: 20px;
        border: 1px solid #446ca5;
        border-radius: 18px;
        background: #101f36;
      }

      .confirm-panel h2 {
        margin: 0;
        font-size: 26px;
      }

      .confirm-panel p {
        margin: 6px 0 18px;
        color: var(--muted);
      }

      .defect-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 0.7fr);
        gap: 18px;
        margin-top: 18px;
      }

      .field {
        min-width: 0;
      }

      .field label,
      .field-legend {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 16px;
        font-weight: 800;
      }

      .stepper {
        display: grid;
        grid-template-columns: 58px 1fr 58px;
        gap: 10px;
      }

      .stepper-button {
        font-size: 28px;
        font-weight: 900;
      }

      .stepper input,
      .field select {
        width: 100%;
        min-height: 58px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #0c1728;
        color: var(--text);
      }

      .stepper input {
        text-align: center;
        font-size: 26px;
        font-weight: 900;
      }

      .field select {
        padding: 0 14px;
      }

      .calculation {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
        margin: 18px 0;
        color: var(--muted);
      }

      .calculation strong {
        color: var(--text);
        font-size: 21px;
      }

      .batch-list,
      .lane-list {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }

      .batch-row,
      .lane-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 17px 18px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: var(--surface);
      }

      .batch-row.current,
      .lane-row.current {
        border-color: #4d78b2;
        background: #12233c;
      }

      .row-state {
        margin: 0 0 3px;
        color: var(--green);
        font-size: 15px;
        font-weight: 900;
      }

      .row-state.amber {
        color: var(--amber);
      }

      .row-state.blue {
        color: #93baff;
      }

      .row-state.muted {
        color: var(--muted);
      }

      .row-title {
        margin: 0;
        font-size: 21px;
        line-height: 1.2;
      }

      .row-copy {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 16px;
      }

      .row-button {
        min-height: 54px;
        padding: 0 17px;
        border: 1px solid #6fa3ff;
        border-radius: 14px;
        background: var(--blue);
        color: #061329;
        cursor: pointer;
        font-weight: 900;
        white-space: nowrap;
      }

      .row-button.amber {
        border-color: #ffcf7d;
        background: var(--amber);
        color: #251504;
      }

      .row-owner {
        color: var(--muted);
        font-size: 16px;
        font-weight: 800;
        text-align: right;
      }

      dialog {
        width: min(92vw, 650px);
        max-height: 82vh;
        padding: 0;
        overflow: hidden;
        border: 1px solid #49617f;
        border-radius: 22px;
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--text);
      }

      dialog::backdrop {
        background: rgb(1 6 14 / 72%);
        backdrop-filter: blur(4px);
      }

      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
      }

      .dialog-head h2 {
        margin: 0;
        font-size: 25px;
      }

      .dialog-close {
        width: 48px;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: transparent;
        cursor: pointer;
        font-size: 24px;
      }

      .dialog-body {
        max-height: calc(82vh - 90px);
        padding: 20px 22px 24px;
        overflow-y: auto;
      }

      .queue-item {
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }

      .queue-item:last-child {
        border-bottom: 0;
      }

      .queue-item strong,
      .queue-item span {
        display: block;
      }

      .queue-item span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 16px;
      }

      .prototype-toggle,
      .prototype-panel {
        display: none;
      }

      body.show-controls .prototype-toggle {
        position: fixed;
        z-index: 50;
        right: 14px;
        bottom: 14px;
        display: block;
        min-height: 42px;
        padding: 0 12px;
        border-style: dashed;
        color: var(--muted);
        font-size: 13px;
      }

      body.show-controls .prototype-panel.open {
        position: fixed;
        z-index: 49;
        right: 14px;
        bottom: 64px;
        display: grid;
        width: min(330px, calc(100vw - 28px));
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 12px;
        border: 1px dashed #7790b2;
        border-radius: 16px;
        background: #081221;
        box-shadow: var(--shadow);
      }

      .prototype-panel button {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 680px) {
        body {
          font-size: 17px;
        }

        .topbar {
          min-height: 68px;
          gap: 10px;
          padding: 9px 14px;
        }

        .station-mark {
          width: 44px;
          height: 44px;
          border-radius: 13px;
        }

        .station-label,
        .user,
        .top-button .button-label {
          display: none;
        }

        .mobile-queue-label {
          display: inline;
        }

        .station-name {
          overflow: hidden;
          font-size: 19px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .top-button {
          min-width: 50px;
          padding: 0 10px;
          justify-content: center;
        }

        .workspace {
          min-height: calc(100vh - 68px);
          padding: 18px 16px 24px;
        }

        .work-head {
          position: relative;
          display: block;
          padding-bottom: 16px;
        }

        .status {
          margin-bottom: 7px;
          font-size: 16px;
        }

        .order-number {
          font-size: 31px;
        }

        .order-copy {
          margin-top: 7px;
          font-size: 16px;
        }

        .detail-button {
          position: absolute;
          top: 0;
          right: 0;
          width: auto;
          padding: 0 12px;
          font-size: 15px;
        }

        .task {
          padding: 20px 0 18px;
        }

        .task-title {
          font-size: 38px;
        }

        .task-note {
          margin-top: 8px;
          font-size: 16px;
        }

        .facts {
          grid-template-columns: 1.15fr 1fr;
          margin-top: 16px;
        }

        .fact {
          min-height: 79px;
          padding: 12px 14px;
        }

        .fact:first-child {
          grid-row: span 2;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        .fact-value {
          font-size: 19px;
        }

        .fact-value.big {
          font-size: 38px;
        }

        .action-zone {
          position: sticky;
          z-index: 10;
          bottom: 0;
          margin: 0 -16px;
          padding: 14px 16px max(14px, env(safe-area-inset-bottom));
          border-top: 1px solid var(--line);
          background: rgb(7 16 30 / 97%);
        }

        .primary-button {
          min-height: 68px;
          font-size: 20px;
        }

        .secondary-row {
          margin-top: 9px;
        }

        .quiet-button {
          min-width: 0;
          flex: 1;
        }

        .alert-block {
          grid-template-columns: 1fr;
          gap: 10px;
          padding: 15px;
        }

        .choice-grid,
        .defect-form {
          grid-template-columns: 1fr;
        }

        .choice-button {
          min-height: 78px;
        }

        .batch-row,
        .lane-row {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        .row-button {
          width: 100%;
        }

        .row-owner {
          text-align: left;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar" aria-label="แถบสถานี">
      <div class="station-id">
        <div class="station-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M4 17h16M6 17V8l6-4 6 4v9M9 17v-5h6v5" />
          </svg>
        </div>
        <div>
          <p class="station-label">จอประจำสถานี</p>
          <p class="station-name" id="stationName">รีดร้อน</p>
        </div>
      </div>
      <div class="top-actions">
        <div class="user" aria-label="ผู้ใช้งาน ศรุจ ออนไลน์">
          <span class="online-dot" aria-hidden="true"></span>
          <span>ศรุจ</span>
        </div>
        <button class="top-button" type="button" data-open-dialog="queueDialog">
          <span class="button-label">คิวอื่น</span>
          <span class="mobile-queue-label">คิว</span>
          <span class="count" id="queueCount">3</span>
        </button>
      </div>
    </header>

    <main class="workspace" id="app" aria-live="polite"></main>

    <dialog id="queueDialog" aria-labelledby="queueTitle">
      <div class="dialog-head">
        <h2 id="queueTitle">คิวอื่น 3 งาน</h2>
        <button class="dialog-close" type="button" data-close-dialog aria-label="ปิด">×</button>
      </div>
      <div class="dialog-body">
        <div class="queue-item">
          <strong>ORD-2608-0009 · พร้อมรีด 36 ตัว</strong>
          <span>บริษัท วันเดย์ สปอร์ต จำกัด · เสื้อทีมวิ่ง</span>
        </div>
        <div class="queue-item">
          <strong>ORD-2608-0011 · รอ DTF</strong>
          <span>บริษัท เอ็มเจ ฟู้ดส์ จำกัด · รอรอบพิมพ์</span>
        </div>
        <div class="queue-item">
          <strong>ORD-2608-0008 · รอหัวหน้า</strong>
          <span>เสื้อดำ ไซส์ L ขาดจากยอดออเดอร์ 7 ตัว</span>
        </div>
      </div>
    </dialog>

    <dialog id="detailDialog" aria-labelledby="detailTitle">
      <div class="dialog-head">
        <h2 id="detailTitle">รายละเอียดงาน</h2>
        <button class="dialog-close" type="button" data-close-dialog aria-label="ปิด">×</button>
      </div>
      <div class="dialog-body" id="detailBody"></div>
    </dialog>

    <button class="prototype-toggle" id="prototypeToggle" type="button">Prototype states</button>
    <div class="prototype-panel" id="prototypePanel" aria-label="เลือกสถานะตัวอย่าง">
      <button type="button" data-state="ready">ready</button>
      <button type="button" data-state="blocked">blocked</button>
      <button type="button" data-state="handoff">handoff</button>
      <button type="button" data-state="qc">qc</button>
      <button type="button" data-state="dtf">dtf</button>
      <button type="button" data-state="multilane">multilane</button>
      <button type="button" data-state="stale">stale</button>
      <button type="button" data-state="unknown">unknown</button>
    </div>

    <script>
      const icons = {
        check: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="m5 12 4 4L19 6"/></svg>`,
        play: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="m8 5 11 7-11 7Z"/></svg>`,
        arrow: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>`,
        warn: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg>`,
        refresh: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.5-2.6L20 11M4 13l2.4 4.6A7 7 0 0 0 18 15"/></svg>`,
      };

      const params = new URLSearchParams(location.search);
      if (params.get("controls") === "1") document.body.classList.add("show-controls");

      function currentState() {
        return new URLSearchParams(location.search).get("state") || "ready";
      }

      function setQuery(updates) {
        const next = new URLSearchParams(location.search);
        Object.entries(updates).forEach(([key, value]) => {
          if (value === null || value === undefined || value === "") next.delete(key);
          else next.set(key, value);
        });
        history.pushState({}, "", `${location.pathname}?${next.toString()}`);
        render();
        document.querySelector("main h1")?.focus();
      }

      function status(label, tone = "", icon = icons.check) {
        return `<div class="status ${tone}"><span class="icon" aria-hidden="true">${icon}</span><span>${label}</span></div>`;
      }

      function head({ stateLabel, tone, icon, order, customer, product, details = true }) {
        return `
          <section class="work-head">
            <div>
              ${status(stateLabel, tone, icon)}
              <h1 class="order-number" tabindex="-1">${order}</h1>
              <p class="order-copy">${customer}<br><span class="product-name">${product}</span></p>
            </div>
            ${details ? `<button class="detail-button" type="button" data-open-dialog="detailDialog">รายละเอียด</button>` : ""}
          </section>`;
      }

      function facts(items) {
        return `<div class="facts">${items
          .map(
            (item) => `<div class="fact"><span class="fact-label">${item.label}</span><span class="fact-value ${item.className || ""}">${item.value}</span></div>`,
          )
          .join("")}</div>`;
      }

      function primary(label, action, className = "", icon = icons.play, disabled = false) {
        return `<button class="primary-button ${className}" type="button" data-action="${action}" ${disabled ? "disabled" : ""}><span class="button-content">${icon}<span>${label}</span></span></button>`;
      }

      function actions(primaryHtml, secondaryHtml = "") {
        return `<section class="action-zone">${primaryHtml}${secondaryHtml ? `<div class="secondary-row">${secondaryHtml}</div>` : ""}</section>`;
      }

      function setStation(name, queueCount = "3") {
        document.getElementById("stationName").textContent = name;
        document.getElementById("queueCount").textContent = queueCount;
      }

      function detailReady() {
        return `
          <div class="queue-item"><strong>ตำแหน่งพิมพ์</strong><span>กลางด้านหลัง · ขนาด A3</span></div>
          <div class="queue-item"><strong>เสื้อ</strong><span>สีกรม · S 12 / M 18 / L 16 / XL 8</span></div>
          <div class="queue-item"><strong>หมายเหตุ</strong><span>วางลายต่ำจากคอ 8 ซม.</span></div>`;
      }

      function renderReady() {
        setStation("รีดร้อน", "3");
        document.getElementById("detailBody").innerHTML = detailReady();
        return `
          ${head({ stateLabel: "พร้อมเริ่ม", order: "ORD-2608-0007", customer: "บริษัท นอร์ทสตาร์ รีเทล จำกัด", product: "เสื้อครบรอบสตูดิโอโยคะ" })}
          <section class="task">
            <p class="task-kicker">งานตรงหน้า</p>
            <h2 class="task-title">รีดร้อน</h2>
            ${facts([
              { label: "ต้องรีด", value: "54 ตัว", className: "big" },
              { label: "ตำแหน่ง", value: "ด้านหลัง" },
              { label: "แบบ", value: "รีดร้อน · A3" },
            ])}
          </section>
          ${actions(
            primary("เริ่มรีด 54 ตัว", "start-heat"),
            `<button class="quiet-button" type="button" data-action="report-problem">ทำต่อไม่ได้</button>`,
          )}`;
      }

      function renderWorking() {
        setStation("รีดร้อน", "3");
        document.getElementById("detailBody").innerHTML = detailReady();
        return `
          ${head({ stateLabel: "กำลังทำ", tone: "blue", order: "ORD-2608-0007", customer: "บริษัท นอร์ทสตาร์ รีเทล จำกัด", product: "เสื้อครบรอบสตูดิโอโยคะ" })}
          <section class="task">
            <p class="task-kicker">กำลังทำตอนนี้</p>
            <h2 class="task-title">รีดร้อน 54 ตัว</h2>
            ${facts([
              { label: "เป้าหมาย", value: "54 ตัว", className: "big" },
              { label: "ตำแหน่ง", value: "ด้านหลัง" },
              { label: "แบบ", value: "รีดร้อน · A3" },
            ])}
          </section>
          ${actions(
            primary("บันทึกว่ารีดครบ 54 ตัว", "finish-heat", "green", icons.check),
            `<button class="quiet-button" type="button" data-action="report-problem">ทำต่อไม่ได้</button>`,
          )}`;
      }

      function renderBlocked() {
        setStation("เตรียมเสื้อ", "2");
        document.getElementById("detailBody").innerHTML = `
          <div class="queue-item"><strong>เสื้อที่ขาด</strong><span>Anajak Polo สีดำ ไซส์ L</span></div>
          <div class="queue-item"><strong>ยอดออเดอร์</strong><span>40 ตัว · มีพร้อมใช้ 33 ตัว</span></div>
          <div class="queue-item"><strong>สถานะ</strong><span>แจ้งหัวหน้าแล้ว · ยังไม่ให้หยิบหรือเริ่มงาน</span></div>`;
        return `
          ${head({ stateLabel: "หยุด — รอหัวหน้า", tone: "red", icon: icons.warn, order: "ORD-2608-0008", customer: "บริษัท เซ็นทรัล เซลส์ จำกัด", product: "เสื้อโปโลทีมขาย" })}
          <section class="task">
            <p class="task-kicker">อย่าเริ่มงานนี้</p>
            <h2 class="task-title danger">เสื้อดำ L ขาดจากยอดออเดอร์ 7 ตัว</h2>
            ${facts([
              { label: "ยอดออเดอร์", value: "40 ตัว", className: "big" },
              { label: "มีพร้อมใช้", value: "33 ตัว" },
              { label: "ขาดจริง", value: "7 ตัว", className: "red" },
            ])}
            <div class="owner-line"><span class="owner-avatar" aria-hidden="true">ห</span><span>หัวหน้ากำลังรับเรื่อง · รอคำสั่งก่อนทำต่อ</span></div>
          </section>
          ${actions(primary("กลับคิวงาน", "back-queue", "", icons.arrow))}`;
      }

      function renderHandoff() {
        setStation("รีดร้อน", "3");
        document.getElementById("detailBody").innerHTML = detailReady();
        return `
          ${head({ stateLabel: "เสร็จแล้ว", order: "ORD-2608-0007", customer: "บริษัท นอร์ทสตาร์ รีเทล จำกัด", product: "เสื้อครบรอบสตูดิโอโยคะ" })}
          <section class="task">
            <p class="task-kicker">บันทึกแล้ว</p>
            <h2 class="task-title">รีดครบ 54 ตัว</h2>
            <div class="alert-block amber">
              <span class="alert-icon" aria-hidden="true">${icons.arrow}</span>
              <div><p class="alert-title">งานถัดไป: ตรวจ QC</p><p class="alert-copy">ออเดอร์นี้พร้อมตรวจต่อ และจะอยู่หน้านี้จนกว่าจะเลือก</p></div>
            </div>
          </section>
          ${actions(
            primary("ไปตรวจ QC ต่อ", "go-qc", "green", icons.arrow),
            `<button class="quiet-button" type="button" data-action="back-queue">กลับคิว</button>`,
          )}`;
      }

      function renderQc() {
        setStation("ตรวจ QC", "4");
        const mode = new URLSearchParams(location.search).get("mode");
        document.getElementById("detailBody").innerHTML = `
          <div class="queue-item"><strong>ยอดออเดอร์</strong><span>50 ตัว</span></div>
          <div class="queue-item"><strong>ผ่านแล้ว</strong><span>20 ตัว</span></div>
          <div class="queue-item"><strong>กองที่กำลังตรวจ</strong><span>30 ตัว</span></div>`;

        let decision = `
          <div class="choice-grid" aria-label="เลือกผลตรวจ">
            <button class="choice-button" type="button" data-action="qc-all-good"><strong>ทั้งหมดดี 30 ตัว</strong><span>เลือกแล้วจะมีหน้าทวนก่อนบันทึก</span></button>
            <button class="choice-button" type="button" data-action="qc-defect"><strong>พบของเสีย</strong><span>ระบุจำนวนเสีย แล้วระบบคำนวณของดี</span></button>
          </div>`;

        if (mode === "allgood") {
          decision = `
            <div class="confirm-panel">
              <h2>ยืนยันว่าผ่านทั้งหมด 30 ตัว</h2>
              <p>กองนี้ไม่มีของเสีย ระบบจะรวมเป็นผ่านแล้ว 50 จาก 50 ตัว</p>
              ${primary("ยืนยันผ่าน 30 ตัว", "qc-confirm-good", "green", icons.check)}
              <div class="secondary-row"><button class="quiet-button" type="button" data-action="qc-reset">กลับไปเลือกใหม่</button></div>
            </div>`;
        }

        if (mode === "defect") {
          const defect = Math.min(30, Math.max(1, Number(new URLSearchParams(location.search).get("defect")) || 1));
          const good = 30 - defect;
          decision = `
            <div class="confirm-panel">
              <h2>พบของเสียในกองนี้</h2>
              <div class="defect-form">
                <div class="field">
                  <span class="field-legend">ของเสียกี่ตัว</span>
                  <div class="stepper">
                    <button class="stepper-button" type="button" data-action="defect-minus" aria-label="ลดของเสีย">−</button>
                    <input id="defectCount" type="number" min="1" max="30" value="${defect}" inputmode="numeric" aria-label="จำนวนของเสีย" />
                    <button class="stepper-button" type="button" data-action="defect-plus" aria-label="เพิ่มของเสีย">+</button>
                  </div>
                </div>
                <div class="field">
                  <label for="defectReason">สาเหตุหลัก</label>
                  <select id="defectReason"><option>ลายพิมพ์มีปัญหา</option><option>เสื้อมีตำหนิ</option><option>รีดไม่ติด</option><option>อื่น ๆ</option></select>
                </div>
              </div>
              <div class="calculation"><span>กองนี้ผ่าน <strong id="goodCount">${good} ตัว</strong></span><span>เสีย <strong id="badCount">${defect} ตัว</strong></span><span>รวม <strong>30 ตัว</strong></span></div>
              ${primary(`บันทึก ผ่าน ${good} · เสีย ${defect}`, "qc-confirm-defect", "amber", icons.check)}
              <div class="secondary-row"><button class="quiet-button" type="button" data-action="qc-reset">กลับไปเลือกใหม่</button></div>
            </div>`;
        }

        return `
          ${head({ stateLabel: "พร้อมตรวจ", order: "ORD-2608-0010", customer: "บริษัท บลูโอเชียน จำกัด", product: "เสื้อกิจกรรมประจำปี" })}
          <section class="task">
            <p class="task-kicker">ตรวจเสื้อกองนี้</p>
            <h2 class="task-title">30 ตัว</h2>
            ${facts([
              { label: "ยอดออเดอร์", value: "50 ตัว", className: "big" },
              { label: "ผ่านแล้ว", value: "20 ตัว" },
              { label: "กองนี้", value: "30 ตัว" },
            ])}
            ${decision}
          </section>`;
      }

      function renderQcSuccess() {
        setStation("ตรวจ QC", "4");
        document.getElementById("detailBody").innerHTML = "";
        return `
          ${head({ stateLabel: "บันทึกแล้ว", order: "ORD-2608-0010", customer: "บริษัท บลูโอเชียน จำกัด", product: "เสื้อกิจกรรมประจำปี", details: false })}
          <section class="task">
            <p class="task-kicker">ตรวจครบแล้ว</p>
            <h2 class="task-title">ผ่าน QC 50 ตัว</h2>
            <div class="alert-block amber"><span class="alert-icon" aria-hidden="true">${icons.arrow}</span><div><p class="alert-title">งานถัดไป: แพ็กกล่อง</p><p class="alert-copy">ออเดอร์เดิมพร้อมทำต่อ</p></div></div>
          </section>
          ${actions(primary("ไปแพ็กกล่องต่อ", "back-queue", "green", icons.arrow))}`;
      }

      function renderDtf() {
        setStation("พิมพ์ DTF", "2");
        const view = new URLSearchParams(location.search);
        const firstPhase = view.get("first") || "printing";
        const secondPhase = view.get("second") || "cutting";
        const incomingPhase = view.get("incoming") || "new";
        document.getElementById("detailBody").innerHTML = `
          <div class="queue-item"><strong>รอบ FR-2608-0001</strong><span>หลายออเดอร์รวมในรอบเดียว · กำลังพิมพ์</span></div>
          <div class="queue-item"><strong>รอบ FR-2608-0002</strong><span>พิมพ์แล้ว · รอตัดและติดป้าย</span></div>`;

        const firstRow =
          firstPhase === "sent"
            ? `<span class="row-owner">ส่งรีดแล้ว</span>`
            : `<button class="row-button ${firstPhase === "printed" ? "amber" : ""}" type="button" data-action="${firstPhase === "printed" ? "dtf-first-cut" : "dtf-print-complete"}">${firstPhase === "printed" ? "ตัดและติดป้ายเสร็จ" : "พิมพ์จบทั้งม้วน"}</button>`;
        const secondRow =
          secondPhase === "sent"
            ? `<span class="row-owner">ส่งรีดแล้ว</span>`
            : `<button class="row-button amber" type="button" data-action="dtf-second-cut">ตัดและติดป้ายเสร็จ</button>`;
        const incomingRow =
          incomingPhase === "added"
            ? `<span class="row-owner">อยู่ในคิว · ยังไม่เริ่มพิมพ์</span>`
            : `<button class="row-button" type="button" data-action="dtf-add-incoming">เพิ่มงานนี้เข้ารอบ</button>`;
        return `
          ${head({ stateLabel: "มีงานต้องทำ 2 รอบ", tone: "blue", order: "คิวพิมพ์ DTF", customer: "งานรอบ · งานตัด · งานเข้าใหม่", product: "เลือกทำตามสถานะของแต่ละรอบ", details: true })}
          <section class="batch-list" aria-label="งาน DTF ตอนนี้">
            <article class="batch-row current">
              <div><p class="row-state ${firstPhase === "printed" ? "amber" : ""}">${firstPhase === "printing" ? "กำลังพิมพ์" : firstPhase === "printed" ? "พิมพ์แล้ว · รอตัด" : "ตัดและติดป้ายแล้ว"}</p><h2 class="row-title">FR-2608-0001</h2><p class="row-copy">3 ออเดอร์ · ฟิล์ม 8 เมตร</p></div>
              ${firstRow}
            </article>
            <article class="batch-row">
              <div><p class="row-state ${secondPhase === "sent" ? "" : "amber"}">${secondPhase === "sent" ? "ตัดและติดป้ายแล้ว" : "พิมพ์แล้ว · รอตัด"}</p><h2 class="row-title">FR-2608-0002</h2><p class="row-copy">2 ออเดอร์ · ตัดแยกและติดป้ายก่อนส่งรีด</p></div>
              ${secondRow}
            </article>
            <article class="batch-row">
              <div><p class="row-state blue">${incomingPhase === "added" ? "เพิ่มเข้าคิวรอบแล้ว" : "งานเข้าใหม่"}</p><h2 class="row-title">ORD-2608-0004</h2><p class="row-copy">${incomingPhase === "added" ? "อยู่ในคิวรอบ · ยังไม่ได้เริ่มพิมพ์" : "พร้อมเข้ารอบ DTF · ยังไม่ได้เริ่มหรือสร้างรอบให้"}</p></div>
              ${incomingRow}
            </article>
          </section>`;
      }

      function renderMultilane() {
        setStation("รีดร้อน", "3");
        document.getElementById("detailBody").innerHTML = `
          <div class="queue-item"><strong>Lane A</strong><span>หน้าอกซ้าย · ศรุจกำลังทำ</span></div>
          <div class="queue-item"><strong>Lane B</strong><span>ด้านหลัง · พร้อมทำเมื่อเลือกจากคิว</span></div>
          <div class="queue-item"><strong>Lane C</strong><span>แขนขวา · มอบหมายให้ มะลิ</span></div>`;
        return `
          ${head({ stateLabel: "กำลังทำ 1 งาน", tone: "blue", order: "ORD-2608-0012", customer: "บริษัท อัลฟ่า อีเวนต์ จำกัด", product: "เสื้อทีมงาน 3 ตำแหน่ง" })}
          <section class="lane-list" aria-label="งานหลาย lane ของออเดอร์นี้">
            <article class="lane-row current">
              <div><p class="row-state">ศรุจกำลังทำ</p><h2 class="row-title">หน้าอกซ้าย · 18/30 ตัว</h2><p class="row-copy">รีดร้อน · ขนาด A6</p></div>
              <button class="row-button" type="button" data-action="noop">บันทึกจำนวนที่รีด</button>
            </article>
            <article class="lane-row">
              <div><p class="row-state blue">พร้อม</p><h2 class="row-title">ด้านหลัง · 30 ตัว</h2><p class="row-copy">งานนี้พร้อม แต่ยังไม่ได้เริ่ม</p></div>
              <span class="row-owner">เลือกได้จากคิว</span>
            </article>
            <article class="lane-row">
              <div><p class="row-state muted">ส่งต่อให้คนอื่น</p><h2 class="row-title">แขนขวา · 30 ตัว</h2><p class="row-copy">งานนี้ไม่ใช่ของศรุจ</p></div>
              <span class="row-owner">ผู้รับงาน: มะลิ</span>
            </article>
          </section>`;
      }

      function renderStale() {
        setStation("รีดร้อน", "3");
        document.getElementById("detailBody").innerHTML = detailReady();
        return `
          ${head({ stateLabel: "ข้อมูลไม่สด", tone: "amber", icon: icons.warn, order: "ORD-2608-0007", customer: "บริษัท นอร์ทสตาร์ รีเทล จำกัด", product: "เสื้อครบรอบสตูดิโอโยคะ" })}
          <div class="alert-block amber"><span class="alert-icon" aria-hidden="true">${icons.warn}</span><div><p class="alert-title">ยังเริ่มงานไม่ได้</p><p class="alert-copy">อัปเดตล่าสุด 12:19 · เชื่อมต่อขาดช่วง กรุณาอัปเดตหน้าจอก่อน</p></div></div>
          <section class="task">
            <p class="task-kicker">ข้อมูลล่าสุดที่อ่านได้</p><h2 class="task-title">รีดร้อน</h2>
            ${facts([
              { label: "ต้องรีด", value: "54 ตัว", className: "big" },
              { label: "ตำแหน่ง", value: "ด้านหลัง" },
              { label: "แบบ", value: "รีดร้อน · A3" },
            ])}
          </section>
          ${actions(primary("อัปเดตหน้าจอ", "retry-ready", "amber", icons.refresh))}`;
      }

      function renderUnknown() {
        setStation("รีดร้อน", "—");
        document.getElementById("detailBody").innerHTML = "";
        return `
          ${head({ stateLabel: "กำลังตรวจผล", tone: "amber", icon: icons.refresh, order: "ORD-2608-0007", customer: "บริษัท นอร์ทสตาร์ รีเทล จำกัด", product: "เสื้อครบรอบสตูดิโอโยคะ", details: false })}
          <section class="task">
            <p class="task-kicker">อย่ากดบันทึกซ้ำ</p>
            <h2 class="task-title">กำลังตรวจว่าบันทึก 54 ตัวสำเร็จหรือไม่</h2>
            <div class="alert-block amber"><span class="alert-icon" aria-hidden="true">${icons.refresh}</span><div><p class="alert-title">ข้อมูลที่ส่งไว้ยังอยู่</p><p class="alert-copy">การเชื่อมต่อขาดก่อนรู้ผล ระบบจะตรวจคำสั่งเดิม ไม่สร้างรายการใหม่</p></div></div>
          </section>
          ${actions(
            primary("ตรวจผลอีกครั้ง", "resolve-unknown", "amber", icons.refresh),
            `<button class="quiet-button" type="button" disabled>กลับคิวหลังรู้ผล</button>`,
          )}`;
      }

      function render() {
        const state = currentState();
        const renderers = {
          ready: renderReady,
          working: renderWorking,
          blocked: renderBlocked,
          handoff: renderHandoff,
          qc: renderQc,
          "qc-success": renderQcSuccess,
          dtf: renderDtf,
          multilane: renderMultilane,
          stale: renderStale,
          unknown: renderUnknown,
        };
        document.getElementById("app").innerHTML = (renderers[state] || renderReady)();
      }

      document.addEventListener("click", (event) => {
        const open = event.target.closest("[data-open-dialog]");
        if (open) document.getElementById(open.dataset.openDialog)?.showModal();

        const close = event.target.closest("[data-close-dialog]");
        if (close) close.closest("dialog")?.close();

        const stateButton = event.target.closest("[data-state]");
        if (stateButton) setQuery({ state: stateButton.dataset.state, mode: null, defect: null });

        const action = event.target.closest("[data-action]")?.dataset.action;
        if (!action) return;
        if (action === "start-heat") setQuery({ state: "working" });
        if (action === "finish-heat") setQuery({ state: "handoff" });
        if (action === "report-problem") setQuery({ state: "blocked" });
        if (action === "go-qc") setQuery({ state: "qc", mode: null });
        if (action === "qc-all-good") setQuery({ state: "qc", mode: "allgood" });
        if (action === "qc-defect") setQuery({ state: "qc", mode: "defect", defect: "1" });
        if (action === "qc-reset") setQuery({ state: "qc", mode: null, defect: null });
        if (action === "qc-confirm-good" || action === "qc-confirm-defect") setQuery({ state: "qc-success", mode: null, defect: null });
        if (action === "retry-ready") setQuery({ state: "ready" });
        if (action === "resolve-unknown") setQuery({ state: "handoff" });
        if (action === "dtf-print-complete") setQuery({ state: "dtf", first: "printed" });
        if (action === "dtf-first-cut") setQuery({ state: "dtf", first: "sent" });
        if (action === "dtf-second-cut") setQuery({ state: "dtf", second: "sent" });
        if (action === "dtf-add-incoming") setQuery({ state: "dtf", incoming: "added" });
        if (action === "back-queue") document.getElementById("queueDialog")?.showModal();
        if (action === "defect-minus" || action === "defect-plus") {
          const input = document.getElementById("defectCount");
          const value = Math.min(30, Math.max(1, Number(input.value) + (action === "defect-plus" ? 1 : -1)));
          setQuery({ state: "qc", mode: "defect", defect: String(value) });
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.id !== "defectCount") return;
        const value = Math.min(30, Math.max(1, Number(event.target.value) || 1));
        setQuery({ state: "qc", mode: "defect", defect: String(value) });
      });

      document.getElementById("prototypeToggle").addEventListener("click", () => {
        document.getElementById("prototypePanel").classList.toggle("open");
      });

      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
